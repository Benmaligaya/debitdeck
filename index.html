r ROU ₱42,000","Dr interest expense and Cr lease liability ₱42,000"],"correctIndex":1,"solutionSteps":["Step 1: A change in the contract’s index-based cash flows remeasures the liability, generally using the unchanged rate here.","Step 2: Increase the asset by the same amount."],"boardTrap":"Do not treat the PV adjustment as a current-period cash payment or interest charge.","citation":"PFRS 16 paras. 39 and 42–43"},{"id":"far-026","subject":"FAR","topic":"Lessee Accounting","difficulty":"Difficult","question":"A lease modification adds a distinct floor and raises consideration by an amount commensurate with the stand-alone rental price. What is the accounting?","choices":["Account for a separate lease for the added right.","Remeasure the old lease only at its original discount rate.","Recognize an immediate termination gain for the old lease.","Ignore the addition until the current lease ends."],"correctIndex":0,"solutionSteps":["Step 1: Check the increase in scope and commensurate stand-alone consideration.","Step 2: Both conditions are met, so account for a separate lease."],"boardTrap":"A modification does not always remeasure the existing lease.","citation":"PFRS 16 paras. 44 and 46"},{"id":"far-027","subject":"FAR","topic":"Lessee Accounting","difficulty":"Difficult","question":"A reduction in leased area extinguishes 25% of the right of use and related liability on a proportional basis. Pre-modification ROU is ₱800,000 and lease liability ₱960,000. Before any further remeasurement, what gain or loss arises?","choices":["₱40,000 loss","₱160,000 gain","₱0","₱40,000 gain"],"correctIndex":3,"solutionSteps":["Step 1: Derecognize ₱200,000 of ROU and ₱240,000 of liability.","Step 2: The excess liability reduction is a ₱40,000 gain."],"boardTrap":"Do not put the full difference in carrying amounts into profit or loss.","citation":"PFRS 16 para. 46(a)"},{"id":"far-028","subject":"FAR","topic":"Lessee Accounting","difficulty":"Difficult","question":"At commencement, unpaid rentals have present value ₱450,000. The lessee pays ₱30,000 up front and receives a ₱10,000 incentive at commencement. Interest is 10%, year-end payment ₱130,000, and five-year ROU depreciation applies. What are closing ROU and lease liability?","choices":["₱360,000 and ₱365,000","₱376,000 and ₱385,000","₱376,000 and ₱365,000","₱384,000 and ₱320,000"],"correctIndex":2,"solutionSteps":["Step 1: Initial ROU ₱470,000 less ₱94,000 depreciation = ₱376,000.","Step 2: Liability ₱450,000 + ₱45,000 − ₱130,000 = ₱365,000."],"boardTrap":"Commencement payments and incentives adjust the asset without being added to unpaid future rentals.","citation":"PFRS 16 paras. 24, 26 and 36"},{"id":"far-029","subject":"FAR","topic":"Financial Instruments & ECL","difficulty":"Easy","question":"Which loss horizon applies to eligible trade receivables with no significant financing component?","choices":["Only losses expected within the next 12 months","Losses recognized only after default","Lifetime ECL from initial recognition","No allowance unless transferred to collections"],"correctIndex":2,"solutionSteps":["Step 1: Identify eligible receivables under the simplified approach.","Step 2: Measure lifetime loss from inception."],"boardTrap":"The stage-one horizon in the general model does not govern these balances.","citation":"PFRS 9 para. 5.5.15"},{"id":"far-030","subject":"FAR","topic":"Financial Instruments & ECL","difficulty":"Easy","question":"Which general-model event normally moves a sound asset from 12-month to lifetime ECL?","choices":["Any year-end reclassification to current","Significant increase in credit risk since initial recognition","Any shortening of contractual maturity","Only a court declaration of insolvency"],"correctIndex":1,"solutionSteps":["Step 1: Compare credit risk of default against initial recognition.","Step 2: A significant increase, rather than confirmed impairment, triggers lifetime measurement."],"boardTrap":"Waiting until actual default misses stage two.","citation":"PFRS 9 paras. 5.5.3–.5"},{"id":"far-031","subject":"FAR","topic":"Financial Instruments & ECL","difficulty":"Easy","question":"When should an entity directly reduce gross carrying amount for a write-off?","choices":["When there is no reasonable expectation of recovery in whole or part.","Whenever a receivable first becomes past due.","Only when legal rights expire even if recovery is unrealistic.","When a general allowance is first recognized."],"correctIndex":0,"solutionSteps":["Step 1: Evaluate reasonable recovery expectations.","Step 2: Write off the unrecoverable whole or portion."],"boardTrap":"A provision and a write-off are distinct events.","citation":"PFRS 9 para. 5.4.4"},{"id":"far-032","subject":"FAR","topic":"Financial Instruments & ECL","difficulty":"Easy","question":"What should an ECL estimate represent?","choices":["The single most likely unpaid amount only","The worst outcome regardless of probability","Undiscounted historical defaults only","Probability-weighted cash shortfalls reflecting time value and reasonable supportable information"],"correctIndex":3,"solutionSteps":["Step 1: Consider a range of possible outcomes and available forward-looking information.","Step 2: Reflect time value in measuring cash shortfalls."],"boardTrap":"A low-probability outcome may matter even if the most likely outcome has no loss.","citation":"PFRS 9 para. 5.5.17"},{"id":"far-033","subject":"FAR","topic":"Financial Instruments & ECL","difficulty":"Moderate","question":"A provision matrix applies 1% to ₱520,000 current AR and 9% to ₱160,000 overdue AR. What ending allowance is required?","choices":["₱14,400","₱61,200","₱5,200","₱19,600"],"correctIndex":3,"solutionSteps":["Step 1: Current ECL = ₱5,200.","Step 2: Overdue ECL = ₱14,400, giving ₱19,600 total."],"boardTrap":"Current buckets can have expected losses even before default.","citation":"PFRS 9 paras. 5.5.15 and B5.5.35"},{"id":"far-034","subject":"FAR","topic":"Financial Instruments & ECL","difficulty":"Moderate","question":"Required ending allowance is ₱74,000. The ledger already has an allowance credit of ₱29,000 after write-offs. What adjustment is needed?","choices":["Dr impairment loss, Cr allowance ₱74,000","Dr impairment loss, Cr allowance ₱103,000","Dr impairment loss, Cr allowance ₱45,000","Dr allowance, Cr impairment gain ₱45,000"],"correctIndex":2,"solutionSteps":["Step 1: Compute the change from current balance to required ending credit.","Step 2: Increase the allowance by ₱45,000."],"boardTrap":"Ending balance is not the amount of the adjusting entry.","citation":"PFRS 9 para. 5.5.8"},{"id":"far-035","subject":"FAR","topic":"Financial Instruments & ECL","difficulty":"Moderate","question":"Gross trade AR includes a ₱42,000 customer balance fully provided for and no longer recoverable. Which write-off entry uses the allowance method?","choices":["Dr impairment expense and Cr cash ₱42,000","Dr loss allowance and Cr trade AR ₱42,000","Dr trade AR and Cr allowance ₱42,000","Dr allowance and Cr revenue ₱42,000"],"correctIndex":1,"solutionSteps":["Step 1: The loss is already included in the allowance.","Step 2: Reduce allowance and gross receivables without another impairment charge."],"boardTrap":"Charging expense again double counts the previously recognized loss.","citation":"PFRS 9 para. 5.4.4"},{"id":"far-036","subject":"FAR","topic":"Financial Instruments & ECL","difficulty":"Moderate","question":"At year-end, a credit-impaired asset has a contractual ₱550,000 cash flow due in one year. Expected recovery then is ₱484,000. Original EIR is 10%. What is ECL based on the given expectation?","choices":["₱60,000","₱66,000","₱50,000","₱72,600"],"correctIndex":0,"solutionSteps":["Step 1: Future cash shortfall = ₱66,000.","Step 2: Discount at original EIR to obtain ₱60,000."],"boardTrap":"Discount the shortfall rather than measuring the difference at undiscounted maturity.","citation":"PFRS 9 paras. 5.5.17 and B5.5.44"},{"id":"far-037","subject":"FAR","topic":"Financial Instruments & ECL","difficulty":"Moderate","question":"A debt liability begins at ₱940,000 amortized cost. Face is ₱1 million, the cash coupon is ₱60,000, and EIR is 8%. What is closing amortized cost?","choices":["₱955,200","₱1,015,200","₱924,800","₱960,000"],"correctIndex":0,"solutionSteps":["Step 1: Effective interest = ₱75,200.","Step 2: Add it and subtract ₱60,000 cash coupon, resulting in ₱955,200."],"boardTrap":"Interest uses opening amortized cost rather than face value.","citation":"PFRS 9 Appendix A and para. B5.4.1"},{"id":"far-038","subject":"FAR","topic":"Financial Instruments & ECL","difficulty":"Moderate","question":"A debt instrument passes SPPI. Management holds it within a portfolio managed both to collect contractual cash flows and to sell. What is the ordinary classification?","choices":["Amortized cost","Equity FVOCI election","Always FVTPL regardless of business model","Debt FVOCI"],"correctIndex":3,"solutionSteps":["Step 1: Identify a collect-and-sell business model plus SPPI.","Step 2: Debt FVOCI is the corresponding category absent a valid contrary designation."],"boardTrap":"SPPI alone does not distinguish amortized cost from FVOCI.","citation":"PFRS 9 paras. 4.1.2–4.1.2A"},{"id":"far-039","subject":"FAR","topic":"Financial Instruments & ECL","difficulty":"Difficult","question":"A purchased performing loan deteriorates significantly but is not credit-impaired at year-end. Gross carrying amount is ₱800,000 and original EIR 9%. What subsequent interest basis and loss horizon apply while it remains in this condition?","choices":["Interest on net and lifetime ECL","₱72,000 interest on gross and 12-month ECL","₱72,000 interest on gross and lifetime ECL","No interest until credit improves"],"correctIndex":2,"solutionSteps":["Step 1: Significant credit deterioration triggers lifetime ECL.","Step 2: For a non-credit-impaired asset, apply EIR to gross carrying amount."],"boardTrap":"Stage two does not automatically change the interest base to net.","citation":"PFRS 9 paras. 5.5.3–.5 and 5.4.1(b)"},{"id":"far-040","subject":"FAR","topic":"Financial Instruments & ECL","difficulty":"Difficult","question":"A simplified ECL matrix gives ₱30,000 baseline loss in a 70% scenario and ₱90,000 downturn loss in a 30% scenario, both already discounted. Post-write-off allowance credit is ₱40,000. What adjustment is needed?","choices":["₱48,000 impairment loss","₱8,000 impairment loss","₱10,000 impairment reversal","₱50,000 impairment loss"],"correctIndex":1,"solutionSteps":["Step 1: Weighted ending ECL = ₱21,000 + ₱27,000 = ₱48,000.","Step 2: Increase existing ₱40,000 by ₱8,000."],"boardTrap":"Do not use the most likely scenario alone or rebook the entire allowance.","citation":"PFRS 9 paras. 5.5.15 and 5.5.17"},{"id":"far-041","subject":"FAR","topic":"Financial Instruments & ECL","difficulty":"Difficult","question":"A debt instrument is at FVOCI. Year-end quoted fair value is ₱950,000 and ECL is ₱34,000. How does ECL affect presentation?","choices":["Carry the asset at ₱916,000 and recognize the difference only in OCI.","Recognize impairment in profit or loss with the loss allowance in OCI without reducing the asset below ₱950,000.","Carry at ₱950,000 and omit impairment.","Use the irrevocable equity election and omit ECL."],"correctIndex":1,"solutionSteps":["Step 1: Recognize ECL through profit or loss for debt FVOCI.","Step 2: Do not deduct the loss allowance from the fair-value carrying amount in financial position."],"boardTrap":"The amortized-cost contra-asset presentation does not carry over directly.","citation":"PFRS 9 paras. 4.1.2A, 5.5.2 and 5.5.8"},{"id":"far-042","subject":"FAR","topic":"Financial Instruments & ECL","difficulty":"Difficult","question":"A loan that was not POCI becomes credit-impaired before the current interest period. Opening gross amount is ₱1 million, loss allowance ₱180,000, EIR 10%. What interest belongs to the year under the net basis?","choices":["₱82,000","₱100,000","₱18,000","₱118,000"],"correctIndex":0,"solutionSteps":["Step 1: Opening amortized cost is ₱1 million less ₱180,000.","Step 2: Apply 10% to ₱820,000 = ₱82,000."],"boardTrap":"Gross interest is used while a non-POCI loan is unimpaired, but net basis applies after credit impairment.","citation":"PFRS 9 paras. 5.4.1(b) and 5.5.8"},{"id":"far-043","subject":"FAR","topic":"PPE & Borrowing Costs","difficulty":"Easy","question":"Which item generally enters initial machine cost?","choices":["Training for operators","Opening ceremony costs","Start-up losses after readiness","Nonrefundable import duties"],"correctIndex":3,"solutionSteps":["Step 1: Costs include nonrefundable taxes and qualifying directly attributable amounts.","Step 2: Training and start-up costs are generally expensed."],"boardTrap":"Timing near acquisition does not make an expense necessary to bring the asset to intended condition.","citation":"PAS 16 paras. 16–20"},{"id":"far-044","subject":"FAR","topic":"PPE & Borrowing Costs","difficulty":"Easy","question":"When does capitalization of qualifying borrowing costs begin?","choices":["At loan signing alone.","At the earliest initial budget approval.","When expenditures, borrowing costs, and preparation activities are all underway.","When the project is fully available for use."],"correctIndex":2,"solutionSteps":["Step 1: Check all three commencement conditions.","Step 2: The start is when they coexist."],"boardTrap":"Borrowing before expenditure or preparation does not by itself start capitalization.","citation":"PAS 23 paras. 8 and 17"},{"id":"far-045","subject":"FAR","topic":"PPE & Borrowing Costs","difficulty":"Easy","question":"Where is a first upward PPE revaluation recognized, assuming no earlier revaluation loss?","choices":["Ordinary sales revenue","Retained earnings directly","OCI and revaluation surplus","Other income in profit or loss"],"correctIndex":2,"solutionSteps":["Step 1: Check whether there is a prior profit-or-loss decrease to reverse.","Step 2: Absent one, recognize in OCI and accumulate surplus."],"boardTrap":"A higher carrying amount does not normally affect current earnings in this scenario.","citation":"PAS 16 paras. 39–40"},{"id":"far-046","subject":"FAR","topic":"PPE & Borrowing Costs","difficulty":"Easy","question":"What happens to borrowing cost capitalization during an extended abnormal suspension of active development?","choices":["Continue because the loan still accrues.","Suspend capitalization.","Cease permanently for the whole project.","Capitalize interest only if paid in cash."],"correctIndex":1,"solutionSteps":["Step 1: Identify an extended interruption of active development.","Step 2: Suspend until qualifying activity resumes."],"boardTrap":"Necessary delays inherent in preparing an asset differ from abnormal suspension.","citation":"PAS 23 paras. 20–21"},{"id":"far-047","subject":"FAR","topic":"PPE & Borrowing Costs","difficulty":"Moderate","question":"A machine costs ₱900,000 with ₱65,000 site preparation, ₱28,000 operator training, and ₱12,000 freight. What initial cost is recognized?","choices":["₱977,000","₱1,005,000","₱965,000","₱912,000"],"correctIndex":0,"solutionSteps":["Step 1: Add preparation and freight to purchase price.","Step 2: Exclude training, giving ₱977,000."],"boardTrap":"Training staff does not bring the machine itself to the necessary condition.","citation":"PAS 16 paras. 16–19"},{"id":"far-048","subject":"FAR","topic":"PPE & Borrowing Costs","difficulty":"Moderate","question":"A machine costs ₱920,000, residual value ₱80,000, useful life eight years. It is ready July 1 but first used September 1. Assuming monthly straight line, what depreciation for the calendar year?","choices":["₱35,000","₱57,500","₱105,000","₱52,500"],"correctIndex":3,"solutionSteps":["Step 1: Depreciable amount ₱840,000 ÷ 8 = ₱105,000 annually.","Step 2: Use six months from readiness = ₱52,500."],"boardTrap":"Do not start at first production or depreciate residual value.","citation":"PAS 16 paras. 50–55"},{"id":"far-049","subject":"FAR","topic":"PPE & Borrowing Costs","difficulty":"Moderate","question":"PPE cost ₱1.1 million, accumulated depreciation ₱340,000, and first revaluation fair value ₱920,000. How much gain goes to OCI?","choices":["₱180,000","₱920,000","₱340,000","₱160,000"],"correctIndex":3,"solutionSteps":["Step 1: Pre-revaluation carrying amount is ₱760,000.","Step 2: Fair value exceeds it by ₱160,000."],"boardTrap":"Comparing fair value with gross cost confuses book value with historical acquisition price.","citation":"PAS 16 paras. 35 and 39"},{"id":"far-050","subject":"FAR","topic":"PPE & Borrowing Costs","difficulty":"Moderate","question":"A specific construction loan incurs ₱136,000 qualifying interest. Temporary investment of the unused proceeds earns ₱16,000 during the period. What amount is capitalized?","choices":["₱136,000","₱152,000","₱120,000","₱16,000"],"correctIndex":2,"solutionSteps":["Step 1: Use actual qualifying borrowing costs.","Step 2: Deduct temporary-investment income, leaving ₱120,000."],"boardTrap":"Interest on proceeds temporarily invested offsets specific-loan borrowing costs.","citation":"PAS 23 para. 12"},{"id":"far-051","subject":"FAR","topic":"PPE & Borrowing Costs","difficulty":"Moderate","question":"General qualifying borrowings are ₱3 million at 8% and ₱2 million at 11% throughout the year. What capitalization rate applies before the borrowing-cost cap?","choices":["9.5%","9.2%","8.0%","11.0%"],"correctIndex":1,"solutionSteps":["Step 1: Weighted interest is ₱240,000 + ₱220,000 = ₱460,000.","Step 2: Divide by ₱5 million = 9.2%."],"boardTrap":"A simple average treats both principal balances as equal.","citation":"PAS 23 para. 14"},{"id":"far-052","subject":"FAR","topic":"PPE & Borrowing Costs","difficulty":"Moderate","question":"Equipment with carrying amount ₱236,000 is sold for ₱280,000, with ₱6,000 disposal costs. What disposal result arises?","choices":["₱38,000 gain","₱44,000 gain","₱38,000 loss","₱274,000 gain"],"correctIndex":0,"solutionSteps":["Step 1: Net disposal proceeds are ₱274,000.","Step 2: Subtract carrying amount to recognize ₱38,000 gain."],"boardTrap":"Do not compare carrying amount with gross proceeds or present the whole inflow as gain.","citation":"PAS 16 paras. 67–71"},{"id":"far-053","subject":"FAR","topic":"PPE & Borrowing Costs","difficulty":"Difficult","question":"A revalued building has ₱95,000 surplus relating to that asset. A new valuation is ₱150,000 below its carrying amount. How is the decrease recognized?","choices":["₱95,000 in OCI and ₱55,000 in profit or loss","All ₱150,000 in OCI","All ₱150,000 in profit or loss","₱55,000 in OCI and ₱95,000 in profit or loss"],"correctIndex":0,"solutionSteps":["Step 1: Use the surplus relating to that asset to absorb ₱95,000 in OCI.","Step 2: Recognize the remaining ₱55,000 in profit or loss."],"boardTrap":"Surplus from unrelated assets cannot absorb this decrease.","citation":"PAS 16 paras. 39–40"},{"id":"far-054","subject":"FAR","topic":"PPE & Borrowing Costs","difficulty":"Difficult","question":"An asset’s book value is revalued from ₱600,000 to ₱840,000. Residual value is zero and remaining life six years. The entity transfers realized surplus annually. What are annual depreciation and direct equity transfer?","choices":["₱100,000 depreciation and ₱40,000 transfer through profit or loss","₱140,000 depreciation and ₱240,000 annual transfer","₱100,000 depreciation and no transfer","₱140,000 depreciation and ₱40,000 transfer to retained earnings"],"correctIndex":3,"solutionSteps":["Step 1: Depreciate revalued amount over six years, or ₱140,000.","Step 2: Excess over old ₱100,000 may transfer directly to retained earnings under the stated policy."],"boardTrap":"The transfer is equity-to-equity. It does not reduce depreciation.","citation":"PAS 16 paras. 39–41 and 50–51"},{"id":"far-055","subject":"FAR","topic":"PPE & Borrowing Costs","difficulty":"Difficult","question":"A qualifying asset uses general borrowing at 10%. Spend ₱1.2 million January 1 and ₱600,000 October 1. A prolonged abnormal standstill covered April–June. All conditions otherwise apply through year-end and the cap is not binding. How much interest is capitalized?","choices":["₱135,000","₱120,000","₱105,000","₱90,000"],"correctIndex":2,"solutionSteps":["Step 1: Weight January spend by 9/12 and October spend by 3/12.","Step 2: 10% of ₱1,050,000 weighted spending is ₱105,000."],"boardTrap":"Interest during abnormal suspension is excluded even though the borrowings continue.","citation":"PAS 23 paras. 14 and 17–22"},{"id":"far-056","subject":"FAR","topic":"PPE & Borrowing Costs","difficulty":"Difficult","question":"A January inspection before authorization confirms major damage occurred December 28. The machine was still recorded at full carrying amount. A separate machine is destroyed by a January fire. How are the events treated at December 31?","choices":["Adjust both because both were known before authorization.","Adjust for the December damage and disclose the January fire if material.","Disclose both without adjusting.","Adjust the January fire and leave the December damage unchanged."],"correctIndex":1,"solutionSteps":["Step 1: First identify when the condition arose. December damage existed at reporting date.","Step 2: The January fire is a new condition. Disclose it if material."],"boardTrap":"The date of discovery does not establish the date the condition arose.","citation":"PAS 10 paras. 8–9 and PAS 16 paras. 63 and 67"},{"id":"far-057","subject":"FAR","topic":"Shareholders’ Equity","difficulty":"Easy","question":"Where are reacquired own shares classified?","choices":["Investment asset","Deduction from equity","Finance cost","Other comprehensive income asset"],"correctIndex":1,"solutionSteps":["Step 1: Identify an instrument issued by the entity itself.","Step 2: Treat reacquisition as a deduction from equity."],"boardTrap":"Securities bought from another issuer could be investments. Treasury shares are different.","citation":"PAS 32 para. 33"},{"id":"far-058","subject":"FAR","topic":"Shareholders’ Equity","difficulty":"Easy","question":"How are directly attributable incremental costs of a completed equity issue recognized, net of applicable tax benefit?","choices":["Deduction from equity","Operating expense in all cases","Capitalized as prepaid finance costs","As part of revenue"],"correctIndex":0,"solutionSteps":["Step 1: Determine incremental direct attribution to the completed issue.","Step 2: Deduct qualifying costs from equity."],"boardTrap":"Costs of abandoned transactions or nonincremental costs differ.","citation":"PAS 32 paras. 35–37"},{"id":"far-059","subject":"FAR","topic":"Shareholders’ Equity","difficulty":"Easy","question":"A cash dividend is declared after year-end and before authorization. What liability existed at year-end solely for this declaration?","choices":["The whole dividend","Only the amount paid before authorization","Half the declared amount","None"],"correctIndex":3,"solutionSteps":["Step 1: Determine whether a present obligation existed at reporting date.","Step 2: A subsequent declaration does not create a year-end liability."],"boardTrap":"Knowledge before authorization does not backdate the dividend.","citation":"PAS 10 paras. 12–13"},{"id":"far-060","subject":"FAR","topic":"Shareholders’ Equity","difficulty":"Easy","question":"What denominator generally applies to basic EPS?","choices":["Year-end ordinary shares authorized","Ordinary shares issued on day one irrespective of changes","Time-weighted ordinary shares outstanding","Paid-in capital expressed in pesos"],"correctIndex":2,"solutionSteps":["Step 1: Identify ordinary shares actually outstanding in each period.","Step 2: Weight for time outstanding, subject to retrospective bonus adjustments."],"boardTrap":"Treasury shares are not outstanding.","citation":"PAS 33 paras. 19–21"},{"id":"far-061","subject":"FAR","topic":"Shareholders’ Equity","difficulty":"Easy","question":"Where is a gain on reissue of an entity’s own shares recognized?","choices":["Sales revenue","Other income in profit or loss","Directly within equity","A revaluation gain in OCI"],"correctIndex":2,"solutionSteps":["Step 1: Classify the reissue as an equity transaction.","Step 2: Recognize consideration and related differences within equity."],"boardTrap":"The reissue price exceeding cost is not an operating gain.","citation":"PAS 32 para. 33"},{"id":"far-062","subject":"FAR","topic":"Shareholders’ Equity","difficulty":"Moderate","question":"A company issues 24,000 ₱10 shares at ₱17. Direct qualifying costs are ₱20,000. How much net total equity increases, ignoring tax?","choices":["₱408,000","₱388,000","₱240,000","₱148,000"],"correctIndex":1,"solutionSteps":["Step 1: Gross proceeds are ₱408,000.","Step 2: Subtract costs of ₱20,000, yielding ₱388,000 in total."],"boardTrap":"₱148,000 is net premium only, rather than total equity created.","citation":"PAS 32 paras. 35–37"},{"id":"far-063","subject":"FAR","topic":"Shareholders’ Equity","difficulty":"Moderate","question":"An issuer reissues 6,000 treasury shares carried at ₱44 per share for ₱49 per share. What net increase in total equity results?","choices":["₱294,000","₱30,000","₱264,000","₱0"],"correctIndex":0,"solutionSteps":["Step 1: Receive 6,000 × ₱49 = ₱294,000.","Step 2: Remove the ₱264,000 contra-equity carrying amount and credit ₱30,000 within equity."],"boardTrap":"The premium alone understates the net increase.","citation":"PAS 32 para. 33"},{"id":"far-064","subject":"FAR","topic":"Shareholders’ Equity","difficulty":"Moderate","question":"Ordinary shares outstanding are 120,000 at January 1 and 180,000 after a July 1 cash issue. What is the weighted number using monthly weighting?","choices":["180,000","120,000","60,000","150,000"],"correctIndex":3,"solutionSteps":["Step 1: Weight 120,000 shares for six months and 180,000 for six months.","Step 2: Sum 60,000 + 90,000 = 150,000."],"boardTrap":"Cash-issued shares do not receive full-year weight.","citation":"PAS 33 paras. 19–21"},{"id":"far-065","subject":"FAR","topic":"Shareholders’ Equity","difficulty":"Moderate","question":"Profit attributable to the parent before deduction of a ₱60,000 current cumulative preference dividend is ₱760,000. Weighted ordinary shares are 350,000. What is basic EPS?","choices":["₱2.17","₱2.34","₱0.17","₱2.00"],"correctIndex":3,"solutionSteps":["Step 1: Ordinary earnings = ₱760,000 − ₱60,000 = ₱700,000.","Step 2: Divide by 350,000 shares, yielding ₱2.00."],"boardTrap":"Cumulative preference entitlement for the period is deducted even if not declared.","citation":"PAS 33 paras. 12–14"},{"id":"far-066","subject":"FAR","topic":"Shareholders’ Equity","difficulty":"Difficult","question":"A 2-for-1 ordinary share split occurs after year-end before authorization. There were 200,000 shares all year and ordinary profit was ₱1.6 million. How is basic EPS shown for that year?","choices":["₱8.00","₱6.00","₱4.00","₱0 until the next reporting period"],"correctIndex":2,"solutionSteps":["Step 1: Retrospectively adjust the denominator to 400,000 shares.","Step 2: Divide ₱1.6 million by 400,000 = ₱4.00."],"boardTrap":"The share-count restatement is required even though the split was subsequent.","citation":"PAS 33 paras. 26–28 and 64"},{"id":"far-067","subject":"FAR","topic":"Shareholders’ Equity","difficulty":"Difficult","question":"Basic earnings and shares are ₱900,000 and 300,000. Assumed conversion of bonds would add ₱150,000 after-tax interest and 40,000 shares. What is diluted EPS from this instrument?","choices":["₱3.09. Include interest and shares.","₱3.00. Exclude it as antidilutive.","₱2.65. Include shares without interest.","₱3.50. Include only the added interest."],"correctIndex":1,"solutionSteps":["Step 1: Basic EPS is ₱3.00. The if-converted amount is ₱1,050,000 ÷ 340,000 = ₱3.09.","Step 2: Exclude the bonds because including them increases EPS."],"boardTrap":"Potential ordinary shares do not automatically enter diluted EPS.","citation":"PAS 33 paras. 33 and 41–43"},{"id":"far-068","subject":"FAR","topic":"Shareholders’ Equity","difficulty":"Difficult","question":"A company issued shares for ₱4 million with ₱140,000 qualifying direct costs and ₱30,000 costs for a separate abandoned issue. It then repurchased ₱380,000 of shares. Ignoring tax, what is net direct equity movement from these transactions before any profit effect?","choices":["₱3,480,000 increase","₱3,450,000 increase","₱3,620,000 increase","₱3,860,000 increase"],"correctIndex":0,"solutionSteps":["Step 1: Deduct ₱140,000 from issued equity and ₱380,000 for treasury shares.","Step 2: Handle the abandonment cost through profit or loss, outside the requested direct change."],"boardTrap":"The abandoned issue is not a successful equity transaction.","citation":"PAS 32 paras. 33 and 35–37"},{"id":"far-069","subject":"FAR","topic":"Shareholders’ Equity","difficulty":"Difficult","question":"On January 1, 100,000 shares were outstanding. Another 40,000 were issued for cash April 1. A 20% bonus issue occurred October 1 applying to all outstanding shares. What time-weighted denominator applies?","choices":["156,000","138,000","168,000","130,000"],"correctIndex":0,"solutionSteps":["Step 1: Before bonus retrospectivity, weight 100,000 for three months and 140,000 for nine = 130,000.","Step 2: Multiply by 1.20 = 156,000."],"boardTrap":"The bonus element affects earlier periods. The April cash issue remains time-weighted.","citation":"PAS 33 paras. 19–21 and 26–28"},{"id":"far-070","subject":"FAR","topic":"Shareholders’ Equity","difficulty":"Difficult","question":"An issuer labels an instrument preference shares. It must redeem them for a fixed ₱2 million after five years. How is the mandatory principal obligation classified for accounting?","choices":["Equity due to legal share form","Equity until one year before redemption","Contingent liability only","Financial liability"],"correctIndex":3,"solutionSteps":["Step 1: Evaluate substance and the contractual obligation to deliver cash.","Step 2: Mandatory fixed redemption creates a liability."],"boardTrap":"Legal share terminology does not override contractual obligations.","citation":"PAS 32 paras. 15–18"}]'),Ff=JSON.parse('[{"id":"afar-001","subject":"AFAR","topic":"Business Combinations","difficulty":"Easy","question":"Which date fixes acquisition measurement in a business combination?","choices":["Date control is obtained","Date of first announced bid","Date purchase consideration is fully settled in all cases","Date target records the first acquisition journal"],"correctIndex":0,"solutionSteps":["Step 1: Identify the date the acquirer obtains control.","Step 2: Use it for acquisition-date measurements."],"boardTrap":"Contract closing is a clue, but control can pass on a different date.","citation":"PFRS 3 paras. 8–9"},{"id":"afar-002","subject":"AFAR","topic":"Business Combinations","difficulty":"Easy","question":"How are due diligence fees ordinarily accounted for if they are neither debt nor equity issuance costs?","choices":["Add to consideration transferred.","Increase identifiable net assets.","Charge to NCI directly.","Expense when services are received."],"correctIndex":3,"solutionSteps":["Step 1: Separate adviser services from payments to owners for control.","Step 2: Expense adviser costs as incurred."],"boardTrap":"A deal cost can be necessary without being purchase consideration.","citation":"PFRS 3 para. 53"},{"id":"afar-003","subject":"AFAR","topic":"Business Combinations","difficulty":"Easy","question":"For eligible present ownership interests, which measurement choice can an acquirer make for NCI?","choices":["Proportionate share of historical book equity only","Quoted fair value of consideration paid by the parent only","Fair value or proportionate identifiable net assets","A fixed percentage of acquisition goodwill"],"correctIndex":2,"solutionSteps":["Step 1: Identify qualifying present ownership interests.","Step 2: Choose between permitted methods for the acquisition."],"boardTrap":"Only the fair-value approach includes goodwill attributable to those non-controlling interests.","citation":"PFRS 3 para. 19"},{"id":"afar-004","subject":"AFAR","topic":"Business Combinations","difficulty":"Easy","question":"Where is a verified bargain purchase amount recorded, following reassessment?","choices":["Negative goodwill carried indefinitely","Acquisition-date gain in profit or loss","OCI revaluation reserve","Direct retained earnings adjustment"],"correctIndex":1,"solutionSteps":["Step 1: Recheck identification and measurements.","Step 2: Recognize the remaining bargain amount in profit or loss."],"boardTrap":"Do not use a negative goodwill asset after reassessment.","citation":"PFRS 3 paras. 34–36"},{"id":"afar-005","subject":"AFAR","topic":"Business Combinations","difficulty":"Moderate","question":"On January 1, a parent paid ₱8 million for 80% of Mandaue Foundry. Acquisition-date identifiable net assets are ₱9 million and NCI fair value is ₱2.1 million. Ignore tax unless stated.\\n\\nWhat is goodwill using fair-value NCI?","choices":["₱800,000","₱1,100,000","₱2,100,000","₱1,000,000 bargain gain"],"correctIndex":1,"solutionSteps":["Step 1: Add consideration ₱8 million and NCI ₱2.1 million.","Step 2: Deduct all ₱9 million of fair-value identifiable net assets."],"boardTrap":"Do not mix fair-value NCI with the proportionate-goodwill result.","citation":"PFRS 3 para. 32"},{"id":"afar-006","subject":"AFAR","topic":"Business Combinations","difficulty":"Moderate","question":"On January 1, a parent paid ₱8 million for 80% of Mandaue Foundry. Acquisition-date identifiable net assets are ₱9 million and NCI fair value is ₱2.1 million. Ignore tax unless stated.\\n\\nWhat is goodwill if eligible NCI is measured proportionately?","choices":["₱800,000","₱1,100,000","₱1,800,000","₱0"],"correctIndex":0,"solutionSteps":["Step 1: NCI = 20% × ₱9 million = ₱1.8 million.","Step 2: ₱8 million + ₱1.8 million − ₱9 million = ₱800,000."],"boardTrap":"Do not reuse the quoted NCI when the proportionate method is elected.","citation":"PFRS 3 paras. 19 and 32"},{"id":"afar-007","subject":"AFAR","topic":"Business Combinations","difficulty":"Moderate","question":"A previously held position is carried at ₱980,000, fair value ₱1,240,000 at the date control is obtained. No OCI reclassification applies. What remeasurement gain is recognized?","choices":["₱1,240,000","₱980,000","₱0 until shares are sold","₱260,000"],"correctIndex":3,"solutionSteps":["Step 1: Remeasure the earlier interest on obtaining control.","Step 2: The gain is fair value less carrying amount = ₱260,000."],"boardTrap":"A step acquisition can recognize a gain without selling the earlier shares.","citation":"PFRS 3 para. 42"},{"id":"afar-008","subject":"AFAR","topic":"Business Combinations","difficulty":"Moderate","question":"Cash consideration is ₱4.8 million. The acquisition-date fair value of a contingent payment is ₱550,000 and its maximum possible payout is ₱900,000. What consideration initially enters goodwill?","choices":["₱5,700,000","₱4,800,000","₱5,350,000","₱4,250,000"],"correctIndex":2,"solutionSteps":["Step 1: Include the acquisition-date fair value of the contingent amount.","Step 2: Add ₱550,000 to ₱4.8 million."],"boardTrap":"Use fair value rather than the maximum contractual outcome.","citation":"PFRS 3 paras. 37 and 39"},{"id":"afar-009","subject":"AFAR","topic":"Business Combinations","difficulty":"Moderate","question":"A target does not record internally developed customer relationships. They are identifiable through contracts and have fair value ₱420,000. What should the acquirer recognize?","choices":["No separate amount since the target omitted it","An addition to goodwill only","Identifiable customer-related intangible of ₱420,000","A ₱420,000 contingent liability"],"correctIndex":2,"solutionSteps":["Step 1: Evaluate acquisition-method recognition independently of the acquiree ledger.","Step 2: Recognize the identifiable contractual intangible at fair value."],"boardTrap":"The target’s internally generated asset restriction does not bar acquisition recognition.","citation":"PFRS 3 paras. 10–13 and 18"},{"id":"afar-010","subject":"AFAR","topic":"Business Combinations","difficulty":"Moderate","question":"Consideration and NCI total ₱6.2 million and net identifiable assets are ₱6.8 million. The required reassessment confirms all measurements. What is recorded?","choices":["₱600,000 goodwill","₱600,000 bargain purchase gain","₱600,000 OCI gain","₱6,800,000 bargain gain"],"correctIndex":1,"solutionSteps":["Step 1: Compare the aggregate acquisition cost with identifiable net assets.","Step 2: Recognize the verified excess of ₱600,000 in income."],"boardTrap":"The direction of the difference determines gain versus goodwill.","citation":"PFRS 3 paras. 34–36"},{"id":"afar-011","subject":"AFAR","topic":"Business Combinations","difficulty":"Difficult","question":"An 80% acquisition costs ₱12 million. Fair-value NCI is ₱2.8 million. Net identifiable assets before a tax adjustment are ₱13 million, including a ₱1.6 million upward asset adjustment with unchanged tax basis. At 25%, what full goodwill arises?","choices":["₱2,200,000","₱1,800,000","₱1,400,000","₱2,600,000"],"correctIndex":0,"solutionSteps":["Step 1: Recognize DTL ₱400,000, leaving net assets of ₱12.6 million.","Step 2: ₱12 million + ₱2.8 million − ₱12.6 million = ₱2.2 million."],"boardTrap":"The acquisition DTL lowers identifiable net assets and raises goodwill.","citation":"PFRS 3 paras. 24 and 32; PAS 12 paras. 15 and 19"},{"id":"afar-012","subject":"AFAR","topic":"Business Combinations","difficulty":"Difficult","question":"Six months after acquisition, valuation evidence confirms patent fair value was ₱300,000 higher at acquisition. Separately, post-acquisition sales raise liability-classified contingent consideration by ₱180,000. Ignoring tax, how are the facts treated?","choices":["Reduce goodwill by the net ₱120,000.","Expense both in the current period.","Increase goodwill for both amounts.","Increase purchase-date net assets and reduce goodwill ₱300,000. Expense ₱180,000 as a later change."],"correctIndex":3,"solutionSteps":["Step 1: New acquisition-date evidence within the measurement period adjusts acquisition accounting.","Step 2: A change caused by later sales remeasures the liability in profit or loss."],"boardTrap":"The one-year period does not turn post-acquisition events into acquisition-date facts.","citation":"PFRS 3 paras. 45–50 and 58"},{"id":"afar-013","subject":"AFAR","topic":"Business Combinations","difficulty":"Difficult","question":"A 30% stake with carrying amount ₱2.1 million and fair value ₱2.7 million is followed by a 50% purchase costing ₱4.9 million. Proportionate NCI is based on ₱8 million fair-value net assets. Ignore taxes and prior OCI. What goodwill and remeasurement gain arise?","choices":["₱0.6 million goodwill and no gain","₱2.8 million goodwill and ₱0.6 million gain","₱1.2 million goodwill and no gain","₱1.2 million goodwill and ₱0.6 million gain"],"correctIndex":3,"solutionSteps":["Step 1: NCI = 20% × ₱8 million = ₱1.6 million. Goodwill = ₱4.9 + ₱2.7 + ₱1.6 − ₱8 million.","Step 2: Prior interest gain is ₱2.7 − ₱2.1 million."],"boardTrap":"The old stake enters goodwill at fair value and separately produces a gain on remeasurement.","citation":"PFRS 3 paras. 19, 32 and 42"},{"id":"afar-014","subject":"AFAR","topic":"Business Combinations","difficulty":"Difficult","question":"An acquirer pays ₱7 million at closing, of which ₱600,000 is separately identified at arm’s length for settling a pre-existing legal dispute. Adviser fees of ₱140,000 are paid separately. What amount remains acquisition consideration?","choices":["₱7,000,000","₱6,540,000","₱6,400,000","₱7,140,000"],"correctIndex":2,"solutionSteps":["Step 1: Separate the settlement from the exchange for the acquired business.","Step 2: Exclude the adviser costs as well. Consideration is ₱7 million − ₱600,000."],"boardTrap":"Paying an amount at closing does not make it consideration for control.","citation":"PFRS 3 paras. 37, 51–52 and B50"},{"id":"afar-015","subject":"AFAR","topic":"Consolidation & Intercompany Profits","difficulty":"Easy","question":"Which three elements establish control for consolidation?","choices":["Majority equity, dividends, and appointment of an auditor","Power, variable returns, and ability to use power to affect returns","Legal title, fixed returns, and protective rights","Financing, ownership documents, and sales volume"],"correctIndex":1,"solutionSteps":["Step 1: Identify power and exposure to variable returns.","Step 2: Then assess the relationship between power and returns."],"boardTrap":"A lender’s protective rights alone do not usually convey power.","citation":"PFRS 10 para. 7"},{"id":"afar-016","subject":"AFAR","topic":"Consolidation & Intercompany Profits","difficulty":"Easy","question":"To what extent are matching intragroup loans eliminated?","choices":["In full","Only to the controlling percentage","Only to the NCI percentage","Only after collection"],"correctIndex":0,"solutionSteps":["Step 1: View the parent and subsidiary as one economic entity.","Step 2: Eliminate reciprocal internal balances in full."],"boardTrap":"NCI shares do not create a separate outside counterparty for the loan.","citation":"PFRS 10 para. B86(c)"},{"id":"afar-017","subject":"AFAR","topic":"Consolidation & Intercompany Profits","difficulty":"Easy","question":"An 80% parent buys another 10% and retains control. How is the change classified in consolidated statements?","choices":["An equity transaction","A second business combination","A gain or loss through income","A retrospective goodwill adjustment"],"correctIndex":0,"solutionSteps":["Step 1: Confirm control is maintained.","Step 2: Treat the change as an owner transaction within equity."],"boardTrap":"Obtaining control for the first time follows a different model.","citation":"PFRS 10 para. 23"},{"id":"afar-018","subject":"AFAR","topic":"Consolidation & Intercompany Profits","difficulty":"Easy","question":"Where is a subsidiary’s non-controlling interest presented?","choices":["Current liability because dividends may be paid","As a noncurrent loan from minority holders","Only in the notes","Within equity, separately from parent owners"],"correctIndex":3,"solutionSteps":["Step 1: NCI is equity in the group’s net assets.","Step 2: Present it separately from the parent owners’ equity."],"boardTrap":"Outside ownership of a subsidiary does not make NCI a debt.","citation":"PFRS 10 paras. 22 and B94"},{"id":"afar-019","subject":"AFAR","topic":"Consolidation & Intercompany Profits","difficulty":"Moderate","question":"P owns 80% of S. S sells inventory costing ₱360,000 to P at ₱480,000. At reporting date, 25% remains inside the group. S’s reported profit is ₱640,000. Ignore taxes and other adjustments.\\n\\nBy how much is consolidated inventory reduced for unrealized profit?","choices":["₱120,000","₱24,000","₱30,000","₱90,000"],"correctIndex":2,"solutionSteps":["Step 1: Transfer profit is ₱120,000.","Step 2: Unsold fraction of 25% gives ₱30,000 to eliminate."],"boardTrap":"Do not scale the group inventory adjustment by parent ownership.","citation":"PFRS 10 para. B86(c)"},{"id":"afar-020","subject":"AFAR","topic":"Consolidation & Intercompany Profits","difficulty":"Moderate","question":"P owns 80% of S. S sells inventory costing ₱360,000 to P at ₱480,000. At reporting date, 25% remains inside the group. S’s reported profit is ₱640,000. Ignore taxes and other adjustments.\\n\\nBecause the sale is upstream, what profit is attributed to NCI?","choices":["₱128,000","₱122,000","₱104,000","₱488,000"],"correctIndex":1,"solutionSteps":["Step 1: S earned the intercompany profit, so reduce S income by ₱30,000.","Step 2: 20% × ₱610,000 = ₱122,000."],"boardTrap":"Leaving the subsidiary’s internal markup in the NCI base overstates NCI income.","citation":"PFRS 10 paras. B86(c) and B94"},{"id":"afar-021","subject":"AFAR","topic":"Consolidation & Intercompany Profits","difficulty":"Moderate","question":"P owns 80% of S. S sells inventory costing ₱360,000 to P at ₱480,000. At reporting date, 25% remains inside the group. S’s reported profit is ₱640,000. Ignore taxes and other adjustments.\\n\\nIf the same transfer were instead downstream and S’s reported profit stayed ₱640,000, what would NCI profit be?","choices":["₱122,000","₱128,000","₱104,000","₱512,000"],"correctIndex":1,"solutionSteps":["Step 1: A downstream markup was earned by P, not S.","Step 2: NCI keeps 20% of ₱640,000 = ₱128,000."],"boardTrap":"Group inventory is reduced in both directions, but attribution changes.","citation":"PFRS 10 paras. B86(c) and B94"},{"id":"afar-022","subject":"AFAR","topic":"Consolidation & Intercompany Profits","difficulty":"Moderate","question":"Parent invoiced ₱260,000 intragroup rent, still unpaid, and the subsidiary recorded it as expense. What amounts are eliminated?","choices":["₱260,000 from each of revenue, expense, receivable and payable","Only the two balance sheet amounts","Only revenue and expense","80% of each balance"],"correctIndex":0,"solutionSteps":["Step 1: Eliminate the reciprocal P&L entries.","Step 2: Also eliminate the internal outstanding receivable and payable."],"boardTrap":"An intercompany sale and its unpaid balance require distinct elimination steps.","citation":"PFRS 10 para. B86(c)"},{"id":"afar-023","subject":"AFAR","topic":"Consolidation & Intercompany Profits","difficulty":"Moderate","question":"An 85%-owned subsidiary earns ₱920,000. Fair-value equipment depreciation is ₱120,000 higher than booked. No other adjustments. How much profit belongs to NCI?","choices":["₱138,000","₱18,000","₱680,000","₱120,000"],"correctIndex":3,"solutionSteps":["Step 1: Begin with subsidiary income adjusted to group fair-value basis: ₱800,000.","Step 2: Allocate 15%, giving ₱120,000."],"boardTrap":"Attribution uses the adjusted basis, rather than legal-entity net income.","citation":"PFRS 10 para. B94"},{"id":"afar-024","subject":"AFAR","topic":"Consolidation & Intercompany Profits","difficulty":"Moderate","question":"A parent pays ₱740,000 for an additional stake without losing control. NCI falls by ₱590,000. What consolidated owners’ equity adjustment results?","choices":["₱150,000 increase","₱150,000 goodwill increase","₱150,000 decrease","₱740,000 decrease attributable only to parent owners"],"correctIndex":2,"solutionSteps":["Step 1: Compare the NCI adjustment with cash consideration.","Step 2: Recognize ₱150,000 directly in equity attributable to parent owners."],"boardTrap":"No new acquisition or profit arises because control is retained.","citation":"PFRS 10 paras. 23 and B96"},{"id":"afar-025","subject":"AFAR","topic":"Consolidation & Intercompany Profits","difficulty":"Difficult","question":"On January 1, P sells equipment to S for ₱780,000, group carrying amount ₱600,000 and remaining life six years. Straight line, residual nil. How much lower is consolidated PPE than the combined ledger balance at the first year-end?","choices":["₱180,000","₱30,000","₱150,000","₱210,000"],"correctIndex":2,"solutionSteps":["Step 1: Eliminate initial markup of ₱180,000.","Step 2: Reverse one year’s ₱30,000 excess depreciation, leaving ₱150,000 unrecognized markup."],"boardTrap":"The eliminated gain is partly realized through use over time.","citation":"PFRS 10 para. B86(c); PAS 16 paras. 50–55"},{"id":"afar-026","subject":"AFAR","topic":"Consolidation & Intercompany Profits","difficulty":"Difficult","question":"An 80%-owned S had an upstream unrealized inventory profit of ₱75,000 at prior year-end. It all sells externally this year. This year-end upstream unrealized profit is ₱45,000. S reports ₱500,000 current profit. What current NCI profit arises?","choices":["₱91,000","₱106,000","₱100,000","₱115,000"],"correctIndex":1,"solutionSteps":["Step 1: Add ₱75,000 realized prior markup and deduct ₱45,000 current deferral.","Step 2: NCI is 20% × ₱530,000 = ₱106,000."],"boardTrap":"An adjustment spanning two periods requires both opening realization and ending deferral.","citation":"PFRS 10 paras. B86(c) and B94"},{"id":"afar-027","subject":"AFAR","topic":"Consolidation & Intercompany Profits","difficulty":"Difficult","question":"A parent sells control for ₱7.2 million and retains an interest worth ₱1.1 million. Consolidated subsidiary net assets, including goodwill, are ₱8 million. Carrying NCI is ₱1.4 million. No OCI effects. What gain arises?","choices":["₱1,700,000","₱300,000","₱600,000","₱1,100,000 loss"],"correctIndex":0,"solutionSteps":["Step 1: Add consideration, retained fair value, and derecognized NCI: ₱9.7 million.","Step 2: Deduct net assets including goodwill, giving ₱1.7 million."],"boardTrap":"Loss of control recognizes the retained interest at fair value and derecognizes NCI.","citation":"PFRS 10 paras. 25 and B97–B99"},{"id":"afar-028","subject":"AFAR","topic":"Consolidation & Intercompany Profits","difficulty":"Difficult","question":"An upstream inventory profit of ₱150,000 is eliminated. Buyer’s tax base is unchanged, and future deductible temporary differences satisfy recognition at a 25% rate. What is the after-tax reduction to group profit?","choices":["₱150,000","₱187,500","₱37,500","₱112,500"],"correctIndex":3,"solutionSteps":["Step 1: Eliminate ₱150,000 pre-tax profit.","Step 2: Recognize ₱37,500 deferred tax asset benefit, reducing group profit by ₱112,500 net."],"boardTrap":"The buyer’s higher tax base creates a deductible difference rather than an added DTL.","citation":"PFRS 10 para. B86(c); PAS 12 paras. 24 and 47"},{"id":"afar-029","subject":"AFAR","topic":"Partnership Liquidation","difficulty":"Easy","question":"Does partnership dissolution itself mean the partnership has completed liquidation?","choices":["Yes. All accounts automatically close.","Yes. Unpaid outside debt becomes profit.","No. It must start unlimited new projects.","No. It continues to wind up."],"correctIndex":3,"solutionSteps":["Step 1: Dissolution changes partner relations.","Step 2: Termination occurs after winding up."],"boardTrap":"A partnership can still settle existing affairs after dissolution.","citation":"Civil Code arts. 1828–1829; BOA AFAR syllabus §1.4"},{"id":"afar-030","subject":"AFAR","topic":"Partnership Liquidation","difficulty":"Easy","question":"Which class ranks ahead of partners’ capital claims in liquidation?","choices":["Partner capital first","Undrawn future profit","Outside creditors","Goodwill estimated after dissolution"],"correctIndex":2,"solutionSteps":["Step 1: Use the statutory order, beginning with outside debts.","Step 2: Only then address partner claims according to priority."],"boardTrap":"Capital is residual even if its contractual balance is substantial.","citation":"Civil Code art. 1839"},{"id":"afar-031","subject":"AFAR","topic":"Partnership Liquidation","difficulty":"Easy","question":"What conservative assumption underlies a safe installment distribution?","choices":["Assume all residual assets realize carrying value.","Assume remaining noncash assets could be wholly lost.","Assume unpaid creditor claims will be waived.","Assume insolvent partners can pay immediately."],"correctIndex":1,"solutionSteps":["Step 1: Assess the maximum potential future loss before paying capital.","Step 2: Provide for liabilities, expenses, and possible deficits first."],"boardTrap":"Positive book capital alone does not establish a safe payment.","citation":"BOA AFAR syllabus §1.4 · Partnership liquidation"},{"id":"afar-032","subject":"AFAR","topic":"Partnership Liquidation","difficulty":"Easy","question":"How is a bona fide partner loan ordinarily ranked relative to that partner’s capital under the statutory order?","choices":["After outside creditors, ahead of capital","After all capital distributions","Equal with outside creditors in every case","As a profit distribution only"],"correctIndex":0,"solutionSteps":["Step 1: Classify partnership liabilities by claimant type.","Step 2: A partner’s qualifying debt claim precedes capital in the statutory settlement order."],"boardTrap":"Loan and capital claims have different standing even when the claimant is the same person.","citation":"Civil Code art. 1839; BOA AFAR syllabus §1.4"},{"id":"afar-033","subject":"AFAR","topic":"Partnership Liquidation","difficulty":"Moderate","question":"Assets carried at ₱860,000 realize ₱620,000. Partners A and B share losses 60:40. What realization loss is charged to A?","choices":["₱144,000","₱96,000","₱372,000","₱240,000"],"correctIndex":0,"solutionSteps":["Step 1: Find the ₱240,000 loss on realization.","Step 2: Allocate 60% to A = ₱144,000."],"boardTrap":"Apply the loss ratio to the loss rather than to proceeds.","citation":"BOA AFAR syllabus §1.4 · Partnership liquidation"},{"id":"afar-034","subject":"AFAR","topic":"Partnership Liquidation","difficulty":"Moderate","question":"Cash on hand is ₱390,000. Unpaid outside creditors require ₱190,000 and an additional ₱35,000 cash reserve is necessary. Before partner-by-partner limits, what cash may be considered for distribution?","choices":["₱200,000","₱355,000","₱235,000","₱165,000"],"correctIndex":3,"solutionSteps":["Step 1: Protect outside claims and the reserve first.","Step 2: ₱390,000 − ₱190,000 − ₱35,000 = ₱165,000."],"boardTrap":"Even unpaid reserved expenses reduce cash available for a safe installment.","citation":"BOA AFAR syllabus §1.4 · Partnership liquidation"},{"id":"afar-035","subject":"AFAR","topic":"Partnership Liquidation","difficulty":"Moderate","question":"After realization, A has capital ₱160,000 and B has capital ₱80,000. B also has a valid ₱30,000 partnership loan. After outside claims, ₱270,000 cash remains and there are no additional expenses. How much total does B receive?","choices":["₱80,000","₱90,000","₱110,000","₱135,000"],"correctIndex":2,"solutionSteps":["Step 1: Pay the ₱30,000 partner liability before residual capital.","Step 2: Then pay B’s ₱80,000 balance, giving ₱110,000."],"boardTrap":"A loan is a separate cash claim from capital.","citation":"Civil Code art. 1839; BOA AFAR syllabus §1.4"},{"id":"afar-036","subject":"AFAR","topic":"Partnership Liquidation","difficulty":"Moderate","question":"A and B open with ₱290,000 and ₱210,000 capital. Inventory losses total ₱180,000 and expenses are ₱40,000. Profit and losses are split equally. What is B’s final capital before distribution?","choices":["₱120,000","₱100,000","₱170,000","₱0"],"correctIndex":1,"solutionSteps":["Step 1: Total liquidation losses are ₱220,000.","Step 2: Charge half to B, leaving ₱100,000."],"boardTrap":"Liquidation expenses reduce remaining capital along with realization losses.","citation":"BOA AFAR syllabus §1.4 · Partnership liquidation"},{"id":"afar-037","subject":"AFAR","topic":"Partnership Liquidation","difficulty":"Moderate","question":"A and B share gains and losses 3:2. Sale of an asset with ₱250,000 book value generates ₱300,000. How much is added to B’s capital?","choices":["₱30,000","₱20,000","₱120,000","₱0"],"correctIndex":1,"solutionSteps":["Step 1: Realization gain is ₱50,000.","Step 2: Apply B’s gain share of 2/5 = ₱20,000."],"boardTrap":"Distribution is based on the gain, not the sale proceeds.","citation":"BOA AFAR syllabus §1.4 · Partnership liquidation"},{"id":"afar-038","subject":"AFAR","topic":"Partnership Liquidation","difficulty":"Moderate","question":"A solvent partner has a ₱35,000 final deficit after all realizations. What settlement restores that partner’s capital to zero?","choices":["Cash contribution of ₱35,000 by that partner","Cash payment of ₱35,000 to that partner","An immediate charge to all other partners despite collectibility","Issue a new loan to the deficit partner"],"correctIndex":0,"solutionSteps":["Step 1: A final debit capital represents a contribution required to settle, given solvency.","Step 2: Debit cash and credit that capital account."],"boardTrap":"Do not apply the reallocation for an insolvent deficit when the partner can pay.","citation":"BOA AFAR syllabus §1.4 · Partnership liquidation"},{"id":"afar-039","subject":"AFAR","topic":"Partnership Liquidation","difficulty":"Difficult","question":"A and B share losses 60:40. Capitals are ₱240,000 and ₱160,000, cash ₱240,000, remaining noncash assets ₱200,000, and outside debt ₱40,000. No further expense reserve. What safe capital payment is available?","choices":["A ₱144,000, B ₱96,000","A ₱240,000, B ₱160,000","A ₱200,000, B ₱0","A ₱120,000, B ₱80,000"],"correctIndex":3,"solutionSteps":["Step 1: Reserve ₱40,000 outside debt, leaving ₱200,000 cash.","Step 2: Assume total loss of noncash assets and deduct ₱120,000 from A and ₱80,000 from B."],"boardTrap":"Available cash must agree with defensible remaining balances, rather than total bank cash.","citation":"BOA AFAR syllabus §1.4 · Safe payments"},{"id":"afar-040","subject":"AFAR","topic":"Partnership Liquidation","difficulty":"Difficult","question":"A, B and C share losses 50:30:20. Capital is ₱190,000, ₱170,000 and ₱40,000. Cash of ₱110,000 plus remaining assets of ₱300,000 fund ₱10,000 outside debt and the capitals. C is personally insolvent. Assuming no other expenses, what cash is safe for A?","choices":["₱40,000","₱50,000","₱27,500","₱72,500"],"correctIndex":2,"solutionSteps":["Step 1: A, B, C after total possible loss stand at ₱40,000, ₱80,000 and −₱20,000.","Step 2: Allocate C’s deficit to A and B 5:3. A loses another ₱12,500, leaving ₱27,500."],"boardTrap":"Do not assume the insolvent partner cures the deficit or allocate it equally.","citation":"BOA AFAR syllabus §1.4 · Safe payments"},{"id":"afar-041","subject":"AFAR","topic":"Partnership Liquidation","difficulty":"Difficult","question":"After all assets are realized, outside debts of ₱100,000 remain. Cash is ₱180,000. A is owed a ₱35,000 partner loan and has capital of ₱30,000. B has capital ₱15,000. What total cash goes to A?","choices":["₱30,000","₱35,000","₱65,000","₱80,000"],"correctIndex":2,"solutionSteps":["Step 1: Pay outside creditors first, leaving ₱80,000.","Step 2: Pay A’s ₱35,000 loan then capital of ₱30,000. B receives the remaining ₱15,000."],"boardTrap":"Do not allocate the residue by capital before segregating the loan.","citation":"Civil Code art. 1839; BOA AFAR syllabus §1.4"},{"id":"afar-042","subject":"AFAR","topic":"Partnership Liquidation","difficulty":"Difficult","question":"A, B and C share losses 4:4:2. After all prior losses, capitals are ₱76,000, ₱66,000 and a ₱22,000 debit. C can contribute only ₱8,000. Final cash before contribution and distribution is ₱120,000, with no other claims. What capital cash does B receive?","choices":["₱55,000","₱59,000","₱66,000","₱51,000"],"correctIndex":1,"solutionSteps":["Step 1: After collecting ₱8,000, uncollectible deficit is ₱14,000.","Step 2: Allocate it equally to A and B under the 4:4 residual ratio. B receives ₱59,000."],"boardTrap":"Reallocate only the portion C cannot pay, rather than the entire deficit.","citation":"BOA AFAR syllabus §1.4 · Partnership liquidation"},{"id":"afar-043","subject":"AFAR","topic":"Joint Arrangements","difficulty":"Easy","question":"What decision rule establishes joint control over relevant activities?","choices":["Unanimous consent of the parties sharing control","Ordinary majority of all signatories in every case","One investor can decide alone","A unanimous vote on unrelated protective matters only"],"correctIndex":0,"solutionSteps":["Step 1: Identify decisions that direct relevant activities.","Step 2: Check whether parties sharing control must agree."],"boardTrap":"Joint ownership percentages alone cannot establish the consent requirement.","citation":"PFRS 11 para. 7"},{"id":"afar-044","subject":"AFAR","topic":"Joint Arrangements","difficulty":"Easy","question":"What rights distinguish a joint venture from a joint operation?","choices":["Any right to receive dividends","Rights to all gross sales of one party","Use of a separate vehicle in every case","Rights to net assets, rather than direct rights to assets and obligations for liabilities"],"correctIndex":3,"solutionSteps":["Step 1: Assess contractual rights and obligations in substance.","Step 2: A joint venture gives rights to net assets."],"boardTrap":"The existence of a vehicle is evidence, not a complete classification test.","citation":"PFRS 11 paras. 15–16"},{"id":"afar-045","subject":"AFAR","topic":"Joint Arrangements","difficulty":"Easy","question":"How does a joint operator account for a share of jointly held assets?","choices":["Records an equity-method investment only","Recognizes all jointly held assets regardless of agreement","Recognizes only amounts collected in cash","Recognizes its share directly in applicable assets"],"correctIndex":3,"solutionSteps":["Step 1: Identify the contractually held rights.","Step 2: Recognize the operator’s share of joint assets under applicable standards."],"boardTrap":"The equity method is for an interest in a joint venture, not this direct-right arrangement.","citation":"PFRS 11 para. 20"},{"id":"afar-046","subject":"AFAR","topic":"Joint Arrangements","difficulty":"Easy","question":"What is the usual method for an investor’s interest in a joint venture, absent exemptions?","choices":["Full consolidation","Proportionate consolidation of each line item","Equity method","Cash distribution basis"],"correctIndex":2,"solutionSteps":["Step 1: Classify the interest as a joint venture.","Step 2: Initially recognize cost and subsequently reflect the applicable results using equity method."],"boardTrap":"Proportionate line recognition characterizes rights and obligations under a joint operation.","citation":"PFRS 11 para. 24; PAS 28 para. 10"},{"id":"afar-047","subject":"AFAR","topic":"Joint Arrangements","difficulty":"Moderate","question":"A joint operator is contractually entitled to 35% of ₱2 million jointly held equipment and is obligated for 35% of ₱600,000 supplier debt. What does it recognize?","choices":["A net investment of ₱490,000 only","Equipment ₱700,000 and liability ₱210,000","Equipment ₱2 million and liability ₱600,000","Equipment ₱700,000 and liability ₱600,000"],"correctIndex":1,"solutionSteps":["Step 1: Apply the direct rights and obligations to each line.","Step 2: Report ₱700,000 gross equipment and ₱210,000 supplier debt."],"boardTrap":"Do not net assets and liabilities into a single investment.","citation":"PFRS 11 para. 20"},{"id":"afar-048","subject":"AFAR","topic":"Joint Arrangements","difficulty":"Moderate","question":"A 40% joint venture interest has opening carrying amount ₱2.6 million. The venture earns ₱750,000 and pays dividends of ₱200,000. No other movements. Closing carrying amount?","choices":["₱2,820,000","₱2,900,000","₱2,980,000","₱2,680,000"],"correctIndex":0,"solutionSteps":["Step 1: Add 40% of profit = ₱300,000.","Step 2: Deduct 40% of dividends = ₱80,000, leaving ₱2.82 million."],"boardTrap":"Distributions reduce the equity-method investment.","citation":"PFRS 11 para. 24; PAS 28 para. 10"},{"id":"afar-049","subject":"AFAR","topic":"Joint Arrangements","difficulty":"Moderate","question":"A joint operator sells its own allocated output for ₱720,000 and separately shares 30% of ₱500,000 third-party output sales made by the operation. No overlap exists. What revenue does it recognize?","choices":["₱870,000","₱720,000","₱1,220,000","₱366,000"],"correctIndex":0,"solutionSteps":["Step 1: Recognize its own ₱720,000 output sales.","Step 2: Add share of joint sales, ₱150,000."],"boardTrap":"Do not apply the share percentage to its own sales or claim 100% of joint revenue.","citation":"PFRS 11 para. 20(c)–(e)"},{"id":"afar-050","subject":"AFAR","topic":"Joint Arrangements","difficulty":"Moderate","question":"A, B and C hold 45%, 35%, and 20%. Relevant decisions require 75%. The agreement does not name an alternative voting group. Which parties share control?","choices":["A alone","A and C","All three must consent","A and B"],"correctIndex":3,"solutionSteps":["Step 1: A and B together reach 80%. No other pair reaches 75%.","Step 2: Both are required for the relevant decisions."],"boardTrap":"Being a signatory or holder of a voting interest does not necessarily confer joint control.","citation":"PFRS 11 paras. 7–9"},{"id":"afar-051","subject":"AFAR","topic":"Joint Arrangements","difficulty":"Moderate","question":"A separate vehicle legally separates assets and liabilities, but enforceable terms give parties direct asset rights and direct obligations for its liabilities. What is the classification?","choices":["Joint venture in all cases because there is a vehicle","Subsidiary of each operator","Joint operation","Associate of every party by definition"],"correctIndex":2,"solutionSteps":["Step 1: Analyze legal form and binding terms together.","Step 2: Direct asset rights and liability obligations indicate a joint operation."],"boardTrap":"Separate incorporation alone can be overridden by substantive terms.","citation":"PFRS 11 paras. 15–19 and B16–B24"},{"id":"afar-052","subject":"AFAR","topic":"Joint Arrangements","difficulty":"Moderate","question":"A 30% operator contributes machinery to the joint operation. Carrying amount ₱200,000, transaction price ₱280,000, and no impairment. What gain can it recognize now, assuming genuine transfer to the other parties to that extent?","choices":["₱80,000","₱56,000","₱24,000","₱0"],"correctIndex":1,"solutionSteps":["Step 1: Total transaction gain = ₱80,000.","Step 2: Recognize the other parties’ 70% share = ₱56,000."],"boardTrap":"The operator has not realized its own retained 30% interest externally.","citation":"PFRS 11 paras. B34–B35"},{"id":"afar-053","subject":"AFAR","topic":"Joint Arrangements","difficulty":"Difficult","question":"A 40% joint operator buys goods from the joint operation. Total transfer profit is ₱75,000. All goods remain on hand at the operator’s year-end. What portion attributable to the operator remains unrecognized by it?","choices":["₱45,000","₱30,000","₱75,000","₱0"],"correctIndex":1,"solutionSteps":["Step 1: The operator’s share of the operation’s profit is 40% × ₱75,000.","Step 2: Defer that ₱30,000 until resale to a third party."],"boardTrap":"The purchase direction matters. A buyer’s own share remains unrealized.","citation":"PFRS 11 paras. B36–B37"},{"id":"afar-054","subject":"AFAR","topic":"Joint Arrangements","difficulty":"Difficult","question":"A 25% venturer sells inventory to its joint venture at a ₱160,000 gain. One quarter is sold outside by period-end. The JV pays ₱80,000 total dividends. What total reduction to the venturer’s investment arises from its unrealized sale profit and dividend share?","choices":["₱50,000","₱30,000","₱120,000","₱100,000"],"correctIndex":0,"solutionSteps":["Step 1: Unrealized gain is ₱120,000. Eliminate the venturer’s 25% = ₱30,000 against investment.","Step 2: Reduce investment by another ₱20,000 for dividend received."],"boardTrap":"Do not eliminate the entire unrealized profit under the equity method.","citation":"PAS 28 paras. 10–11 and 28; PFRS 11 para. 24"},{"id":"afar-055","subject":"AFAR","topic":"Joint Arrangements","difficulty":"Difficult","question":"A, B, C and D own 40%, 30%, 20% and 10%, and relevant decisions require at least 70%. The contract does not specify which group must agree. Is the 70% rule alone sufficient to identify joint control among a fixed pair?","choices":["Yes. A and B alone are required.","Yes. A can meet the threshold by itself.","Yes. All four must consent.","No. A+B and A+C+D can both meet the threshold."],"correctIndex":3,"solutionSteps":["Step 1: Determine the feasible winning coalitions.","Step 2: Because more than one combination can reach 70%, the threshold alone does not identify a required group."],"boardTrap":"Selecting the smallest coalition does not make it the only possible group.","citation":"PFRS 11 paras. 7–9 and B8"},{"id":"afar-056","subject":"AFAR","topic":"Joint Arrangements","difficulty":"Difficult","question":"A 30% joint venturer’s only net investment is a ₱150,000 carrying amount. Its share of current loss is ₱220,000. It has no further legal or constructive support obligations. How much loss is recognized now?","choices":["₱220,000, with a ₱70,000 liability","₱70,000 only","₱150,000, with ₱70,000 unrecognized","₱0 because the interest is a joint venture"],"correctIndex":2,"solutionSteps":["Step 1: Recognize the loss up to net investment, reducing it to zero.","Step 2: Do not accrue the excess without an obligation or payments on behalf."],"boardTrap":"Absence of a negative investment does not mean the current recognized portion is zero.","citation":"PAS 28 paras. 38–39; PFRS 11 para. 24"},{"id":"afar-057","subject":"AFAR","topic":"Construction Contracts","difficulty":"Easy","question":"Which fact supports revenue over time for construction on a client’s land?","choices":["The contractor invoices monthly.","The contractor bought equipment before signing.","The customer controls the asset as it is created or enhanced.","The contract specifies a fixed price."],"correctIndex":2,"solutionSteps":["Step 1: Find who controls work in progress.","Step 2: On-site client control during creation can satisfy the criterion."],"boardTrap":"Billing frequency does not determine the performance pattern.","citation":"PFRS 15 para. 35(b)"},{"id":"afar-058","subject":"AFAR","topic":"Construction Contracts","difficulty":"Easy","question":"A specialized asset has no alternative use. What second condition supports the corresponding over-time test?","choices":["A down payment that covers any amount","An enforceable right to payment for performance to date","A separate off-site storage contract","A published list price"],"correctIndex":1,"solutionSteps":["Step 1: Test each condition independently.","Step 2: Confirm a right to payment that covers performance to date if terminated for reasons other than contractor failure."],"boardTrap":"No alternative use alone does not meet the combined test.","citation":"PFRS 15 paras. 35(c) and 37"},{"id":"afar-059","subject":"AFAR","topic":"Construction Contracts","difficulty":"Easy","question":"What must a progress measure depict?","choices":["Transfer of control of promised goods or services","Cash collected from customers","Every peso charged in the project ledger","Amounts a contract labels recurring"],"correctIndex":0,"solutionSteps":["Step 1: Choose a measure faithful to performance.","Step 2: Apply it consistently for the obligation."],"boardTrap":"An invoice schedule can run ahead of or behind actual performance.","citation":"PFRS 15 paras. 39–41"},{"id":"afar-060","subject":"AFAR","topic":"Construction Contracts","difficulty":"Easy","question":"How does significant unexpected waste that does not reflect performance affect an input measure?","choices":["Add it to increase the percentage complete.","Double count it as both progress and claim revenue.","Treat it as a separate performance obligation.","Exclude it from measured progress."],"correctIndex":3,"solutionSteps":["Step 1: Remove inputs that do not depict transfer.","Step 2: Assess expense recognition independently."],"boardTrap":"Expending resources is not always equivalent to satisfying the obligation.","citation":"PFRS 15 para. B19(a)"},{"id":"afar-061","subject":"AFAR","topic":"Construction Contracts","difficulty":"Easy","question":"For an over-time obligation, progress cannot yet be measured reliably, but incurred costs are expected to be recovered. How much revenue is recognized initially?","choices":["No revenue in all circumstances","Expected total profit","Full contract price","Revenue equal to costs incurred to the extent recoverable"],"correctIndex":3,"solutionSteps":["Step 1: Apply the cost-recovery fallback while reasonable progress cannot be measured.","Step 2: Recognize no margin at this stage."],"boardTrap":"Over-time criteria and ability to measure progress are separate assessments.","citation":"PFRS 15 para. 45"},{"id":"afar-062","subject":"AFAR","topic":"Construction Contracts","difficulty":"Moderate","question":"A builder signs a ₱12 million qualifying over-time contract. Cost-to-cost depicts progress. Estimated total qualifying cost is ₱9 million and cumulative cost is ₱3.6 million. Cumulative prior-year revenue was ₱2.4 million.\\n\\nWhat cumulative revenue is recognized at this year-end?","choices":["₱3,600,000","₱2,400,000","₱4,800,000","₱12,000,000"],"correctIndex":2,"solutionSteps":["Step 1: Progress equals ₱3.6 million ÷ ₱9 million = 40%.","Step 2: Apply to ₱12 million = ₱4.8 million cumulative revenue."],"boardTrap":"Costs incurred measure progress but are not themselves the cumulative revenue.","citation":"PFRS 15 paras. 39–41 and B18"},{"id":"afar-063","subject":"AFAR","topic":"Construction Contracts","difficulty":"Moderate","question":"A builder signs a ₱12 million qualifying over-time contract. Cost-to-cost depicts progress. Estimated total qualifying cost is ₱9 million and cumulative cost is ₱3.6 million. Cumulative prior-year revenue was ₱2.4 million.\\n\\nHow much revenue belongs to the current year only?","choices":["₱4,800,000","₱2,400,000","₱1,200,000","₱3,600,000"],"correctIndex":1,"solutionSteps":["Step 1: Compute cumulative recognized revenue of ₱4.8 million.","Step 2: Subtract prior ₱2.4 million, leaving ₱2.4 million current revenue."],"boardTrap":"An inception-to-date measure includes prior periods.","citation":"PFRS 15 paras. 39–41 and B18"},{"id":"afar-064","subject":"AFAR","topic":"Construction Contracts","difficulty":"Moderate","question":"A builder has recognized ₱4.2 million revenue and billed ₱3.5 million, of which it collected ₱2.9 million. The right to the remaining unbilled performance is conditional on certification. What positions arise?","choices":["₱700,000 contract asset and ₱600,000 receivable","₱1,300,000 receivable only","₱700,000 contract liability and ₱600,000 receivable","₱600,000 contract asset and ₱700,000 receivable"],"correctIndex":0,"solutionSteps":["Step 1: Unbilled earned amount subject to condition is ₱700,000.","Step 2: Billed unpaid unconditional amount is ₱600,000."],"boardTrap":"Distinguish conditioning of the right from mere noncollection.","citation":"PFRS 15 paras. 105–108"},{"id":"afar-065","subject":"AFAR","topic":"Construction Contracts","difficulty":"Moderate","question":"An eligible over-time contractor incurs ₱460,000 recoverable costs. Reliable progress cannot yet be determined. What gross margin is recognized on that performance?","choices":["₱0","₱460,000","Negative ₱460,000 in every case","Estimated margin on total contract"],"correctIndex":0,"solutionSteps":["Step 1: Recognize recoverable costs incurred as revenue under the fallback.","Step 2: Match associated ₱460,000 expense, yielding no gross margin."],"boardTrap":"Do not recognize profit before progress can be measured reasonably.","citation":"PFRS 15 paras. 35 and 45"},{"id":"afar-066","subject":"AFAR","topic":"Construction Contracts","difficulty":"Difficult","question":"Contract price is ₱10 million. Costs to date are ₱4.8 million, and latest total estimate is ₱12 million instead of ₱10 million. Prior revenue was ₱3 million. Ignoring any separate onerous-provision question, what current revenue follows from cost-to-cost?","choices":["₱1,800,000","₱4,000,000","₱0","₱1,000,000"],"correctIndex":3,"solutionSteps":["Step 1: Use updated progress ₱4.8 million ÷ ₱12 million = 40%.","Step 2: Cumulative revenue ₱4 million less ₱3 million prior revenue yields ₱1 million."],"boardTrap":"Using the old estimate would produce ₱1.8 million and overstate performance.","citation":"PFRS 15 paras. 40–43 and B18"},{"id":"afar-067","subject":"AFAR","topic":"Construction Contracts","difficulty":"Difficult","question":"A qualifying uninstalled component cost ₱1 million and transferred to the customer early. Overall price is ₱8 million. Other qualifying costs are ₱1.8 million incurred out of ₱4.5 million total. The conditions for recognizing component revenue at cost are met. What cumulative revenue results?","choices":["₱3,200,000","₱4,200,000","₱3,800,000","₱5,000,000"],"correctIndex":2,"solutionSteps":["Step 1: Recognize ₱1 million for the component with no margin.","Step 2: Apply 40% progress to remaining price of ₱7 million = ₱2.8 million. Total ₱3.8 million."],"boardTrap":"Including the high-cost component in ordinary progress would front-load margin.","citation":"PFRS 15 para. B19(b)"},{"id":"afar-068","subject":"AFAR","topic":"Construction Contracts","difficulty":"Difficult","question":"A partly performed contract adds an integrated non-distinct feature. Revised transaction price is ₱13 million and revised total qualifying cost ₱10 million. Cumulative qualifying cost is ₱4 million, while ₱4.6 million revenue has been recognized to date. What catch-up follows?","choices":["Defer all modification revenue to completion.","Increase revenue ₱600,000.","Increase revenue ₱5.2 million.","Reduce revenue ₱600,000."],"correctIndex":1,"solutionSteps":["Step 1: The modification is part of the existing performance obligation.","Step 2: Update cumulative revenue to 40% × ₱13 million = ₱5.2 million. Recognize the ₱600,000 increase."],"boardTrap":"Prospective treatment for distinct remaining obligations does not apply to the integrated feature.","citation":"PFRS 15 paras. 21(b), 39 and 43"},{"id":"afar-069","subject":"AFAR","topic":"Construction Contracts","difficulty":"Difficult","question":"An unavoidable construction contract has remaining benefits of ₱1.4 million. The allocated directly related fulfillment cost is ₱1.75 million and exit compensation is ₱250,000. Any related impairment has already been recognized. What provision is recorded?","choices":["₱350,000","₱250,000","₱1,750,000","₱0"],"correctIndex":1,"solutionSteps":["Step 1: Net cost of fulfillment is ₱350,000.","Step 2: The least net cost of exit is the lower of
