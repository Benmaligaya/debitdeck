emove all real estate or operating equipment."],["NIRC Sec. 27(E) · CREATE (RA 11534)","When does MCIT generally first apply to a qualifying corporation?","Beginning in the fourth taxable year immediately following the year it commenced business.","Always in the first month.","Only after its tenth year.","Only when regular tax exceeds MCIT.","Start counting taxable years following commencement. The statutory start is the fourth following year.","The commencement year is excluded from the count of following years."],["NIRC Sec. 27(E) · BIR RMC 36-2024","When did the general corporate MCIT rate return to 2% after the temporary CREATE reduction?","July 1, 2023.","January 1, 2023.","July 1, 2020.","January 1, 2024.","Map the temporary 1% period through June 30, 2023. The 2% rate resumed the following day.","A calendar-year start is tempting, but the change occurred midyear."],["NIRC Sec. 27(E) · CREATE (RA 11534)","What is the base for the minimum corporate income tax?","Gross income as defined for MCIT.","Gross assets.","Net taxable income after all deductions.","Paid-in capital.","Determine gross income under the MCIT rules, then apply the rate for the stated period.","Net taxable income is used in the regular corporate tax computation."],["NIRC Sec. 27(A) · CREATE (RA 11534)","For 2022 under CREATE, which general regular rate applies to an ordinary domestic corporation that fails the reduced-rate tests?","25%.","20%.","8%.","2%.","Determine whether the corporation qualifies for the reduced rate. If it does not, apply the ordinary regular rate of 25%.","The 2% figure can arise in MCIT, not the regular income tax rate."]]),...ue("TAX","Value-Added Tax","vat",[["NIRC Sec. 106(A)(1) · RA 12066","What is the standard VAT rate on a regular VATable domestic sale of goods?","12%.","0%.","8%.","6%.","Classify the sale as standard-rated under the facts. Apply 12% to its VAT-exclusive base.","Some transactions are zero-rated or exempt. The prompt specifies a standard-rated sale lary.","Identify the gross estate, deduct allowable amounts, and apply the estate tax rate to the net estate.","Estate valuation and taxable net estate are different stages."],["NIRC Sec. 86(A)(1) · TRAIN","What is the standard deduction for a Philippine resident decedent under the TRAIN estate-tax rule in a 2024 example?","₱5 million.","₱500,000.","₱250,000.","₱10 million.","Identify the resident-decedent rule. Apply the ₱5 million standard deduction.","₱10 million is commonly associated with the separate limit for a qualifying family home."],["NIRC Sec. 86(A)(7) · TRAIN","Under TRAIN, what is the maximum family-home deduction for a qualifying resident estate, subject to the statutory conditions?","₱10 million.","₱5 million.","₱250,000.","No maximum.","Start with the qualifying family home’s fair market value and cap the deduction at ₱10 million.","The standard deduction is a separate line and uses a different amount."],["NIRC Sec. 99(A) · TRAIN","In a TRAIN donor’s tax exercise, how often does the ₱250,000 exclusion generally apply?","Once against total gifts for the calendar year.","For each gift.","For each recipient.","Only on the donor’s final lifetime gift.","Aggregate taxable gifts in the calendar year, then apply the annual exclusion.","Changing donees does not create a new annual exclusion."],["NIRC Sec. 99(A) · TRAIN","Under TRAIN, what general donor’s tax rate applies above the annual exclusion in a 2024 example?","6%.","3%.","12%.","Different flat rates for each degree of relationship.","Identify the taxable excess over the calendar-year exclusion. Apply the 6% statutory rate.","Do not carry over old stranger/non-stranger rate distinctions."],["NIRC Sec. 90(B) · TRAIN","What is the generally prescribed estate tax return deadline from death under TRAIN?","Within one year.","Within 30 days.","Within 60 days.","Three years in every case.","Measure one year from the decedent’s death, absent an authorized extension or a special rule.","Filing and installment rmanently from July 1, 2023.","Only during calendar year 2020.","Identify the temporary effective window in the statute. Outside it, the temporary 1% rule does not apply.","The start and end dates are midyear and should be tracked separately."]])],sm=[...ue("FAR","Revenue & Receivables","revenue",[["PFRS 15 para. 31","A retailer is paid before the buyer controls the goods. When is revenue recognized?","When control transfers.","On receipt of cash.","When the retailer buys inventory.","When the buyer starts using the goods.","Identify the promise and its control transfer date. Advance cash generally creates a contract liability until performance.","Cash receipts and revenue can occur in different periods."],["PFRS 15 para. 27","What two tests determine whether a service is distinct?","The customer can benefit from it and the promise is separately identifiable.","It is billed separately and prepaid.","It uses a different vendor and receipt date.","It has its own invoice and salesperson.","Assess whether the service is capable of being distinct and distinct in the contract context.","Separate billing alone does not establish distinctness."],["PFRS 15 paras. 105–108","Only time must pass before payment for a completed service. What is recognized?","A receivable.","A contract asset.","A contract liability.","A provision.","The right is unconditional because time is the only remaining factor. Recognize a receivable.","A contract asset depends on another condition besides time."],["PFRS 9 para. 5.5.15","What expected credit losses apply under the simplified approach for qualifying trade receivables without significant financing?","Lifetime expected credit losses.","Only losses on defaulted accounts.","Only twelve-month expected losses.","No allowance until legal action.","Apply lifetime expected credit losses from initial recognition.","The twelve-month measure under the general model does not govern these receivables."],["PFRS 15 para. 56","When is estimated variable consideration included in transaction price?","To the extent a significant reversal is highly probable not to occur.","Whenever management expects an optimistic outcome.","Only after every peso is collected.","Only with a cash deposit.","Estimate variable consideration, then apply the significant-reversal constraint.","A plausible estimate alone does not satisfy the constraint."]]),...ue("FAR","Inventories","inventory",[["PAS 2 paras. 10–11 and 16","Which cost is normally included in purchased inventory?","Inbound freight to bring it to its present location.","Abnormal waste.","Selling commissions.","Unrelated central administration.","Include costs necessary to bring inventory to its present location and condition. This includes inbound freight.","An operating expense can relate to sales without becoming inventory cost."],["PAS 2 para. 13","What activity level is the basis for allocating fixed production overhead?","Normal capacity.","Highest historical output.","Actual output in every circumstance.","Budgeted sales revenue.","Use normal capacity. Actual production may be used if it approximates normal capacity.","An unusually low month should not inflate inventory unit costs."],["PAS 2 para. 33","What limits reversal of an inventory write-down after NRV recovers?","Original write-down amount.","Full increase in selling price.","Replacement cost.","Reversal is prohibited.","Reverse up to the original write-down. The resulting value remains the lower of cost and revised NRV.","Improved selling prospects do not permit carrying inventory above cost."],["PAS 2 paras. 23 and 25","Which formula suits inventory segregated for a specific project and ordinarily not interchangeable?","Specific identification.","LIFO.","Weighted average is always required.","FIFO is always required.","Associate each segregated item with its actual individual cost.","FIFO and weighted average are used for items outside the specific-identification rule."]]),...ue("FAR","Property, Plant & Equipment" timated."],["PAS 32 para. 33","Where are repurchased ordinary shares presented?","Deduction from equity.","Investment asset.","Operating expense.","Reduction of revenue.","Treasury shares reduce equity. Dealings in own equity do not generate profit or loss.","Shares issued by another company may be an asset. These are the entity’s own."],["PAS 37 paras. 27–28","How is a contingent liability treated when an outflow is more than remote?","Disclose without recognizing a liability.","Recognize at the highest possible loss.","Recognize a receivable.","Omit it in every case.","Do not recognize a contingent liability. Disclose it unless outflow is remote.","A probable, reliably measurable present obligation may instead be a provision."],["PAS 1 para. 69","A normal operating-cycle trade payable is due after twelve months. How is it classified?","Current.","Noncurrent in every case.","Equity.","Deferred income.","Settlement in the normal operating cycle meets the current classification test.","The twelve-month criterion is only one route to current classification."]]),...ue("FAR","Financial Statements","statements",[["PAS 7 paras. 6 and 16","Cash paid for machinery used in ordinary production is what type of cash flow?","Investing outflow.","Operating outflow.","Financing outflow.","Noncash transaction.","Acquiring long-term production assets is investing. The cash payment is an outflow.","Operational use of the machine does not make its acquisition operating cash flow."],["PAS 8 paras. 36 and 38","A useful-life estimate changes after new information arrives. How is it applied?","Prospectively.","Restate every prior year.","Charge historical retained earnings directly.","Disclosure only with no amount effect.","Recognize the effects in the period of change and future periods as applicable.","Retrospective restatement addresses prior errors, not changes from new information."],["PAS 10 paras. 8–9","Post-year-end bankruptcy confirms a customer was already impaired at year-end. What kind of event is this?","Adjusting event.","Always non-adjusting.","Equity transaction.","Change in policy.","The later information confirms a condition existing at reporting date. Adjust the recognized amount.","The timing of discovery does not determine when the condition arose."],["PAS 7 paras. 6–7","What is the usual maturity window for a qualifying cash equivalent?","Three months or less from acquisition.","Twelve months from year-end.","Three months from issuance of statements.","Any maturity for listed instruments.","Cash equivalents are liquid, convertible to known amounts, and exposed to insignificant value risk. Their usual maturity is three months or less from acquisition.","Reporting date does not reset the maturity window."]])],lm=[...ue("AFAR","Partnership Accounting","partners",[["Civil Code art. 1797","How are partnership profits distributed when a valid agreement specifies the shares?","Under the agreement.","Equally in every case.","By hours worked.","Only by capital balances.","Apply the agreed profit-sharing basis. Defaults apply in the absence of stipulation.","Capital contribution rules do not override a valid agreed ratio."],["Civil Code arts. 1828–1829","What happens after dissolution and before winding up finishes?","The partnership continues for winding up.","It terminates immediately.","It turns into a corporation.","It must continue all new business indefinitely.","Dissolution changes the partners’ relationship. The partnership continues through winding up.","Dissolution and final termination are different stages."],["BOA AFAR syllabus · Partnership operations","What is a partner salary allowance in an agreed annual income allocation?","An allocation of profit among partners.","Always an employee wage expense.","A mandatory cash distribution.","A vendor liability.","Compute partnership profit and then allocate the allowance. Record drawings separately.","The word salary can make the allocation look like an operating expense."],["Civ r value."]]),...ue("AFAR","Consolidated Statements","group",[["PFRS 10 para. 7","Which three elements establish control?","Power, variable returns, and ability to use power to affect returns.","Majority holding, legal title, and guaranteed return.","Voting shares and common directors only.","A cost-based investment and dividends only.","Assess power and exposure to variable returns. Check whether the investor can use its power to affect those returns.","Voting percentages are evidence but do not alone establish all elements."],["PFRS 10 para. B86(c)","What happens to matching intragroup receivable and payable balances in consolidation?","Eliminate them in full.","Eliminate only the parent’s ownership percentage.","Show them separately.","Expense both.","The group cannot owe itself. Offset the matching balances in full.","Non-controlling shareholders do not make the intragroup debt a third-party balance."],["PFRS 10 para. 23","How is an increase in the parent’s stake accounted for when it retains control?","As an equity transaction.","As a second business combination.","As a consolidated gain or loss.","As a full goodwill reversal.","Confirm that control was retained. Account for the change as a transaction with owners.","Obtaining control in stages uses a different rule."],["PFRS 10 para. 22","Where is NCI presented in consolidated financial position?","Within equity, separately from owners of the parent.","As a current liability.","As a parent asset.","Only in the income statement.","NCI is residual equity in the consolidated group and is shown separately within equity.","The interest is outside the parent’s ownership yet belongs within group equity."]]),...ue("AFAR","Foreign Currency","fx",[["PAS 21 paras. 8–9","What primarily determines functional currency?","The primary economic environment.","Advertising currency.","Parent’s reporting currency in every case.","Country of incorporation in every case.","Look at the main environment generating and spending cash, including currencies that influence sales prices and input costs.","Presentation currency can differ from functional currency."],["PAS 21 para. 23(a)","Which rate applies to a foreign monetary payable at reporting date?","Closing rate.","Opening rate.","Historical invoice rate.","Lifetime average rate.","A payable fixed in foreign currency units is monetary. Translate it using the closing rate.","The historical rate may apply to a separate non-monetary historical-cost asset."],["PAS 21 para. 23(b)","What rate applies to a foreign-currency non-monetary asset carried at historical cost?","Transaction-date rate.","Closing rate in every case.","Annual average rate.","Later invoice settlement rate.","Keep the original exchange rate for the non-monetary item carried at historical cost.","Any separate unpaid supplier payable has its own monetary translation rule."],["PAS 21 para. 39(c)","Where are translation differences of a non-hyperinflationary foreign operation recognized on presentation-currency translation?","Other comprehensive income.","Sales revenue.","Income tax expense.","Opening cash.","Translate assets and liabilities at closing rates and income and expenses at transaction-date rates, allowing appropriate approximations. Put resulting differences in OCI.","Remeasurement of an individual monetary item often affects profit or loss."]]),...ue("AFAR","Long-Term Contracts","contracts",[["PFRS 15 para. 35(b)","A customer controls the asset as a contractor creates it. When is the obligation satisfied?","Over time.","Only when legal title transfers.","Only when cash is paid.","At signing.","Customer control during creation satisfies an over-time criterion.","Final handover does not override control already obtained."],["PFRS 15 paras. 35(c) and 37","A bespoke asset has no alternative use. Which additional fact completes this over-time criterion?","Enforceable right to payment for performance to date.","A fixed contract fee.","A prepaid deposit.","Expected contractor pr  prestation."],["Civil Code arts. 1157 and 1160","Sol independently manages another’s neglected business without authority under facts creating negotiorum gestio. What is the source of obligation?","Quasi-contract.","Express contract.","Delict in every case.","A testamentary disposition.","No prior authority or consent supplied a contract. The law treats qualifying management of another’s affairs as quasi-contract.","Providing a service does not automatically prove agreement."],["Civil Code art. 1159","Two parties sign and perform a lawful agreement. What force do its obligations have between them?","Force of law and performance in good faith.","No force until a court order exists.","Force only against strangers.","A nonbinding statement of intent.","A valid contract binds its parties, who must perform in good faith.","Court enforcement is a remedy, not the source of a valid contract’s binding force."],["Civil Code art. 1163","Absent a different legal or agreed standard, how must a party care for a specific machine awaiting delivery?","With the diligence of a good father of a family.","Only enough to avoid intentional damage.","No care is required before delivery.","Always as an insurer of every loss.","A duty to give includes proper preservation pending delivery. Use the default diligence unless a different standard governs.","The general duty of care is not absolute insurance."],["Civil Code art. 1165","A debtor fails to deliver the exact equipment promised. What remedy may the creditor seek for that determinate item?","Compel delivery, where legally available.","Accept another item selected by the debtor in every case.","Treat the obligation as automatically extinguished.","Demand immediately a criminal conviction.","Identify whether the thing is determinate. The creditor may seek delivery of that item in addition to applicable damages.","Substitute performance rules for generic items answer a different problem."],["Civil Code art. 1169","Without applicable exceptions, what generally places a debtor in legal delay?","A judicial or extrajudicial demand for performance.","The contract’s signature alone.","Publication in a trade journal.","A police complaint only.","Check whether demand is required and whether a judicial or extrajudicial demand occurred.","An agreed date does not always dispense with demand."],["Civil Code art. 1170","Which conduct can make a party liable for damages in performing an obligation?","Fraud, negligence, delay, or contravention of its tenor.","Proper complete performance only.","Any decision by the creditor.","Only a criminal conviction.","Identify the kind of breach and apply the damages rule to performance.","Civil liability for breach need not depend on a criminal conviction."],["Civil Code art. 1171","A clause waives any action for fraud the debtor may commit in the future. How is the waiver treated?","Void.","Automatically binding if initialed.","Valid for commercial debt only.","Converted to a guaranty.","Responsibility for fraud is demandable. A waiver of an action for future fraud is void.","Freedom of contract is subject to this statutory limit."],["Civil Code art. 1174","Absent assumption of risk, law, or stipulation to the contrary, what is the general effect of a qualifying fortuitous event?","No liability for the event.","Automatic double damages.","Automatic liability regardless of circumstances.","Automatic rescission of all related contracts.","Check whether the event qualifies and whether an exception imposes responsibility.","An unforeseeable event does not excuse a debtor who independently assumed its risk."],["Civil Code art. 1179","An obligation depends on no future uncertain event or unknown past event and has no period. When is it demandable?","At once.","After one calendar year.","After the parties pick a new date.","Only after a court supplies a condition.","Classify the obligation as pure. It is immediately demandable.","Immediate demandability and legal delay after demand are distinct."],["Civil Code art. 1181","Under a suspensive condition, when is the right generally acquired?","When the uncertain event occurs.","At contract signature regardless of the event.","When a party turns a specified age as a universal rule.","Only at final judgment.","Identify the uncertain trigger and wait for fulfillment before the acquisition of the right under the condition.","A period involves a day certain, unlike an uncertain condition."],["Civil Code art. 1186","A debtor voluntarily prevents fulfillment of a condition. What is the condition’s legal treatment?","Deemed fulfilled.","Deemed impossible at contract formation.","Extended indefinitely.","Automatically replaced by a fixed term.","Apply constructive fulfillment when the obligor voluntarily prevents fulfillment.","Literal failure of the event does not let the obligor benefit from preventing it."],["Civil Code art. 1191","A substantial breach defeats a reciprocal contract. What may the injured party generally choose?","Fulfillment or rescission, with damages in either case as proper.","Only a criminal prosecution.","Only a reduction of all taxes.","No relief for reciprocal obligations.","Identify the reciprocal obligations and substantial breach. The injured party may choose fulfillment or rescission under the article.","This remedy differs from rescission of a rescissible contract for lesion or prejudice."],["Civil Code arts. 1207–1208","Several debtors owe a divisible debt. No law, stipulation, or nature of the obligation requires solidarity. What is the presumption?","Joint liability.","Each owes the entire amount.","No debtor has liability.","All are guarantors only.","Look for a basis for solidarity. Without one, presume joint liability and distinct shares.","Multiple names on a contract are not enough to impose solidary liability."],["Civil Code art. 1216","Which solidary debtor may a creditor pursue for the obligation?","Any one, some, or all of them.","Only the debtor with the largest capital balance.","All together or no one.","Only the first to sign.","In solidarity each debtor may be pursued for the whole, subject to payment and applicable defenses.","Joint debtors usually answer for shares. That is a different regime."],["Civil Code art. 1234","A contractor substantially performs in good faith. What may generally be recovered?","The contract amount less damages suffered by the other party.","Nothing in every case.","Always twice the contract price.","Automatically the full price without offsets.","Find substantial performance and good faith. Allow recovery while deducting damages from remaining defects.","The creditor need not absorb damages from incomplete performance."],["Civil Code art. 1244","A debtor offers a different item of greater value in place of the exact thing due. Must the creditor accept it?","No, the creditor cannot be compelled to accept it.","Yes, whenever the substitute is more valuable.","Yes, whenever both items are movable.","Yes, if the debtor sends written notice.","Compare the offered item with the agreed prestation. The creditor may refuse substituted performance.","Higher market value does not amend the bargain."],["Civil Code art. 1279","Which situation generally allows legal compensation if other statutory conditions are met?","Each party is principal creditor and debtor of the other and both money debts are due and liquidated.","A due debt is offset by a purely hypothetical claim.","One debt is not yet demandable.","The parties owe unrelated third parties only.","Check reciprocity, kind, maturity, liquidity, and any statutory impediment before applying setoff.","Reciprocity alone does not make an unliquidated or unmatured debt compensable."],["Civil Code art. 1318","Which are the essential requisites of a contract?","Consent, certain object, and cause.","Notarization, witness, and deposit in every case.","Writing, penalty, and full payment.","Registration, guaranty, and insurance.","Assess a meeting of minds on a certain object and the cause of the obligation.","Form can matter for some contracts, but it is separate from the universal requisites."],["Civil Code art. 1390","A party’s consent was obtained by actionable intimidation. How is the contract generally classified?","Voidable.","Automatically void for every purpose.","Rescissible only due to lesion.","Unenforceable solely for lack of registration.","Intimidation vitiates consent. A voidable contract binds until annulled and may be ratified under the rules.","Void and voidable contracts have different legal effects."]]),dm=ue("RFBT","Sales & Agency","sales",[["Civil Code art. 1458","What does a seller undertake under a contract of sale?","Transfer ownership and deliver a determinate thing in return for a price certain.","Lend money at interest.","Hold goods without any transfer of ownership.","Act as general agent for the buyer.","Identify the thing, transfer and delivery undertaking, and price certain in money or its equivalent.","Transfer obligations distinguish sale from a mere bailment."],["Civil Code art. 1475","When is a contract of sale generally perfected?","When the parties agree on the thing and the price.","Only after physical delivery.","Only after full payment.","Only after registration in every case.","Find the meeting of minds on the determinate thing and the price.","Delivery ordinarily transfers ownership and is distinct from perfection."],["Civil Code art. 1477","Absent reservation or a special rule, when does ownership of the thing sold generally transfer?","Upon actual or constructive delivery.","At price quotation.","At the buyer’s first inquiry.","Only upon final full payment in every case.","Identify delivery as the general transfer event. Check if ownership was validly reserved.","A perfected sale creates obligations even before ownership is transferred."],["Civil Code art. 1478","Can the parties agree that ownership will remain with the seller until full payment?","Yes, they can stipulate retention of ownership.","No, payment terms never affect ownership.","Yes, but only after full payment.","No, every sale transfers title at negotiation.","Apply the valid reservation of ownership according to the stipulated condition.","The general delivery rule allows a reservation by agreement."],["Civil Code art. 1482","What is earnest money in an ordinary contract of sale generally considered?","Part of the price and proof of perfection.","Always payment for a separate option.","An unrelated insurance premium.","A completed refund of the purchase.","Identify payment made as earnest money under the sale. Credit it toward the purchase price.","Option money may keep an offer open. It is a separate concept."],["Civil Code arts. 1484–1485","In a covered installment sale of personal property, what follows foreclosure of the chattel mortgage after qualifying default?","The seller has no further action for an unpaid price balance.","The seller may always recover the remaining balance as well.","The buyer can demand an additional item.","The installment contract converts into a lease automatically.","Apply the statutory foreclosure remedy and its bar to further recovery of the unpaid price.","The general expectation of collecting a deficiency is displaced in this specific setting."],["Civil Code art. 1497","When has actual delivery of a movable sold occurred?","It is placed in the buyer’s control and possession.","It is advertised for sale.","The seller receives a quotation.","The item is merely marked on a shelf without more.","Confirm the buyer has been placed in control and possession of the item.","Identification alone does not necessarily place an item under buyer control."],["Civil Code art. 1498","Absent contrary indications, what is the usual effect of executing a sale in a public instrument?","It is equivalent to delivery.","It always prevents delivery.","It converts the sale to an option.","It eliminates the price.","The public instrument can constitute constructive delivery unless the instrument shows or clearly implies otherwise.","Delivery can be constructive even without physical handover that day."],["Civil Code art. 1504","If ownership has passed and no exception or contrary agreement applies, who generally bears the risk of loss?","The buyer.","The seller indefinitely.","The carrier in every case.","The seller’s accountant.","Check transfer of ownership and applicable exceptions. Risk generally follows ownership.","The person holding goods can differ from the owner."],["Civil Code art. 1544","The same movable is sold to two buyers. Who generally prevails under the double-sale rule?","The first to take possession in good faith.","The person who offered the higher price.","The one who signs the latest contract.","The first to threaten litigation.","For a movable, identify first good-faith possession.","Real property follows a different priority structure."],["Civil Code art. 1544","The same registered real property is sold twice. Both buyers act in good faith. Who generally prevails if one registers first?","The buyer who first registers in good faith.","The buyer who paid cash.","The buyer who files suit first.","The buyer who offers a higher price.","For immovables, begin with good-faith registration under the statutory priority.","First possession becomes relevant in the absence of qualifying registration."],["Civil Code art. 1548","What event characterizes eviction under the seller’s warranty?","Final judgment deprives the buyer of all or part based on a right prior to sale or an act imputable to the seller.","The buyer regrets the purchase.","The market value drops.","A supplier ships late.","Identify a final judgment depriving the buyer and check the basis specified by the article.","A third party’s unsupported complaint is not yet eviction."],["Civil Code art. 1561","When can a hidden defect trigger the seller’s warranty?","When it makes the thing unfit or substantially reduces fitness under the statutory test.","When the buyer sees the defect before the sale in every case.","Only when the seller is the manufacturer.","Whenever market demand changes.","Assess hiddenness and seriousness, including whether the buyer would have refused or paid less.","Mere dissatisfaction with market value differs from a qualifying defect."],["Civil Code art. 1868","What is the defining relationship in agency?","A person acts in representation or on behalf of another with authority or consent.","A person buys goods solely for personal resale in every case.","A debtor substitutes collateral.","A creditor waives collection.","Look for representation on the principal’s behalf and authorization or consent.","An independent transaction for one’s own account is different."],["Civil Code art. 1869","What form may ordinary agency take absent a required special form?","Express or implied.","Only judicial appointment.","Always a public instrument.","Only after performance is completed.","Examine words and conduct that can establish consent. Special acts may require a particular form.","The general rule of implied agency does not remove special form requirements."],["Civil Code art. 1874","An agent purports to sell the principal’s land. What form of authority is required?","Written authority.","Oral authority in every case.","A buyer’s deposit instead of authority.","No authority if the agent is related.","A sale of land or an interest in land by an agent requires written authority. Without it the sale is void under the article.","Ordinary agency can be oral or implied, but authority for a land sale has a specific rule."],["Civil Code art. 1878","Which act generally needs special authority from a principal?","Compromising a claim.","Receiving ordinary correspondence.","Filing a copy in an office drawer.","Scheduling a routine meeting.","Distinguish acts of administration from acts listed as requiring a special power. Compromise is one of them.","Language granting broad administration is insufficient for specially enumerated acts."],["Civil Code art. 1881","What must an agent observe in acting for a principal?","The scope of authority.","Only the other party’s preference.","A universal power to exceed authority.","A rule to disregard the principal’s instructions.","Identify the authorized scope and act within it, considering lawful instructions.","An action helpful to an agent personally may still be unauthorized."],["Civil Code arts. 1897 and 1910","An authorized agent contracts in the principal’s name and gives no personal undertaking. Who generally is bound?","The principal.","Only the agent personally.","Neither party.","The agent’s employer from a prior job.","The principal answers for authorized obligations. The disclosed agent ordinarily undertakes no personal liability without an applicable exception.","Signing as representative differs from personally promising payment."],["Civil Code arts. 1919 and 1920","Which event generally extinguishes a revocable agency, subject to lawful exceptions?","Revocation by the principal.","An ordinary sale by a stranger.","A principal’s address change alone.","The agent records a transaction.","Revocation is a recognized termination event. Check for exceptions and notice effects when relevant.","Some agencies tied to an interest have separate rules about revocability."]]),fm=[...ue("RFBT","Partnerships","partners",[["Civil Code art. 1767","What combination characterizes a partnership contract?","Contributions to a common fund with intention to divide profits.","Co-ownership without intent to share profits.","A unilateral gift to a vendor.","Any agreement to lend money.","Look for contribution of money, property, or industry and an intent to share profits.","Co-ownership does not by itself establish a partnership."],["Civil Code art. 1768","Whose juridical personality does a partnership have?","Its own personality separate from the partners.","The personality of its largest partner only.","No personality before earning profit in every case.","The personality of its first customer.","A partnership has a juridical personality separate from each partner.","A partner’s personal liability for some debts does not erase the entity’s separate personality."],["Civil Code art. 1769(3)","Does sharing gross returns by itself establish a partnership?","No, gross-return sharing alone is insufficient.","Yes, without exception.","Only if a bank processes the payment.","Only if returns are paid monthly.","Distinguish gross receipts from net profits and examine other partnership elements.","A gross split may just compensate use of jointly held property."],["Civil Code art. 1769(4)","Which receipt of a share of profits is expressly treated as an exception to the usual prima facie inference?","Receipt as wages of an employee.","A founder’s agreed profit distribution.","A general partner’s allocated operating profit.","A partner’s undistributed annual profit.","Identify the legal character of the receipt. A share received as employee wages is an exception.","Profit-linked wages can look like a partner’s share."],["Civil Code art. 1771","What instrument is required if immovable property or real rights are contributed to a partnership?","A public instrument.","An oral promise only.","An unsigned estimate.","A cash memo.","Check the kind of contribution. Immovable property or real rights trigger the public-instrument requirement.","Informal formation rules do not cover all kinds of contributions."],["Civil Code art. 1773","What additional document is required when immovable property is contributed?","A signed inventory attached to the public instrument.","An insurance quote only.","A second unrelated partnership agreement.","An unsigned valuation kept internally.","Make and sign the inventory of immovable property and attach it to the public instrument. Absence of that inventory makes the contract void.","The public instrument alone does not meet this additional condition."],["Civil Code art. 1786","What does each partner owe to the partnership regarding a promised contribution?","The partner is a debtor for the promised contribution.","The promise is unenforceable until dissolution.","Only interest is owed in every case.","The partner may replace it unilaterally with anything.","Identify what was promised to the common fund. The partner owes that contribution to the partnership.","An internal contribution obligation is legally distinct from a partner’s outside debt."],["Civil Code art. 1788","A partner fails to contribute promised money when due. When does liability for interest and damages start under the article?","When the partner should have made the contribution.","Only on dissolution.","Only once cash is ultimately paid.","A year after demand in every case.","Apply the contribution due date to determine when interest and damages begin.","The specific partnership rule uses the date the contribution should have been made."],["Civil Code art. 1789","May an industrial partner generally run a business for personal account without express permission?","No, unless the partnership expressly permits it.","Yes, in all cases.","Only if the business uses the same supplier.","Yes, whenever no salary is paid.","Identify the partner as industrial. Check for express permission before allowing separate business activity.","General freedom to do business is subject to the partner’s statutory obligation."],["Civil Code art. 1797","With no agreed loss allocation but a valid agreed profit allocation, what default loss ratio applies to capitalist partners?","The same ratio as their profit shares.","An equal split in every case.","All loss goes to the oldest partner.","No one bears a loss.","Use an agreed loss ratio if present. If only profit shares were agreed, use that proportion for loss allocation subject to the applicable rules.","Capital contributions are not the first fallback where a profit ratio already exists."],["Civil Code art. 1799","Two capitalist partners agree that one is excluded from all profits. What is the status of that stipulation?","Void.","Always binding if oral.","Valid only during dissolution.","Automatically replaced with a fixed salary.","The law invalidates a stipulation excluding a partner from any share in profits or losses, subject to the rule on industrial partners and losses.","Freedom of contract is constrained by the partnership profit-sharing rule."],["Civil Code art. 1805","What general access does a partner have to books kept at the principal place of business?","Inspect and copy them at any reasonable hour.","Inspect only after dissolution.","No access unless personally appointed as manager.","Access only if an external auditor permits it.","The books are kept at the principal place of business subject to agreement. A partner may access, inspect, and copy them reasonably.","Management status does not determine the general partner inspection right."],["Civil Code art. 1807","What does a partner owe after taking a benefit without consent from use of partnership property?","Account to the partnership and hold the profit as trustee.","Keep it without disclosure.","Pay it to the largest customer.","Convert the profit into capital without accounting.","Identify benefit derived through partnership property and absence of other partners’ consent. Account for the profit.","Personal receipt does not make the benefit exclusively personal."],["Civil Code art. 1811","A partner wants to assign only their interest in a specific partnership machine. Can it be assigned separately?","Generally no, except in connection with assignment by all partners of rights in that property.","Yes, always like individually owned property.","Yes, by simply notifying a customer.","Yes, automatically upon depreciation.","Distinguish rights in specific partnership property from the assignable economic interest in the partnership.","A share in profits and surplus is not ownership of a personally separable machine."],["Civil Code art. 1812","What constitutes a partner’s interest in the partnership?","Their share of profits and surplus.","Exclusive title to each specific asset.","Only the capital originally promised.","All goodwill without regard to other partners.","Separate the economic interest from specific property rights and management rights.","Capital contribution and residual economic entitlement can differ."],["Civil Code art. 1813","A partner assigns their whole economic interest. What generally happens to management rights during continuation?","The assignee does not acquire management rights merely by assignment.","The assignee immediately becomes managing partner.","Every other partner loses voting rights.","The assignment transfers all customer contracts personally.","Assignment ordinarily transfers economic rights, not management participation or partner status.","Receiving distributions and joining management are different entitlements."],["Civil Code art. 1818","A partner appears to carry on ordinary partnership business. When may that act bind the partnership?","Generally unless actual authority is lacking and the counterparty knows that.","Only if signed by every partner.","Never for routine business.","Only after dissolution.","Assess whether the act is apparently usual and then check authority and third-party knowledge.","An internal restriction alone may not protect against an unaware counterparty."],["Civil Code art. 1825","A person holds themselves out as a partner and a creditor extends credit in reliance. What doctrine can apply?","Partnership by estoppel.","Assignment of future property.","Mandatory corporate merger.","Automatic novation into a gift.","Identify a representation and creditor reliance. Those facts can create statutory liability from estoppel.","The person need not be a true partner for the estoppel rule to matter."],["Civil Code art. 1826","Absent a contrary stipulation, from what property is an incoming partner’s liability for prior partnership obligations satisfied?","Partnership property only.","Only the incoming partner’s house.","Only the creditor’s property.","No property can ever answer.","Distinguish being liable for prior obligations from which assets may satisfy that liability. The default limits satisfaction to partnership property.","Liability for later obligations can have a different scope."],["Civil Code arts. 1836–1837","After dissolution, what process settles partnership affairs?","Winding up.","Automatic stock exchange listing.","Compulsory reopening for new business.","Asking creditors to waive claims in every case.","Wind up the business by resolving obligations and distributing any surplus under applicable priorities.","Dissolution starts the settlement process rather than instantly disposing of all property."]]),...ue("RFBT","Corporations","corporations",[["RA 11232 sec. 2","Which description fits a Philippine corporation?","A legal being created by operation of law with succession and legally granted or incidental powers.","Any oral profit-sharing promise.","A sole proprietor’s trade name only.","A group that has never incorporated in every case.","Identify legal creation, succession, and powers in the statutory definition.","Business activity alone does not create a corporation."],["RA 11232 sec. 3","What distinguishes a stock corporation from a nonstock corporation?","Share capital is divided into shares and surplus profits may be distributed on the basis of shares.","It can never have income.","It has no board.","It is always publicly listed.","Check both capital divided into shares and authority to distribute dividends or surplus according to shares.","Being privately held does not prevent a corporation from being a stock corporation."],["RA 11232 sec. 6","Can nonvoting shares vote on amendments to the articles of incorporation?","Yes, they can vote on this listed fundamental matter.","No, never on any corporate matter.","Only when the corporation pays a dividend.","Only if converted into treasury shares.","Identify this action as one for which holders of nonvoting shares may vote under the Code.","The nonvoting designation usually concerns ordinary voting and has statutory exceptions."],["RA 11232 sec. 8","Can valid redeemable shares be purchased when the corporation lacks unrestricted retained earnings, subject to statutory terms and rules?","Yes, redemption may occur despite absence of unrestricted retained earnings.","No, the earnings test admits no exceptions.","Only after the issuer dissolves.","Only if each share has converted to voting common stock.","Check the articles, terms, and applicable rules for redeemable shares. The statute allows redemption notwithstanding the absence of unrestricted retained earnings.","Ordinary acquisition of own shares and redemption under specified terms differ."],["RA 11232 sec. 9","What are treasury shares?","Issued and fully paid shares lawfully reacquired by the issuer.","Shares authorized but never issued.","Shares subscribed but never paid or issued.","All shares owned by the corporate treasurer.","Look for both original issuance and full payment, then lawful reacquisition by the issuer.","The treasurer’s personal holdings do not define treasury shares."],["RA 11232 sec. 10","What is the general maximum number of incorporators when forming a private corporation?","Fifteen.","Five.","Twenty-five.","No maximum.","Check the general organizing limit. Up to fifteen incorporators are allowed.","Legacy minimum or organizational rules should not be confused with this maximum."],["RA 11232 sec. 11","What is a corporation’s default term under the Revised Corporation Code?","Perpetual unless its articles provide otherwise.","Always exactly fifty years.","Always one year.","Until the first sale of stock.","Apply perpetual existence as the default and inspect the articles for a different term.","The former default term does not control this question."],["RA 11232 sec. 12","Absent a special law, what minimum capital stock is generally required for a stock corporation?","No minimum capital stock requirement.","A fixed minimum of ₱1 million.","A fixed minimum of ₱100 million.","Always 25% of every incorporator’s net worth.","Consult the general no-minimum rule and verify whether a special law imposes one for the business.","Sector-specific capital requirements do not define the general rule."],["RA 11232 sec. 18","When does the corporation ordinarily commence juridical personality?","When the SEC issues the certificate of incorporation.","When incorporators draft articles.","When the first subscription is discussed.","At the first dividend declaration.","Locate the date of issuance of the incorporation certificate. That is the statutory commencement date.","Signing articles is part of forming the corporation and does not itself start juridical personality."],["RA 11232 sec. 20","What general liability can arise for people who knowingly act as a corporation without authority?","Liability as general partners under the corporation-by-estoppel rule.","Automatic immunity.","Only liability capped at dividends already received.","Only liability to pay a securities registration fee.","Check knowing assumption of corporate authority. The statute can impose general-partner liability for resulting obligations.","Acting under a corporate name does not automatically create a liability shield."],["RA 11232 sec. 22","Who generally exercises corporate powers and controls corporate property?","The board of directors or trustees.","Every customer voting individually.","The outside auditor.","The company’s largest supplier.","Identify the board as the ordinary governing body, subject to powers reserved to stockholders or members.","Investment ownership and day-to-day corporate governance are separate concepts."],["RA 11232 sec. 24","Which qualification applies to the corporate secretary?","Philippine citizen and resident.","Must be a foreign nonresident.","Must own a majority of shares.","Must be the independent auditor.","Apply both citizenship and residence requirements for the corporate secretary.","Different corporate officers can have distinct legal qualifications."],["RA 11232 sec. 29","Who generally cannot participate in determining their own director compensation?","The directors or trustees concerned.","All stockholders without exception.","All external customers.","Only the financial statement preparer.","Recognize the conflict when directors or trustees determine their own compensation. The Code restricts their participation.","A director’s governance role does not justify self-setting compensation."],["RA 11232 sec. 61","May shares be issued in exchange for promissory notes or future services?","No, neither is valid consideration for issuance.","Yes, both always qualify at face value.","Yes, an oral promise is sufficient.","Yes, if the issuer plans to list.","Check the allowed consideration categories. Promissory notes and future services are expressly excluded.","Services actually rendered can qualify under conditions, unlike future services."],["RA 11232 sec. 38","What general right do stockholders have to subscribe proportionally to increases or dispositions of shares, subject to exceptions?","Preemptive right.","Appraisal right.","Automatic right to an annual dividend.","Right to inspect a competitor’s books.","Proportional subscription helps preserve ownership percentage. Check articles and statutory exceptions.","Appraisal concerns payment for shares after dissent in specified situations."],["RA 11232 sec. 42","From what source may a corporation generally declare dividends?","Unrestricted retained earnings.","Gross sales without regard to expenses.","Authorized but unissued capital.","Customer deposits alone.","Determine whether unrestricted retained earnings support the declaration.","Cash availability and distributable earnings are different requirements."],["RA 11232 sec. 56","Can treasury shares vote while held in treasury?","No.","Yes, always.","Yes, if reacquired at par.","Yes, for their first year in treasury.","Treat reacquired shares held in treasury under the suspension of voting rights.","Original voting rights do not remain exercisable by the issuing corporation."],["RA 11232 sec. 70","What voting right does a delinquent share ordinarily carry while delinquent?","It cannot be voted.","Double voting power.","Only the right to elect the treasurer.","All ordinary voting rights.","Apply the suspension while delinquent, subject to rights the statute preserves.","Unpaid subscriptions that are not delinquent have a different rule."],["RA 11232 sec. 116","Who may form a One Person Corporation, subject to statutory exclusions?","A natural person, trust, or estate.","Any public bank.","Any publicly listed corporation.","Only a group of at least five natural persons.","Check eligible single stockholders and excluded classes. Natural persons, trusts, and estates may qualify.","Single share ownership does not override restrictions on who may organize an OPC."],["RA 11232 sec. 122","Can the single stockholder of an OPC act as its corporate secretary?","No.","Yes, in all cases.","Only if it has no employees.","Yes, after the first dividend.","Apply the express prohibition on a single stockholder serving as corporate secretary.","The single stockholder may act as president and, with conditions, treasurer, which are different offices."]])],pm=ue("RFBT","Special Business Laws","special",[["RA 8792 sec. 6","A contract record is in an electronic data message. Can it be denied validity solely because of that form?","No.","Yes, automatically in all cases.","Only if the parties dislike the electronic form.","Yes, unless it was faxed.","Assess legal effect without rejecting the information solely because it is a data message.","Electronic recognition does not eliminate other substantive requirements."],["RA 8792 sec. 7","A law calls for a writing. What supports electronic equivalence under the statutory conditions?","Integrity and reliability, plus authentication and usability for later reference.","Deletion once read.","An inaccessible password known to neither party.","An unreadable screenshot in every case.","Check integrity and reliability, ability to authenticate, and usability for subsequent reference, along with any remaining legal formalities.","The presence of a file does not alone establish compliance."],["RA 8792 sec. 8","What can have equivalent legal effect to a written signature when the statutory conditions are met?","An electronic signature.","An unrelated email receipt.","The title of the document alone.","The number of pages alone.","Apply the requirements for authenticating the signatory and showing consent or approval under the circumstances.","Typing unrelated text into a form does not necessarily constitute signing."],["RA 8792 sec. 11","May an electronic document offered as evidence be rejected solely because it is electronic?","No, electronic form alone is insufficient to reject it.","Yes, every time.","Yes, if a paper signature is missing in every case.","Yes, whenever printed records also exist.","Consider applicable admissibility and authentication factors without excluding solely due to electronic form.","Electronic form does not guarantee admissibility either."],["RA 8792 sec. 12","When retaining an electronic document to meet a legal retention requirement, which characteristic matters?","The information stays accessible for subsequent reference.","It becomes inaccessible once sent.","It is changed each time it is viewed.","The sender’s identity is removed in every case.","Keep the retained data accessible and preserve the required accuracy and identifying information.","Keeping an unusable copy does not fulfill the purpose of retention."],["RA 8792 sec. 16","Can offer and acceptance generally be expressed or demonstrated by electronic messages under the statutory conditions?","Yes, absent a contrary agreement or governing form requirement.","No, an envelope is always mandatory.","Only if both sides are government agencies.","Only if the parties never intend to be bound.","Assess the electronic communications for clear offer and acceptance and check applicable formalities.","Electronic communications can form a contract, while substantive formation rules still apply."],["RA 10173 sec. 3(g)","What makes information personal information under the Data Privacy Act?","Identity is apparent or reasonably ascertainable directly or with other information.","It must contain payment card data.","It must appear on government letterhead.","It must be transmitted by email.","Check identifiability both on the face of the data and in combination with reasonably available information.","Removing the name may still leave a person identifiable."],["RA 10173 sec. 3(h)","Who is a personal information controller?","The person or organization that controls collection, holding, processing, or use, subject to statutory exclusions.","Every data subject by default.","Any software vendor even with no control over processing.","An outside auditor in all cases.","Identify who determines or controls processing and consider exclusions such as a party acting on instructions.","A service provider following instructions may be a processor instead."],["RA 10173 sec. 11","Which trio gives the general data privacy principles?","Transparency, legitimate purpose, and proportionality.","Secrecy, collection by default, and retention forever.","Profit, speed, and automation.","Consent, perpetual storage, and open publication.","Check whether processing is transparent, serves a legitimate purpose, and is proportionate to it.","A lawful purpose does not by itself justify collecting every available data point."],["RA 10173 sec. 11(e)","For how long should an organization generally retain personal information?","As long as necessary for the purpose or a permitted legal or legitimate retention basis.","Forever after any consent.","Exactly one day for all information
