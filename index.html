11976_2024.html",train:"https://lawphil.net/statutes/repacts/ra2017/ra_10963_2017.html",civil:"https://lawphil.net/statutes/repacts/ra1949/ra_386_1949.html",corporation:"https://lawphil.net/statutes/repacts/ra2019/ra_11232_2019.html",psa:"https://aasc.org.ph/category/philippine-standards-on-auditing-psas",standards:"https://www.pfsrsc.org/government-organization-our-standards"};function Ef(o){return o.includes("RR 21-2025")?"https://bir-cdn.bir.gov.ph/BIR/pdf/RR%20NO.%2021-2025.pdf":/RA 12214|CMEPA/.test(o)?Oe.cmepa:/RA 12066|CREATE MORE/.test(o)?Oe.createMore:o.includes("RR 6-2024")?"https://bir-cdn.bir.gov.ph/BIR/pdf/RR%206-2024%20%28final%29.pdf":/RA 11976|EOPT/.test(o)?Oe.eopt:o.startsWith("NIRC")?Oe.train:o.startsWith("Civil Code")?Oe.civil:o.startsWith("RA 11232")?Oe.corporation:o.startsWith("RA 8792")?"https://lawphil.net/statutes/repacts/ra2000/ra_8792_2000.html":o.startsWith("RA 10173")?"https://lawphil.net/statutes/repacts/ra2012/ra_10173_2012.html":o.startsWith("Act No. 2031")?"https://lawphil.net/statutes/acts/act1911/act_2031_1911.html":o.includes("RA 9194")?"https://lawphil.net/statutes/repacts/ra2003/ra_9194_2003.html":o.includes("RA 10365")?"https://lawphil.net/statutes/repacts/ra2013/ra_10365_2013.html":o.includes("RA 11521")?"https://lawphil.net/statutes/repacts/ra2021/ra_11521_2021.html":o.startsWith("RA 9160")?"https://lawphil.net/statutes/repacts/ra2001/ra_9160_2001.html":o.startsWith("RA 10142")?"https://lawphil.net/statutes/repacts/ra2010/ra_10142_2010.html":o.startsWith("RA 9520")?"https://lawphil.net/statutes/repacts/ra2009/ra_9520_2009.html":o.startsWith("RA 11032")?"https://lawphil.net/statutes/repacts/ra2018/ra_11032_2018.html":o.startsWith("RA 7394")?"https://lawphil.net/statutes/repacts/ra1992/ra_7394_1992.html":o.startsWith("PSA")?Oe.psa:/^(PAS|PFRS)/.test(o)?Oe.standards:Oe.syllabus}function Ju(o){return Tt.some(u=>u.id===o)}const Pf=JSON.parse('[{"id":"ms-001","subject":"MS","topic":"Multi-product CVP","difficulty":"Easy","question":"A company sells bundle components in a stable physical sales mix. Which denominator converts fixed costs to break-even composite bundles?","choices":["Average selling price per unit","Unweighted unit contribution margin","Contribution margin per composite bundle","Gross margin per unit"],"correctIndex":2,"solutionSteps":["Step 1: Construct a bundle reflecting the unit sales mix.","Step 2: Sum each product’s contribution in that bundle."],"boardTrap":"A simple average assumes an equal unit mix.","citation":"BOA MS syllabus §1.2.2.6"},{"id":"ms-002","subject":"MS","topic":"Multi-product CVP","difficulty":"Easy","question":"Which measure expresses the peso sales decline a department can sustain before posting an operating loss?","choices":["Contribution margin","Margin of safety","Sales-volume variance","Degree of operating leverage"],"correctIndex":1,"solutionSteps":["Step 1: Find actual or planned sales less break-even sales.","Step 2: That excess is the cushion before loss."],"boardTrap":"Contribution measures sales less variable costs, rather than distance from break-even.","citation":"BOA MS syllabus §1.2.2.7"},{"id":"ms-003","subject":"MS","topic":"Multi-product CVP","difficulty":"Easy","question":"Which assumption is used by a conventional linear multiproduct CVP model?","choices":["Unit prices, variable unit costs, and sales mix are stable within the relevant range.","Fixed expense per unit remains unchanged at all volumes.","Selling prices automatically decline as volume rises.","The product sales mix may change without affecting break-even."],"correctIndex":0,"solutionSteps":["Step 1: Identify the relevant range.","Step 2: Use stable price, variable-unit cost and mix assumptions for the estimate."],"boardTrap":"Total fixed cost can be stable even as fixed cost per unit falls.","citation":"BOA MS syllabus §1.2.2.1"},{"id":"ms-004","subject":"MS","topic":"Multi-product CVP","difficulty":"Easy","question":"At constant unit price and variable cost, what happens to break-even volume if a fixed license fee increases?","choices":["It falls.","It stays because the fee is fixed.","It falls if the fee is paid in advance.","It rises."],"correctIndex":3,"solutionSteps":["Step 1: The fee increases fixed expense without changing unit contribution.","Step 2: Divide the higher fixed cost by the unchanged unit contribution."],"boardTrap":"Being fixed means invariant to volume, not irrelevant to break-even.","citation":"BOA MS syllabus §1.2.2.2"},{"id":"ms-005","subject":"MS","topic":"Multi-product CVP","difficulty":"Moderate","question":"A Davao roaster sells drip packs at ₱120 with ₱72 variable cost and cold brew at ₱180 with ₱105 variable cost. It expects 3 drip packs per 2 cold brews. Monthly fixed expense is ₱294,000.\\n\\nWhat is the break-even sales quantity for drip packs?","choices":["1,000 packs","2,000 packs","6,125 packs","3,000 packs"],"correctIndex":3,"solutionSteps":["Step 1: A bundle contributes 3 × ₱48 + 2 × ₱75 = ₱294.","Step 2: Break-even = 1,000 bundles × 3 = 3,000 packs."],"boardTrap":"Dividing all fixed costs by drip-pack contribution treats the second product as absent.","citation":"BOA MS syllabus §1.2.2.6"},{"id":"ms-006","subject":"MS","topic":"Multi-product CVP","difficulty":"Moderate","question":"A Davao roaster sells drip packs at ₱120 with ₱72 variable cost and cold brew at ₱180 with ₱105 variable cost. It expects 3 drip packs per 2 cold brews. Monthly fixed expense is ₱294,000.\\n\\nWhat are total peso sales at break-even?","choices":["₱360,000","₱300,000","₱720,000","₱294,000"],"correctIndex":2,"solutionSteps":["Step 1: Break-even is ₱294,000 ÷ ₱294 = 1,000 bundles.","Step 2: Sales per bundle equal 3 × ₱120 + 2 × ₱180 = ₱720. Multiply to ₱720,000."],"boardTrap":"₱294,000 is required contribution, not sales.","citation":"BOA MS syllabus §1.2.2.3 and .6"},{"id":"ms-007","subject":"MS","topic":"Multi-product CVP","difficulty":"Moderate","question":"A Davao roaster sells drip packs at ₱120 with ₱72 variable cost and cold brew at ₱180 with ₱105 variable cost. It expects 3 drip packs per 2 cold brews. Monthly fixed expense is ₱294,000.\\n\\nWith the same mix, how many total units must be sold for ₱44,100 operating profit?","choices":["1,150 units","5,750 units","5,000 units","750 units"],"correctIndex":1,"solutionSteps":["Step 1: Target contribution = ₱338,100. Divide by ₱294 for 1,150 bundles.","Step 2: Each bundle contains 5 units, hence 5,750 units."],"boardTrap":"Target contribution above break-even alone calculates incremental units only.","citation":"BOA MS syllabus §1.2.2.4"},{"id":"ms-008","subject":"MS","topic":"Multi-product CVP","difficulty":"Difficult","question":"A Davao roaster sells drip packs at ₱120 with ₱72 variable cost and cold brew at ₱180 with ₱105 variable cost. It expects 3 drip packs per 2 cold brews. Monthly fixed expense is ₱294,000.\\n\\nA promotion changes the mix to 1 drip pack for each cold brew without changing costs. What is the new minimum whole-bundle break-even peso sales level?","choices":["₱717,300","₱720,000","₱717,000","₱723,000"],"correctIndex":0,"solutionSteps":["Step 1: Each two-unit bundle contributes ₱123 and sells for ₱300.","Step 2: ₱294,000 ÷ ₱123 = 2,390.24, round up to 2,391. Multiply by ₱300."],"boardTrap":"The old mix gives ₱720,000. Rounding down gives ₱717,000, while rounding the new unit margin to ₱61 gives ₱723,000.","citation":"BOA MS syllabus §1.2.2.6 and .8"},{"id":"ms-009","subject":"MS","topic":"Multi-product CVP","difficulty":"Moderate","question":"A school supply retailer has ₱870,000 actual sales and ₱725,000 break-even sales. What is the margin of safety as a percentage of actual sales?","choices":["16.67%","20.00%","83.33%","14.50%"],"correctIndex":0,"solutionSteps":["Step 1: Find the peso cushion of ₱145,000.","Step 2: Divide by actual sales of ₱870,000 = 16.67%."],"boardTrap":"Dividing the cushion by break-even sales produces 20%, using the wrong denominator.","citation":"BOA MS syllabus §1.2.2.7"},{"id":"ms-010","subject":"MS","topic":"Multi-product CVP","difficulty":"Moderate","question":"A kiosk charges ₱90 per item, incurs ₱52 variable unit cost and ₱171,000 fixed cost. A supplier raises unit cost to ₱60. How many more units are needed to break even?","choices":["5,700 units","900 units","4,500 units","1,200 units"],"correctIndex":3,"solutionSteps":["Step 1: Old break-even = ₱171,000 ÷ ₱38 = 4,500.","Step 2: New break-even = ₱171,000 ÷ ₱30 = 5,700, up 1,200."],"boardTrap":"5,700 is the new total, while the question asks for the increase.","citation":"BOA MS syllabus §1.2.2.5"},{"id":"ms-011","subject":"MS","topic":"Multi-product CVP","difficulty":"Moderate","question":"A branch reports contribution of ₱360,000 and operating income of ₱90,000. At its current activity, estimate the income increase for 8% greater sales at stable mix and costs.","choices":["8%","24%","32%","2%"],"correctIndex":2,"solutionSteps":["Step 1: Operating leverage at this activity is ₱360,000 ÷ ₱90,000 = 4.","Step 2: Apply 4 × 8% = 32%."],"boardTrap":"Income sensitivity differs from sales growth because fixed expenses do not change.","citation":"BOA MS syllabus §1.2.2.7"},{"id":"ms-012","subject":"MS","topic":"Multi-product CVP","difficulty":"Difficult","question":"Plan A has ₱132,000 fixed cost and ₱34 unit contribution. Plan B has ₱198,000 fixed cost and ₱45 contribution. At which volume do operating profits match, and which plan wins above it?","choices":["6,000 units, Plan A","6,000 units, Plan B","4,400 units, Plan B","9,000 units, Plan A"],"correctIndex":1,"solutionSteps":["Step 1: Set incremental fixed cost of ₱66,000 equal to ₱11 incremental contribution per unit.","Step 2: Solve 6,000 units. B’s greater unit contribution wins above the crossover."],"boardTrap":"Individual break-even volumes are not the indifference point.","citation":"BOA MS syllabus §1.2.2.8"},{"id":"ms-013","subject":"MS","topic":"Multi-product CVP","difficulty":"Difficult","question":"A packaging line contributes ₱60 per unit. Fixed costs are ₱420,000 up to 8,000 units and ₱540,000 above 8,000. What minimum units achieve ₱90,000 operating profit?","choices":["8,500","10,500","9,000","8,000"],"correctIndex":1,"solutionSteps":["Step 1: The low tier gives a trial volume of 8,500, which exceeds its range.","Step 2: Use the high tier: (₱540,000 + ₱90,000) ÷ ₱60 = 10,500 units."],"boardTrap":"The first computed number is invalid outside the tier that generated it.","citation":"BOA MS syllabus §1.2.2.4 and .8"},{"id":"ms-014","subject":"MS","topic":"Multi-product CVP","difficulty":"Difficult","question":"A cafe’s breakfast line contributes 45% and drinks 65%. Expected sales-peso mix is 60% breakfast and 40% drinks. Fixed cost is ₱477,000. What revenue reaches ₱79,500 target profit?","choices":["₱1,050,000","₱1,011,818.18","₱900,000","₱1,090,196.08"],"correctIndex":0,"solutionSteps":["Step 1: Weight by sales pesos: 60% × 45% + 40% × 65% = 53%.","Step 2: Required revenue is (₱477,000 + ₱79,500) ÷ 53% = ₱1,050,000."],"boardTrap":"An unweighted 55% margin ignores the sales mix. ₱900,000 covers break-even only.","citation":"BOA MS syllabus §1.2.2.4 and .6"},{"id":"ms-015","subject":"MS","topic":"Relevant Costing & Constraints","difficulty":"Easy","question":"Which cost belongs in the current decision on whether to keep a machine already purchased?","choices":["Its original cost","Book depreciation on the existing machine","Last year’s repairs","Net proceeds sacrificed by retaining it instead of selling now"],"correctIndex":3,"solutionSteps":["Step 1: Identify cash flows that differ between options.","Step 2: The foregone sale proceeds are an opportunity cost."],"boardTrap":"Book values and prior expenses can dominate the ledger while remaining sunk.","citation":"BOA MS syllabus §1.4.1.1–.2"},{"id":"ms-016","subject":"MS","topic":"Relevant Costing & Constraints","difficulty":"Easy","question":"With one bottleneck and divisible production, what metric ranks products for maximum short-run contribution?","choices":["Contribution per finished unit","Selling price per unit of bottleneck resource","Contribution margin per unit of bottleneck resource","Absorption margin per finished unit"],"correctIndex":2,"solutionSteps":["Step 1: Compute contribution after variable costs.","Step 2: Divide by use of the scarce resource."],"boardTrap":"A high unit margin may consume disproportionately more bottleneck time.","citation":"BOA MS syllabus §1.4.1.4"},{"id":"ms-017","subject":"MS","topic":"Relevant Costing & Constraints","difficulty":"Easy","question":"Which item matters when considering further processing of a joint product at split-off?","choices":["An allocated share of joint cost already incurred","Prior research on the joint process","Further processing cost","Prior-year depreciation without future alternatives"],"correctIndex":2,"solutionSteps":["Step 1: Compare cash flows available from split-off onward.","Step 2: Further processing cost changes with the decision."],"boardTrap":"Allocated historical joint cost is common to both paths.","citation":"BOA MS syllabus §1.4.1.4"},{"id":"ms-018","subject":"MS","topic":"Relevant Costing & Constraints","difficulty":"Easy","question":"When dropping a segment, what is the relevant amount of committed common rent that will continue at the same total?","choices":["The allocation shown on that segment’s report","Zero","The full company lease expense","The portion paid already this year"],"correctIndex":1,"solutionSteps":["Step 1: Ask whether total rent changes after exit.","Step 2: If unchanged, it does not affect differential profit."],"boardTrap":"Reallocating rent to another segment does not make any company rent avoidable.","citation":"BOA MS syllabus §1.4.1.4"},{"id":"ms-019","subject":"MS","topic":"Relevant Costing & Constraints","difficulty":"Moderate","question":"A plant needs 7,500 housings. Make costs per unit are ₱44 variable and ₱16 allocated fixed, of which ₱5 is avoidable. An outside quote is ₱53. Idle capacity has no alternative use. Which is cheaper?","choices":["Make by ₱30,000","Buy by ₱52,500","Make by ₱67,500","Buy by ₱30,000"],"correctIndex":0,"solutionSteps":["Step 1: Relevant make cost = ₱44 + ₱5 = ₱49.","Step 2: Make saves (₱53 − ₱49) × 7,500 = ₱30,000."],"boardTrap":"Using all ₱16 of allocated fixed cost makes buying appear cheaper by ₱52,500.","citation":"BOA MS syllabus §1.4.1.4"},{"id":"ms-020","subject":"MS","topic":"Relevant Costing & Constraints","difficulty":"Moderate","question":"A special order uses spare capacity. It offers ₱92 for 2,000 units. Variable cost is ₱71 per unit plus a one-time ₱15,000 setup. What is the contribution to operating profit?","choices":["₱42,000","₱169,000","₱57,000","₱27,000"],"correctIndex":3,"solutionSteps":["Step 1: Compute ₱21 × 2,000 = ₱42,000 of unit contribution.","Step 2: Subtract the incremental setup for ₱27,000."],"boardTrap":"The setup is relevant even though it is fixed in relation to the size of this order.","citation":"BOA MS syllabus §1.4.1.4"},{"id":"ms-021","subject":"MS","topic":"Relevant Costing & Constraints","difficulty":"Moderate","question":"Copra sells for ₱540,000 at split-off or ₱690,000 after further treatment costing ₱162,000. Dropping joint-cost allocations changes neither option. Which choice is better?","choices":["Process further by ₱150,000","Process further by ₱12,000","Indifferent because joint costs are common","Sell at split-off by ₱12,000"],"correctIndex":3,"solutionSteps":["Step 1: Compute additional sales of ₱150,000 and compare with ₱162,000 incremental process cost.","Step 2: Stopping at split-off saves the ₱12,000 shortfall."],"boardTrap":"Gross additional revenue is not additional profit.","citation":"BOA MS syllabus §1.4.1.4"},{"id":"ms-022","subject":"MS","topic":"Relevant Costing & Constraints","difficulty":"Moderate","question":"Product X contributes ₱220 in 4 machine hours. Product Y contributes ₱168 in 2.5 hours. Demand is unsatisfied for both. Which should be prioritized?","choices":["X, at ₱220 per machine hour","X, at ₱55 per machine hour","Y, at ₱67.20 per machine hour","Tie because both contribute positively"],"correctIndex":2,"solutionSteps":["Step 1: Translate unit contribution into the constrained resource: X ₱55, Y ₱67.20.","Step 2: Y earns more for the same scarce hour."],"boardTrap":"Ordering products by unit contribution would reverse the priority.","citation":"BOA MS syllabus §1.4.1.4"},{"id":"ms-023","subject":"MS","topic":"Relevant Costing & Constraints","difficulty":"Moderate","question":"A food stall segment supplies ₱440,000 contribution and has ₱370,000 avoidable fixed expense plus ₱120,000 unavoidable allocations. What is the effect of closure on company operating income?","choices":["Increase ₱50,000","Decrease ₱70,000","Increase ₱70,000","Decrease ₱190,000"],"correctIndex":1,"solutionSteps":["Step 1: Closure loses ₱440,000 contribution and saves ₱370,000.","Step 2: The net decrease is ₱70,000."],"boardTrap":"The allocated report shows a loss, but those unavoidable charges stay after closure.","citation":"BOA MS syllabus §1.4.1.4"},{"id":"ms-024","subject":"MS","topic":"Relevant Costing & Constraints","difficulty":"Moderate","question":"A machine costing ₱720,000 years ago can be sold now for ₱180,000 or used internally with ₱25,000 incremental maintenance. No taxes. What is the relevant cost of internal use?","choices":["₱205,000","₱745,000","₱25,000","₱180,000"],"correctIndex":0,"solutionSteps":["Step 1: Retention sacrifices ₱180,000 in realizable cash.","Step 2: Add the ₱25,000 incremental outlay, totaling ₱205,000."],"boardTrap":"Ignoring opportunity cost treats a valuable alternative as if it were unavailable.","citation":"BOA MS syllabus §1.4.1.2 and .4"},{"id":"ms-025","subject":"MS","topic":"Relevant Costing & Constraints","difficulty":"Difficult","question":"A supplier quotes ₱62 each for 4,000 gears. Making costs ₱51 variable per unit and ₱12,000 avoidable setup. Released capacity would yield ₱44,000 contribution after all additional costs. What is the net advantage of buying?","choices":["₱12,000","₱32,000 disadvantage","₱44,000 advantage","₱56,000 advantage"],"correctIndex":0,"solutionSteps":["Step 1: Cost to make plus opportunity cost = ₱204,000 + ₱12,000 + ₱44,000 = ₱260,000.","Step 2: Buy costs ₱248,000, a ₱12,000 advantage."],"boardTrap":"Omitting released capacity wrongly favors making by ₱32,000.","citation":"BOA MS syllabus §1.4.1.4"},{"id":"ms-026","subject":"MS","topic":"Relevant Costing & Constraints","difficulty":"Difficult","question":"A fully booked press can accept 800 special units at ₱156 each, with ₱100 variable cost and ₱9,000 order-specific costs. The order displaces 600 regular units contributing ₱68 each. What is its profit effect?","choices":["₱35,800 increase","₱4,000 increase","₱40,800 decrease","₱5,000 decrease"],"correctIndex":3,"solutionSteps":["Step 1: Special-order contribution after setup = ₱44,800 − ₱9,000 = ₱35,800.","Step 2: Subtract ₱40,800 lost regular contribution. Net decrease ₱5,000."],"boardTrap":"Capacity displacement must be priced in using foregone contribution, even without an additional cash invoice.","citation":"BOA MS syllabus §1.4.1.4"},{"id":"ms-027","subject":"MS","topic":"Relevant Costing & Constraints","difficulty":"Difficult","question":"There are 600 hours. A contributes ₱260 in 4 hours and B ₱150 in 2 hours. Demand caps are 100 A and 120 B. If units must be whole, what maximum contribution is attainable?","choices":["₱41,000","₱45,000","₱41,400","₱44,000"],"correctIndex":2,"solutionSteps":["Step 1: B earns ₱75 per hour and A ₱65. Make the most profitable 120 B using 240 hours.","Step 2: Use 360 hours for 90 A. Total contribution ₱18,000 + ₱23,400 = ₱41,400."],"boardTrap":"A-first leaves only 100 B. An all-B plan disregards the cap.","citation":"BOA MS syllabus §1.4.1.4"},{"id":"ms-028","subject":"MS","topic":"Relevant Costing & Constraints","difficulty":"Difficult","question":"Closing a store loses ₱520,000 of contribution, saves ₱350,000 controllable costs, incurs ₱45,000 contractual exit expense, and frees space rentable for ₱230,000 net. Which is preferable on the stated one-year horizon?","choices":["Keep by ₱170,000","Close by ₱15,000","Close by ₱60,000","Keep by ₱15,000"],"correctIndex":1,"solutionSteps":["Step 1: Benefits of closure are ₱350,000 + ₱230,000 = ₱580,000.","Step 2: Costs are ₱520,000 + ₱45,000 = ₱565,000. Net benefit ₱15,000."],"boardTrap":"The exit expense is incremental even though unavoidable expenses assigned to the segment are not.","citation":"BOA MS syllabus §1.4.1.4"},{"id":"ms-029","subject":"MS","topic":"Standard Costing & Variances","difficulty":"Easy","question":"When a material price variance is recognized at purchase, which quantity multiplies actual less standard price?","choices":["Standard quantity allowed for output","Actual quantity purchased","Actual quantity used in all cases","Budgeted production units"],"correctIndex":1,"solutionSteps":["Step 1: Identify the point of variance recognition.","Step 2: At purchase, use the quantity acquired."],"boardTrap":"Usage belongs to the subsequent quantity analysis.","citation":"BOA MS syllabus §1.2.3.2"},{"id":"ms-030","subject":"MS","topic":"Standard Costing & Variances","difficulty":"Easy","question":"Which rate is applied to the actual-versus-standard hours difference for labor efficiency?","choices":["Standard wage rate","Actual wage rate","Sales price per labor hour","Budgeted overhead rate"],"correctIndex":0,"solutionSteps":["Step 1: Hold wage at the standard to isolate hours efficiency.","Step 2: Apply it to actual hours minus standard hours allowed."],"boardTrap":"Using actual wage blends rate and efficiency effects.","citation":"BOA MS syllabus §1.2.3.3"},{"id":"ms-031","subject":"MS","topic":"Standard Costing & Variances","difficulty":"Easy","question":"What does fixed overhead production-volume variance compare?","choices":["Actual overhead with budgeted overhead only","Actual fixed cost with flexible variable cost","Applied labor with actual labor","Budgeted fixed overhead with applied fixed overhead"],"correctIndex":3,"solutionSteps":["Step 1: Compare budgeted capacity allocation with the amount applied to actual output.","Step 2: That difference captures under- or over-absorption due to volume."],"boardTrap":"Actual-versus-budgeted fixed overhead gives spending variance.","citation":"BOA MS syllabus §1.2.3.4"},{"id":"ms-032","subject":"MS","topic":"Standard Costing & Variances","difficulty":"Easy","question":"Why might a favorable materials price variance coincide with unfavorable materials usage?","choices":["The two variances are required by formula to offset.","Actual output must have declined in all cases.","Cheaper lower-grade inputs can require more material per unit.","Fixed overhead was applied at normal capacity."],"correctIndex":2,"solutionSteps":["Step 1: Purchasing can obtain a lower unit price while production loses yield.","Step 2: Investigate total impact and quality."],"boardTrap":"Favorable purchase price alone cannot establish overall savings.","citation":"BOA MS syllabus §1.2.3.2"},{"id":"ms-033","subject":"MS","topic":"Standard Costing & Variances","difficulty":"Moderate","question":"A plant purchases 7,200 kg for ₱46 each against a ₱49 standard. It uses 6,400 kg. What material price variance is recognized at purchase?","choices":["₱19,200 favorable","₱21,600 unfavorable","₱21,600 favorable","₱352,800 favorable"],"correctIndex":2,"solutionSteps":["Step 1: Actual price is ₱3 below standard.","Step 2: Use 7,200 kg purchased: ₱21,600 favorable."],"boardTrap":"Using 6,400 kg confuses purchases with consumption.","citation":"BOA MS syllabus §1.2.3.2"},{"id":"ms-034","subject":"MS","topic":"Standard Costing & Variances","difficulty":"Moderate","question":"A mill makes 1,800 units with a standard 3.5 kg each at ₱36. It uses 6,520 kg purchased at ₱34. Compute the material usage variance.","choices":["₱7,480 unfavorable","₱7,920 unfavorable","₱7,920 favorable","₱13,040 favorable"],"correctIndex":1,"solutionSteps":["Step 1: Standard allowed = 1,800 × 3.5 = 6,300 kg.","Step 2: Excess 220 kg × ₱36 standard price = ₱7,920 unfavorable."],"boardTrap":"Do not price the excess at the actual purchase rate.","citation":"BOA MS syllabus §1.2.3.2"},{"id":"ms-035","subject":"MS","topic":"Standard Costing & Variances","difficulty":"Moderate","question":"Actual labor is 940 hours at ₱162 per hour. The standard wage is ₱150 and 1,000 hours were allowed. What is the rate variance?","choices":["₱11,280 unfavorable","₱12,000 unfavorable","₱9,000 favorable","₱11,280 favorable"],"correctIndex":0,"solutionSteps":["Step 1: Compare wage rates on 940 actual hours.","Step 2: ₱12 × 940 = ₱11,280 unfavorable."],"boardTrap":"Using allowed hours in the rate variance confuses it with efficiency.","citation":"BOA MS syllabus §1.2.3.3"},{"id":"ms-036","subject":"MS","topic":"Standard Costing & Variances","difficulty":"Moderate","question":"A shop’s 480 units allow 2.5 labor hours each at ₱180. Actual labor is 1,165 hours at ₱190. Compute labor efficiency variance.","choices":["₱6,650 favorable","₱11,650 unfavorable","₱6,300 unfavorable","₱6,300 favorable"],"correctIndex":3,"solutionSteps":["Step 1: Allowed hours = 1,200. Hours saved = 35.","Step 2: Price at ₱180 standard rate for ₱6,300 favorable."],"boardTrap":"The higher actual wage belongs in the rate variance, not the efficiency variance.","citation":"BOA MS syllabus §1.2.3.3"},{"id":"ms-037","subject":"MS","topic":"Standard Costing & Variances","difficulty":"Moderate","question":"Variable overhead is budgeted at ₱28 per actual machine hour. At 3,400 actual hours the company incurs ₱101,000. Standard hours allowed are 3,200. Compute variable overhead spending variance.","choices":["₱11,400 unfavorable","₱5,600 unfavorable","₱5,800 favorable","₱5,800 unfavorable"],"correctIndex":3,"solutionSteps":["Step 1: Flexible overhead at actual hours = ₱95,200.","Step 2: Actual less flexible amount = ₱101,000 − ₱95,200 = ₱5,800 unfavorable."],"boardTrap":"Using the allowed 3,200 hours mixes spending and efficiency.","citation":"BOA MS syllabus §1.2.3.4"},{"id":"ms-038","subject":"MS","topic":"Standard Costing & Variances","difficulty":"Moderate","question":"Fixed overhead budget is ₱840,000 at 12,000 hours. Applied hours are 11,400 and actual fixed overhead is ₱823,000. Compute the fixed production-volume variance.","choices":["₱17,000 favorable","₱25,000 unfavorable","₱42,000 unfavorable","₱42,000 favorable"],"correctIndex":2,"solutionSteps":["Step 1: The rate is ₱70 per hour and applied fixed overhead is ₱798,000.","Step 2: Budget less applied is ₱42,000 unfavorable."],"boardTrap":"Actual-versus-budgeted is spending, not volume.","citation":"BOA MS syllabus §1.2.3.4"},{"id":"ms-039","subject":"MS","topic":"Standard Costing & Variances","difficulty":"Difficult","question":"A batch standard mix is 60% A at ₱50/kg and 40% B at ₱25/kg. Actual inputs total 1,200 kg, made up of 840 kg A and 360 kg B. What is the materials mix variance?","choices":["₱6,000 unfavorable","₱3,000 unfavorable","₱3,000 favorable","₱9,000 unfavorable"],"correctIndex":1,"solutionSteps":["Step 1: At actual total, standard mix is 720 kg A and 480 kg B.","Step 2: The 120 kg shift from ₱25 B to ₱50 A costs ₱3,000."],"boardTrap":"Hold total kilograms constant. The cost increase is the price spread, not A’s whole price.","citation":"BOA MS syllabus §1.2.3.2"},{"id":"ms-040","subject":"MS","topic":"Standard Costing & Variances","difficulty":"Difficult","question":"A standard blend uses 500 kg A at ₱40 and 500 kg B at ₱20 per 900 kg finished. Actual input is 1,120 kg in the standard mix and actual yield is 990 kg. What is the total materials yield variance at standard cost?","choices":["₱600 unfavorable","₱3,600 unfavorable","₱600 favorable","₱0 because mix is standard"],"correctIndex":0,"solutionSteps":["Step 1: At standard yield, 990 kg finished allows 1,100 kg of input.","Step 2: The 20 kg excess at ₱30 weighted standard cost is ₱600 unfavorable."],"boardTrap":"A standard mix eliminates mix variance, not waste from total yield.","citation":"BOA MS syllabus §1.2.3.2"},{"id":"ms-041","subject":"MS","topic":"Standard Costing & Variances","difficulty":"Difficult","question":"Allowed labor is 720 hours at ₱200. Actual wages total ₱151,050 for 795 hours. Which decomposition agrees with the total labor variance?","choices":["₱7,950 favorable rate and ₱15,000 unfavorable efficiency","₱7,200 favorable rate and ₱14,250 unfavorable efficiency","₱7,950 unfavorable rate and ₱15,000 favorable efficiency","₱7,050 unfavorable rate and zero efficiency"],"correctIndex":0,"solutionSteps":["Step 1: Actual rate is ₱190. Rate variance is 795 × (₱190 − ₱200) = ₱7,950 favorable.","Step 2: Excess 75 hours × ₱200 = ₱15,000 unfavorable, net ₱7,050 unfavorable."],"boardTrap":"Working backward from the net using standard hours for rate can reconcile algebraically but misclassify the effects.","citation":"BOA MS syllabus §1.2.3.3"},{"id":"ms-042","subject":"MS","topic":"Standard Costing & Variances","difficulty":"Difficult","question":"Budgeted fixed overhead is ₱480,000 over 8,000 standard hours. Actual fixed overhead is ₱498,000 and allowed hours are 7,700. What is total underapplied fixed overhead and its components?","choices":["₱18,000 underapplied, all spending","₱36,000 overapplied, both favorable","₱18,000 underapplied, all volume","₱36,000 underapplied, ₱18,000 unfavorable spending and ₱18,000 unfavorable volume"],"correctIndex":3,"solutionSteps":["Step 1: At ₱60 per hour, applied overhead is ₱462,000.","Step 2: Actual exceeds applied by ₱36,000. Actual exceeds budget by ₱18,000, and budget exceeds applied by ₱18,000."],"boardTrap":"Using just the difference between actual and budget ignores capacity under-absorption.","citation":"BOA MS syllabus §1.2.3.4"},{"id":"ms-043","subject":"MS","topic":"Capital Budgeting","difficulty":"Easy","question":"What is the IRR of a conventional independent project?","choices":["Accounting rate that sets depreciation to zero","Required rate chosen externally for all projects","Discount rate that sets NPV to zero","Rate yielding the earliest payback"],"correctIndex":2,"solutionSteps":["Step 1: Set present values of inflows and outflows equal.","Step 2: Solve for the internal discount rate."],"boardTrap":"The hurdle rate is an input for comparison, while IRR is derived from project cash flows.","citation":"BOA MS syllabus §2.2.3.3"},{"id":"ms-044","subject":"MS","topic":"Capital Budgeting","difficulty":"Easy","question":"Why does deductible depreciation usually affect an after-tax cash-flow estimate?","choices":["Depreciation creates a cash receipt equal to the full expense.","It reduces tax by the depreciation deduction times the tax rate.","It increases cash taxes by the asset’s book value.","It always increases capital cost."],"correctIndex":1,"solutionSteps":["Step 1: Account for the deduction’s effect on taxable income.","Step 2: Include the resulting tax shield, assuming it is usable."],"boardTrap":"Depreciation itself is noncash. Its tax consequence can affect cash.","citation":"BOA MS syllabus §2.2.3.5"},{"id":"ms-045","subject":"MS","topic":"Capital Budgeting","difficulty":"Easy","question":"Which cash flows can simple payback omit from a project decision?","choices":["Initial investment","Cash flows after the payback point","All cash flows before payback","Only taxes on the initial outlay"],"correctIndex":1,"solutionSteps":["Step 1: Count cumulative cash until the original outlay is recovered.","Step 2: Later cash flows do not alter simple payback."],"boardTrap":"Rapid payback can miss a significant terminal value or obligation.","citation":"BOA MS syllabus §2.2.3.2–.3"},{"id":"ms-046","subject":"MS","topic":"Capital Budgeting","difficulty":"Easy","question":"For two mutually exclusive projects with equal risk, comparable horizons, and unequal scale, what rule maximizes peso value?","choices":["Choose the greater positive NPV.","Choose the highest IRR in all cases.","Choose the smallest initial outlay.","Choose the shortest simple payback in all cases."],"correctIndex":0,"solutionSteps":["Step 1: Discount cash flows at the required rate.","Step 2: Select the project with greater incremental peso value."],"boardTrap":"IRR reports a percentage and can misrank mutually exclusive projects of different scale.","citation":"BOA MS syllabus §2.2.3.3–.4"},{"id":"ms-047","subject":"MS","topic":"Capital Budgeting","difficulty":"Moderate","question":"A ₱480,000 machine yields ₱180,000 each year for four years. The annuity factor at the hurdle rate is 3.170. Compute NPV, ignoring other flows.","choices":["₱240,000","₱570,600","₱56,000","₱90,600"],"correctIndex":3,"solutionSteps":["Step 1: Present value = ₱180,000 × 3.170 = ₱570,600.","Step 2: Deduct the initial ₱480,000 for NPV of ₱90,600."],"boardTrap":"Undiscounted surplus is not NPV. The PV of benefits alone omits the outlay.","citation":"BOA MS syllabus §2.2.3.3"},{"id":"ms-048","subject":"MS","topic":"Capital Budgeting","difficulty":"Moderate","question":"An investment saves ₱300,000 annual cash expenses before tax and has ₱120,000 deductible annual depreciation. Tax is 25%. What after-tax operating cash flow arises?","choices":["₱225,000","₱135,000","₱255,000","₱330,000"],"correctIndex":2,"solutionSteps":["Step 1: After-tax cash savings are ₱300,000 × 75% = ₱225,000.","Step 2: Add depreciation shield of ₱120,000 × 25% = ₱30,000."],"boardTrap":"Deduct depreciation to measure taxable income, then exclude it from cash expense.","citation":"BOA MS syllabus §2.2.3.5"},{"id":"ms-049","subject":"MS","topic":"Capital Budgeting","difficulty":"Moderate","question":"An investment costs ₱400,000 now and returns ₱484,000 at the end of year 2, with no interim receipts. Find its annual IRR.","choices":["21%","10.5%","10%","8.68%"],"correctIndex":2,"solutionSteps":["Step 1: The two-year growth factor is ₱484,000 ÷ ₱400,000 = 1.21.","Step 2: Take its square root to obtain 1.10, or 10% annually."],"boardTrap":"Dividing the total gain by two ignores compounding.","citation":"BOA MS syllabus §2.2.3.3"},{"id":"ms-050","subject":"MS","topic":"Capital Budgeting","difficulty":"Moderate","question":"A machine is sold for ₱240,000 when its tax carrying amount is ₱160,000. The taxable gain is taxed at 25%. What terminal cash proceeds are usable?","choices":["₱180,000","₱220,000","₱240,000","₱80,000"],"correctIndex":1,"solutionSteps":["Step 1: Taxable gain is ₱80,000, producing ₱20,000 tax.","Step 2: Net cash is ₱240,000 − ₱20,000 = ₱220,000."],"boardTrap":"Tax applies to the taxable gain, not gross sale proceeds.","citation":"BOA MS syllabus §2.2.3.5"},{"id":"ms-051","subject":"MS","topic":"Capital Budgeting","difficulty":"Moderate","question":"A ₱460,000 outlay returns ₱170,000 at each year-end. Assume cash accrues uniformly during each year only for payback. What is the approximate simple payback?","choices":["2.71 years","3.00 years","2.00 years","0.71 years"],"correctIndex":0,"solutionSteps":["Step 1: After two years ₱340,000 is recovered, leaving ₱120,000.","Step 2: Add ₱120,000 ÷ ₱170,000 = 0.71 year."],"boardTrap":"Use the stated interpolation convention. Rounding to whole years discards the available timing information.","citation":"BOA MS syllabus §2.2.3.2–.3"},{"id":"ms-052","subject":"MS","topic":"Capital Budgeting","difficulty":"Moderate","question":"A three-year project ties up ₱150,000 working capital today and releases it completely at the end. If the discount factor at year 3 is .751 and no tax applies, what is its net PV effect?","choices":["₱0","₱112,650 inflow","₱150,000 outflow","₱37,350 outflow"],"correctIndex":3,"solutionSteps":["Step 1: The recovery PV is ₱150,000 × .751 = ₱112,650.","Step 2: Subtract the initial tie-up, leaving a ₱37,350 net outflow."],"boardTrap":"Equal nominal amounts have different present values.","citation":"BOA MS syllabus §2.2.3.3"},{"id":"ms-053","subject":"MS","topic":"Capital Budgeting","difficulty":"Difficult","question":"A three-year machine costs ₱900,000 plus ₱80,000 working capital, saves ₱410,000 pre-tax annually, and depreciates ₱300,000 annually for tax. Tax is 25%. Working capital is recovered at year 3, with no salvage. Use annuity factor 2.487 and year-3 factor .751. What is NPV?","choices":["−₱28,722.50","−₱155,167.50","₱111,357.50","₱31,357.50"],"correctIndex":3,"solutionSteps":["Step 1: After-tax annual cash = ₱410,000 × 75% + ₱300,000 × 25% = ₱382,500, PV ₱951,277.50.","Step 2: Add recovery PV ₱60,080, deduct ₱980,000, yielding ₱31,357.50."],"boardTrap":"Treating working capital as an eventual recovery only overstates NPV by the initial commitment.","citation":"BOA MS syllabus §2.2.3.3 and .5"},{"id":"ms-054","subject":"MS","topic":"Capital Budgeting","difficulty":"Difficult","question":"A one-year replacement costs ₱560,000. Sell the old asset today for ₱110,000, tax basis ₱90,000. The replacement adds ₱510,000 operating cash after tax and ₱40,000 after-tax terminal sale proceeds next year. At 25% tax on the old sale and a 10% hurdle, what is NPV?","choices":["₱50,000","−₱60,000","₱45,000","₱0"],"correctIndex":2,"solutionSteps":["Step 1: Old sale nets ₱105,000 after ₱5,000 tax. Initial net outlay is ₱455,000.","Step 2: PV of ₱550,000 next year is ₱500,000. NPV ₱45,000."],"boardTrap":"Net the after-tax proceeds of disposing the displaced asset. Gross proceeds give ₱50,000.","citation":"BOA MS syllabus §2.2.3.3 and .5"},{"id":"ms-055","subject":"MS","topic":"Capital Budgeting","difficulty":"Difficult","question":"At a common 10% cost of capital, small Project S has ₱90,000 NPV and 29% IRR, while mutually exclusive Project L has ₱154,000 NPV and 21% IRR. Equal project lives and no capital constraint. Which recommendation is justified?","choices":["Choose S because its IRR is 8 percentage points higher.","Choose L, adding ₱64,000 more present value.","Choose both because both exceed the hurdle.","Reject L because its IRR is below S’s."],"correctIndex":1,"solutionSteps":["Step 1: Compare directly at the cost of capital for mutually exclusive alternatives.","Step 2: ₱154,000 − ₱90,000 = ₱64,000 more value from L."],"boardTrap":"Percentage return alone can favor the smaller base.","citation":"BOA MS syllabus §2.2.3.3–.4"},{"id":"ms-056","subject":"MS","topic":"Capital Budgeting","difficulty":"Difficult","question":"Limited funds are ₱1 million. Indivisible independent projects cost A ₱650,000, B ₱500,000 and C ₱500,000. NPVs are respectively ₱195,000, ₱140,000, and ₱135,000. Pick the optimal feasible portfolio.","choices":["B and C, ₱275,000 NPV","A alone, ₱195,000 NPV","A and B, ₱335,000 NPV","C alone, ₱135,000 NPV"],"correctIndex":0,"solutionSteps":["Step 1: Compare feasible combinations rather than first ranking by profitability index.","Step 2: B and C fit exactly and have greater total NPV than A alone."],"boardTrap":"A has the highest NPV per peso but leaves too little budget for another indivisible project.","citation":"BOA MS syllabus §2.2.3.3"},{"id":"ms-057","subject":"MS","topic":"Working Capital Management","difficulty":"Easy","question":"Which components form the cash conversion cycle?","choices":["Inventory days plus receivable days less payable days","Inventory days less receivable days plus payable days","Receivable days plus payable days","Inventory days plus receivable days plus payable days"],"correctIndex":0,"solutionSteps":["Step 1: Add time to hold inventory and collect from customers.","Step 2: Subtract the supplier financing period."],"boardTrap":"Payable days delay cash outflow, shortening the cycle.","citation":"BOA MS syllabus §2.2.5"},{"id":"ms-058","subject":"MS","topic":"Working Capital Management","difficulty":"Easy","question":"What trade-off does basic EOQ optimize at a constant unit price and without shortages?","choices":["Direct labor and variable overhead","Bad-debt expense and sales commissions","Ordering cost and purchase discounts in every instance","Annual ordering cost and annual holding cost"],"correctIndex":3,"solutionSteps":["Step 1: Larger orders reduce order frequency and increase average inventory.","Step 2: EOQ balances the two opposing costs."],"boardTrap":"Constant acquisition cost does not change across order quantities.","citation":"BOA MS syllabus §2.2.5"},{"id":"ms-059","subject":"MS","topic":"Working Capital Management","difficulty":"Easy","question":"Which ratio tests coverage of current liabilities using liquid assets, excluding inventory?","choices":["Current ratio","Debt-to-equity ratio","Quick ratio","Inventory turnover"],"correctIndex":2,"solutionSteps":["Step 1: Use cash, qualifying near-cash assets, and receivables against current liabilities.","Step 2: Exclude inventory from the numerator."],"boardTrap":"The current ratio includes inventory and is less restrictive.","citation":"BOA MS syllabus §2.2.1.5"},{"id":"ms-060","subject":"MS","topic":"Working Capital Management","difficulty":"Easy","question":"What generally increases the effective cost of forgoing a trade discount, all else equal?","choices":["A smaller discount percentage","A shorter interval between the discount and net due dates","A longer interval between discount and net dates","A smaller order quantity alone"],"correctIndex":1,"solutionSteps":["Step 1: Measure the extra financing interval.","Step 2: The same discount forfeited for fewer days implies a higher annualized cost."],"boardTrap":"Use the interval between the two dates, not the entire net period.","citation":"BOA MS syllabus §2.2.5"},{"id":"ms-061","subject":"MS","topic":"Working Capital Management","difficulty":"Easy","question":"Which inventory quantity directly protects against variability during lead time?","choices":["Economic order quantity","Safety stock","Average cycle inventory","Maximum forecast demand for the whole year"],"correctIndex":1,"solutionSteps":["Step 1: Identify the buffer held on top of expected lead-time demand.","Step 2: Safety stock absorbs uncertainty."],"boardTrap":"EOQ controls replenishment size, not protection against variability by itself.","citation":"BOA MS syllabus §2.2.5"},{"id":"ms-062","subject":"MS","topic":"Working Capital Management","difficulty":"Moderate","question":"Inventory stays 54 days, receivables collect in 38 days, and payables settle in 31 days. What cash conversion period results?","choices":["61 days","92 days","123 days","47 days"],"correctIndex":0,"solutionSteps":["Step 1: Operating cycle = 54 + 38 = 92 days.","Step 2: Subtract 31 days of supplier financing = 61."],"boardTrap":"92 days omits the payment lag.","citation":"BOA MS syllabus §2.2.5"},{"id":"ms-063","subject":"MS","topic":"Working Capital Management","difficulty":"Moderate","question":"Annual demand is 18,000 units, each order costs ₱150, and annual holding is ₱15 per unit. Compute EOQ.","choices":["1,200 units","424 units","300 units","600 units"],"correctIndex":3,"solutionSteps":["Step 1: Compute 2 × 18,000 × ₱150 ÷ ₱15 = 360,000.","Step 2: The square root gives 600 units."],"boardTrap":"Using the ratio without both the factor of two and square root produces a different quantity.","citation":"BOA MS syllabus §2.2.5"},{"id":"ms-064","subject":"MS","topic":"Working Capital Management","difficulty":"Moderate","question":"Cash is ₱230,000, short-term traded securities ₱100,000, net trade AR ₱410,000, inventories ₱360,000, and current liabilities ₱500,000. What is quick ratio?","choices":["2.20","1.28","1.48","0.66"],"correctIndex":2,"solutionSteps":["Step 1: Quick assets = ₱230,000 + ₱100,000 + ₱410,000 = ₱740,000.","Step 2: Divide by ₱500,000 = 1.48."],"boardTrap":"Including inventory yields the current ratio of 2.20 instead.","citation":"BOA MS syllabus §2.2.1.5"},{"id":"ms-065","subject":"MS","topic":"Working Capital Management","difficulty":"Moderate","question":"Daily expected demand is 85 units. Lead time is 9 days and safety stock is 120 units. At what on-hand inventory position should reorder occur?","choices":["765 units","120 units","885 units","1,845 units"],"correctIndex":2,"solutionSteps":["Step 1: Expected lead-time demand = 85 × 9 = 765.","Step 2: Add safety stock of 120, for reorder point 885."],"boardTrap":"765 ignores variability. Reorder point is distinct from order quantity.","citation":"BOA MS syllabus §2.2.5"},{"id":"ms-066","subject":"MS","topic":"Working Capital Management","difficulty":"Difficult","question":"Terms are 2/10, net 40. Use a 360-day year and simple annualization. The firm can borrow at 15% annually with no fees. Which is cheaper?","choices":["Forgo discount. It costs 2% annually.","Borrow and take discount. Forgoing it costs about 24.49%.","Borrow and take discount. Forgoing it costs 18.37%.","Indifferent because both provide 30 days of financing."],"correctIndex":1,"solutionSteps":["Step 1: Periodic cost is ₱2 ÷ ₱98; finance for 30 extra days.","Step 2: Multiply by 360 ÷ 30 for 24.49%, above 15%."],"boardTrap":"Using 40 days or dividing by the full invoice distorts the implied rate.","citation":"BOA MS syllabus §2.2.5"},{"id":"ms-067","subject":"MS","topic":"Working Capital Management","difficulty":"Difficult","question":"Relaxing credit adds ₱900,000 annual sales at a 35% contribution margin. New annual bad-debt cost is ₱64,000, extra collection expense ₱21,000, and incremental average receivable investment ₱500,000 at 12% cost. What is net annual benefit?","choices":["₱170,000","₱230,000","₱255,000","₱315,000"],"correctIndex":0,"solutionSteps":["Step 1: Incremental contribution = ₱315,000.","Step 2: Deduct bad debts, collection expense and ₱60,000 carrying cost, leaving ₱170,000."],"boardTrap":"Receivables tie up funds even though the increase is not an income statement expense.","citation":"BOA MS syllabus §2.2.5"},{"id":"ms-068","subject":"MS","topic":"Working Capital Management","difficulty":"Difficult","question":"Daily cash operating cost is ₱84,000. Inventory days fall by 5, receivable days rise by 3, and payable days rise by 4. Estimate the cash investment released under a uniform-cost assumption.","choices":["₱168,000","₱504,000 additional investment","₱1,008,000","₱504,000"],"correctIndex":3,"solutionSteps":["Step 1: Change in cycle = −5 + 3 − 4 = −6 days.","Step 2: A six-day decrease releases 6 × ₱84,000 = ₱504,000."],"boardTrap":"Longer payable days reduce funds tied up and should be subtracted.","citation":"BOA MS syllabus §2.2.5"},{"id":"ms-069","subject":"MS","topic":"Working Capital Management","difficulty":"Difficult","question":"Before year-end a firm has ₱780,000 current assets, including ₱260,000 inventory, and ₱520,000 current liabilities. It buys ₱130,000 inventory on current credit. What happens to current and quick ratios?","choices":["Current rises to 1.75, quick stays 1.00.","Current stays 1.50, quick rises to 1.25.","Current becomes 1.40, quick stays 1.00.","Current falls from 1.50 to 1.40, quick falls from 1.00 to 0.80."],"correctIndex":3,"solutionSteps":["Step 1: After purchase, current assets and liabilities are ₱910,000 and ₱650,000.","Step 2: Quick assets stay ₱520,000, so ratios are 1.40 and .80."],"boardTrap":"Adding equal amounts moves a current ratio above one toward one. Inventory does not raise quick assets.","citation":"BOA MS syllabus §2.2.1.5"},{"id":"ms-070","subject":"MS","topic":"Working Capital Management","difficulty":"Difficult","question":"At an order quantity of 600, annual ordering and holding costs are each ₱18,000. A discount requires 900 units per order. Annual purchase savings are ₱2,400 and the holding cost per unit remains fixed. Compared with 600 units, should the discount be accepted?","choices":["Accept, annual cost falls ₱2,400.","Reject, total annual cost rises ₱3,000.","Reject, total annual cost rises ₱600.","Accept, annual cost falls ₱600."],"correctIndex":2,"solutionSteps":["Step 1: At 900, ordering falls to ₱12,000 and holding rises to ₱27,000, total ₱39,000.","Step 2: Incremental inventory cost is ₱3,000, exceeding purchase savings by ₱600."],"boardTrap":"Compare total annual cost, including the hidden rise in average inventory.","citation":"BOA MS syllabus §2.2.5"}]'),qf=JSON.parse('[{"id":"aud-001","subject":"AUD","topic":"Risk Assessment & Internal Control","difficulty":"Easy","question":"At assertion level, which two components are assessed separately when identifying material misstatement risks?","choices":["Control risk and detection risk","Sampling risk and engagement risk","Inherent risk and detection risk","Inherent risk and control risk"],"correctIndex":3,"solutionSteps":["Step 1: First assess susceptibility before controls.","Step 2: Then assess the risk that controls fail to prevent, detect or correct the misstatement when controls will be tested."],"boardTrap":"Detection risk belongs to the auditor’s procedures.","citation":"PSA 315 (Revised 2019) paras. 31 and 34"},{"id":"aud-002","subject":"AUD","topic":"Risk Assessment & Internal Control","difficulty":"Easy","question":"A normal transaction’s unmitigated risk lies near the upper end of the spectrum of inherent risk. What might it be classified as?","choices":["Automatically low risk after considering controls","Detection risk","Significant risk","An omitted disclosure in every case"],"correctIndex":2,"solutionSteps":["Step 1: Judge inherent risk using likelihood and magnitude before mitigating controls.","Step 2: Near the upper end is one route to classification as significant."],"boardTrap":"A well-designed control does not change the inherent risk classification.","citation":"PSA 315 (Revised 2019) para. 12(l)"},{"id":"aud-003","subject":"AUD","topic":"Risk Assessment & Internal Control","difficulty":"Easy","question":"How should an auditor evaluate design and implementation of selected controls?","choices":["Ask management only and document the assurance.","Evaluate design and use procedures in addition to inquiry to determine implementation.","Test every transaction for the entire year.","Assume implementation when the policy manual has a date."],"correctIndex":1,"solutionSteps":["Step 1: Check whether the control could address the risk.","Step 2: Obtain evidence beyond inquiry that the control has been put into use."],"boardTrap":"A walkthrough can support implementation without proving full-period effectiveness.","citation":"PSA 315 (Revised 2019) para. 26(d)"},{"id":"aud-004","subject":"AUD","topic":"Risk Assessment & Internal Control","difficulty":"Easy","question":"Which procedures remain required for each material transaction class, balance and disclosure regardless of assessed risks?","choices":["Substantive procedures","Tests of every control in each class","External confirmation for every account","A revised engagement letter"],"correctIndex":0,"solutionSteps":["Step 1: Identify each material class, balance and disclosure.","Step 2: Design substantive procedures for it even if controls are strong."],"boardTrap":"A control-reliance strategy does not eliminate required substantive work.","citation":"PSA 330 paras. 8 and 18"},{"id":"aud-005","subject":"AUD","topic":"Risk Assessment & Internal Control","difficulty":"Moderate","question":"A client records invoices before warehouse release. Which assertion is most directly threatened by invoices for nonexistent sales?","choices":["Occurrence","Completeness","Classification of equity","Rights to a supplier’s inventory"],"correctIndex":0,"solutionSteps":["Step 1: Trace recorded sales to evidence that goods were actually released under the terms.","Step 2: An unsupported recorded sale threatens occurrence."],"boardTrap":"Completeness asks whether real sales were left out.","citation":"PSA 315 (Revised 2019) paras. A189–A191"},{"id":"aud-006","subject":"AUD","topic":"Risk Assessment & Internal Control","difficulty":"Moderate","question":"The gross margin rises from 24% to 37% while price and mix appear stable. What is the best initial audit use of this difference?","choices":["Conclude that fraud is established.","Adjust cost of sales to the prior margin without evidence.","Ignore it because revenue totals match the ledger.","Investigate causes and assess risks such as understated cost of sales."],"correctIndex":3,"solutionSteps":["Step 1: Use preliminary analytics to flag unusual relationships.","Step 2: Investigate plausible business and misstatement causes and design responses."],"boardTrap":"An analytics anomaly is a risk signal, not proof of fraud or a substitute for evidence.","citation":"PSA 315 (Revised 2019) paras. 13 and 19"},{"id":"aud-007","subject":"AUD","topic":"Risk Assessment & Internal Control","difficulty":"Moderate","question":"A supervisor signs an approval policy that was observed during one October transaction. The auditor intends to rely on approvals for the full year. What further work is needed?","choices":["Assume twelve months of effectiveness from October inspection.","Obtain only an additional signed policy.","Test operating effectiveness for the relevant period.","Replace the test with an assertion that risk is nil."],"correctIndex":2,"solutionSteps":["Step 1: Observation supports that the control was implemented.","Step 2: Test operation across the intended reliance period as required."],"boardTrap":"Implementation at a date is not continuous operation.","citation":"PSA 315 (Revised 2019) para. 26; PSA 330 para. 8"},{"id":"aud-008","subject":"AUD","topic":"Risk Assessment & Internal Control","difficulty":"Moderate","question":"A warehouse system automatically blocks duplicate dispatch numbers. Which complementary issue is most directly relevant to reliance?","choices":["Whether the annual invoice count agrees with the ledger","Whether unauthorized users can change the rule or bypass the block","Whether recurring supplier contracts require dual signatures","Whether the automated block was documented only in the prior-year file"],"correctIndex":1,"solutionSteps":["Step 1: Identify the application control and the supporting IT risks.","Step 2: Review relevant access and change controls that could affect it."],"boardTrap":"An apparently effective application rule can be undermined by uncontrolled overrides.","citation":"PSA 315 (Revised 2019) para. 26(a)–(c)"},{"id":"aud-009","subject":"AUD","topic":"Risk Assessment & Internal Control","difficulty":"Moderate","question":"An automated trade platform retains no usable manual trail. Substantive procedures alone cannot produce sufficient appropriate evidence. What is required?","choices":["Rely on management’s narrative only.","Identify relevant controls and test their operating effectiveness.","Treat the balance as immaterial automatically.","Perform only a broad ratio comparison despite the identified gap."],"correctIndex":1,"solutionSteps":["Step 1: Identify risks for which substantive procedures alone are insufficient.","Step 2: Test relevant controls that address the automated flow."],"boardTrap":"Internal controls cannot be omitted in a situation requiring control testing.","citation":"PSA 315 (Revised 2019) para. 33; PSA 330 para. 8(b)"},{"id":"aud-010","subject":"AUD","topic":"Risk Assessment & Internal Control","difficulty":"Moderate","question":"Overall materiality is ₱1 million, performance materiality ₱700,000 and clearly trivial threshold ₱30,000. How should a ₱55,000 identified misstatement ordinarily be treated?","choices":["Accumulate it for evaluation.","Exclude it because it is below performance materiality.","Issue a qualified opinion immediately.","Automatically deem it fraud."],"correctIndex":0,"solutionSteps":["Step 1: Compare with the clearly trivial threshold, not performance materiality.","Step 2: Accumulate because ₱55,000 exceeds ₱30,000."],"boardTrap":"Performance materiality is not the threshold for logging identified errors.","citation":"PSA 320 para. 9; PSA 450 para. 5"},{"id":"aud-011","subject":"AUD","topic":"Risk Assessment & Internal Control","difficulty":"Difficult","question":"The team relied on a year-one automated credit limit control. During year two it discovers a password-sharing override changed the approval bypass. The risk is significant. Can last year’s test alone support reliance?","choices":["Yes, automated controls never need new testing.","Yes, apply a three-year rotation despite a change and a significant risk.","Only if the code description has the same title.","No. Address the changed IT risk and test current-period operating effectiveness if relying."],"correctIndex":3,"solutionSteps":["Step 1: Reassess design and implementation for the changed override.","Step 2: A control over significant risk on which reliance is planned requires current-period testing."],"boardTrap":"An occasional reuse rule cannot override significant-risk requirements or a known change.","citation":"PSA 315 (Revised 2019) paras. 26 and 34; PSA 330 paras. 14–15"},{"id":"aud-012","subject":"AUD","topic":"Risk Assessment & Internal Control","difficulty":"Difficult","question":"Near completion, new credible evidence shows year-end sales can be backdated despite the auditor’s earlier low-risk assessment. What should the auditor do?","choices":["Keep the original assessment once documentation is signed.","Post an arbitrary adjustment using prior-year cutoff amounts.","Revise risk assessment and extend responsive cutoff procedures.","Immediately disclaim without further work."],"correctIndex":2,"solutionSteps":["Step 1: Reassess consistent with new evidence.","Step 2: Redesign the nature, timing and extent of further procedures for the affected assertions."],"boardTrap":"Risk assessment is iterative even after planning has ended.","citation":"PSA 315 (Revised 2019) para. 37; PSA 330 para. 6"},{"id":"aud-013","subject":"AUD","topic":"Risk Assessment & Internal Control","difficulty":"Difficult","question":"A retailer has strong controls over ordinary invoicing, but management can post manual revenue entries after close. What audit response best addresses the residual threat?","choices":["Rely only on automatic invoice sequencing.","Remove fraud risk because revenues are observable.","Test appropriate journal entries and evaluate override indicators despite strong routine controls.","Test only vendor completeness, since revenue is presumed accurate."],"correctIndex":2,"solutionSteps":["Step 1: Identify override as a risk not resolved by routine invoicing controls.","Step 2: Select manual and other risk-responsive journal entries and adjustments for testing."],"boardTrap":"Routine approval can operate effectively while senior management bypasses it.","citation":"PSA 240 paras. 26 and 32; PSA 315 (Revised 2019) para. 31"},{"id":"aud-014","subject":"AUD","topic":"Risk Assessment & Internal Control","difficulty":"Difficult","question":"The audit identifies a significant control deficiency, but expanded substantive work supports an unmodified opinion. What should follow?","choices":["No communication because the opinion is unmodified.","Timely written communication of the significant deficiency to those charged with governance.","An adverse opinion solely because control is weak.","Communicate orally to accounting staff only."],"correctIndex":1,"solutionSteps":["Step 1: Separate financial-statement opinion from governance communication.","Step 2: A significant deficiency is communicated in writing on a timely basis."],"boardTrap":"A clean opinion does not certify that controls are free of significant deficiencies.","citation":"PSA 265 paras. 9–11; PSA 330 para. 6"},{"id":"aud-015","subject":"AUD","topic":"Accounting Estimates","difficulty":"Easy","question":"What is estimation uncertainty?","choices":["Susceptibility to lack of precision in measurement","The auditor’s risk of being late","Certainty that management made a bias","Difference between cash and accrual income"],"correctIndex":0,"solutionSteps":["Step 1: Identify an amount not directly observable.","Step 2: Its inherent lack of precision is estimation uncertainty."],"boardTrap":"Uncertainty alone is not deliberate bias.","citation":"PSA 540 (Revised) para. 12(c)"},{"id":"aud-016","subject":"AUD","topic":"Accounting Estimates","difficulty":"Easy","question":"Which is a permitted response to an estimate’s assessed risk?","choices":["Delegating the auditor opinion to management","Accepting an unsupported estimate merely because it recurs","Using the highest possible outcome automatically","Developing an independent auditor point estimate or range"],"correctIndex":3,"solutionSteps":["Step 1: Select an appropriate risk-responsive approach.","Step 2: An auditor estimate or range is one possible approach alongside other evidence."],"boardTrap":"A third-party specialist can assist, but the auditor remains responsible.","citation":"PSA 540 (Revised) paras. 18–19"},{"id":"aud-017","subject":"AUD","topic":"Accounting Estimates","difficulty":"Easy","question":"What should an auditor do about indicators of possible management bias?","choices":["Declare every indicator a confirmed misstatement.","Ignore them if each amount individually looks reasonable.","Eliminate estimation from the financial statements.","Evaluate their implications for the audit."],"correctIndex":3,"solutionSteps":["Step 1: Consider patterns in management judgments and direction of changes.","Step 2: Evaluate implications for risk, other estimates, and the audit as a whole."],"boardTrap":"An indicator is evidence to assess, not automatically proof of intentional bias.","citation":"PSA 540 (Revised) para. 32"},{"id":"aud-018","subject":"AUD","topic":"Accounting Estimates","difficulty":"Easy","question":"What can be included in an auditor’s range?","choices":["Every numerically conceivable value","The single management-selected amount only","Amounts supported by sufficient appropriate audit evidence and evaluated as reasonable","Amounts chosen merely to include posted numbers"],"correctIndex":2,"solutionSteps":["Step 1: Evaluate assumptions, methods and data.","Step 2: Include only supported reasonable outcomes."],"boardTrap":"Widening a range to tolerate unsupported estimates defeats its evidential purpose.","citation":"PSA 540 (Revised) para. 29"},{"id":"aud-019","subject":"AUD","topic":"Accounting Estimates","difficulty":"Moderate","question":"A property estimate uses a sale of a similar building, but the sale included a long lease at above-market rent. Which response is best?","choices":["Use the price unchanged because square footage matches.","Assess comparability and adjust for the favorable lease or seek better evidence.","Discard all comparable transactions and use cost automatically.","Use the book value as fair value."],"correctIndex":1,"solutionSteps":["Step 1: Test whether the source and adjustment reflect market assumptions.","Step 2: The embedded lease can materially affect comparability."],"boardTrap":"An external sale price is not automatically comparable.","citation":"PSA 540 (Revised) paras. 22–25"},{"id":"aud-020","subject":"AUD","topic":"Accounting Estimates","difficulty":"Moderate","question":"After year-end, a debtor’s bankruptcy confirms severe financial conditions documented in December. How can the auditor use this event?","choices":["As evidence about the year-end allowance, after evaluating the link to December conditions.","As a January event that can never affect December estimates.","As proof every customer is impaired.","Only as evidence about future revenue."],"correctIndex":0,"solutionSteps":["Step 1: Identify whether later evidence relates to conditions at year-end.","Step 2: Use it to test the related estimate if it does."],"boardTrap":"Events after year-end can corroborate earlier conditions.","citation":"PSA 540 (Revised) paras. 18(a) and 21; PAS 10 paras. 8–9"},{"id":"aud-021","subject":"AUD","topic":"Accounting Estimates","difficulty":"Moderate","question":"While testing a warranty provision, which observation most directly questions the input data?","choices":["The claims extract excludes online service tickets that fall within coverage.","The formula is independently recalculated unchanged.","The estimate was prepared before the audit plan.","An authorized manager approved the schedule."],"correctIndex":0,"solutionSteps":["Step 1: Separate data completeness from arithmetic and approval.","Step 2: Determine whether online claims belong in the covered population."],"boardTrap":"Correct arithmetic cannot compensate for missing records.","citation":"PSA 540 (Revised) paras. 23–25"},{"id":"aud-022","subject":"AUD","topic":"Accounting Estimates","difficulty":"Moderate","question":"What is the main purpose of reviewing the outcome of prior-period estimates during current risk assessment?","choices":["Automatically restate every prior difference.","Use prior audit conclusions instead of current evidence.","Freeze all current assumptions at prior-year values.","Identify and assess current misstatement risk and possible bias."],"correctIndex":3,"solutionSteps":["Step 1: Compare prior estimates with outcomes for insight into methods, risk and bias.","Step 2: Consider information previously available before drawing conclusions."],"boardTrap":"A later outcome alone does not establish that the original estimate was unreasonable.","citation":"PSA 540 (Revised) para. 14"},{"id":"aud-023","subject":"AUD","topic":"Accounting Estimates","difficulty":"Moderate","question":"Management calculates an allowance with a correct formula but uses a default forecast inconsistent with an approved macroeconomic forecast. What should the auditor test next?","choices":["Only whether the spreadsheet adds correctly again.","Only who typed the formula.","Whether the significant default assumption is appropriate and supported.","Only whether cash exists at year-end."],"correctIndex":2,"solutionSteps":["Step 1: Test assumptions separately from mechanics.","Step 2: Investigate the inconsistency and the justification for any reasonable difference."],"boardTrap":"Reliable calculation does not establish reliable economic inputs.","citation":"PSA 540 (Revised) paras. 23–24"},{"id":"aud-024","subject":"AUD","topic":"Accounting Estimates","difficulty":"Moderate","question":"An audited impairment allowance is ₱260,000 and the supported auditor range is ₱300,000–₱350,000. What minimum amount is understated?","choices":["₱90,000","₱40,000","₱65,000","₱0 because the estimate is uncertain"],"correctIndex":1,"solutionSteps":["Step 1: Compare management’s estimate with the closest reasonable bound.","Step 2: ₱300,000 − ₱260,000 = ₱40,000 minimum understatement."],"boardTrap":"The midpoint is not automatically the measure of misstatement.","citation":"PSA 540 (Revised) para. 29; PSA 450 para. A3"},{"id":"aud-025","subject":"AUD","topic":"Accounting Estimates","difficulty":"Difficult","question":"Management uses optimistic revenue assumptions in impairment testing but pessimistic assumptions about substantially the same market for a restructuring estimate. Individually, both results are near favorable ends of supported ranges. What is the strongest audit conclusion?","choices":["Treat both estimates as automatically acceptable because each is inside a range.","Investigate inconsistent assumptions and directional bias across estimates, even if neither amount alone is outside its range.","Correct both to the midpoint solely as a matter of policy.","Conclude fraud has legally occurred and skip further testing."],"correctIndex":1,"solutionSteps":["Step 1: Compare assumptions across estimates using the same underlying evidence.","Step 2: Evaluate the bias implications and whether estimates and disclosures remain reasonable."],"boardTrap":"A within-range result does not eliminate a cross-estimate pattern of bias.","citation":"PSA 540 (Revised) paras. 23–30 and 32"},{"id":"aud-026","subject":"AUD","topic":"Accounting Estimates","difficulty":"Difficult","question":"A January warehouse fire causes a major customer’s default. A separate debtor’s January settlement confirms financial difficulty present in December. What evidence belongs in the December expected loss measurement?","choices":["Include evidence about the second debtor’s existing condition. Treat the fire as a later event, with disclosure if material.","Adjust both because both occurred before audit signing.","Exclude both because they occurred in January.","Include only the fire because it causes a larger loss."],"correctIndex":0,"solutionSteps":["Step 1: Date the underlying condition for each balance.","Step 2: Use the confirming settlement for December and distinguish the newly arising fire."],"boardTrap":"Do not date evidence solely by either the discovery date or size of the loss.","citation":"PSA 540 (Revised) paras. 21 and 33; PAS 10 paras. 8–10"},{"id":"aud-027","subject":"AUD","topic":"Accounting Estimates","difficulty":"Difficult","question":"Two supported discounted cash-shortfall scenarios are ₱50,000 at 80% and ₱250,000 at 20%. Management records ₱50,000 because it is most likely. What adjustment should the auditor propose?","choices":["Increase by ₱200,000.","Decrease by ₱10,000.","Record no difference.","Increase allowance by ₱40,000."],"correctIndex":3,"solutionSteps":["Step 1: Weighted estimate is ₱40,000 + ₱50,000 = ₱90,000.","Step 2: Compare with ₱50,000 booked, yielding ₱40,000 understatement."],"boardTrap":"Most likely outcome can omit a material adverse scenario.","citation":"PSA 540 (Revised) paras. 18, 22–29; PFRS 9 para. 5.5.17"},{"id":"aud-028","subject":"AUD","topic":"Accounting Estimates","difficulty":"Difficult","question":"The auditor obtains sufficient evidence that a material estimate disclosure is inadequate. The effect is confined and not pervasive. Management refuses correction. Which opinion is appropriate?","choices":["Disclaimer for inability to obtain evidence","Unmodified with Emphasis of Matter","Qualified for material misstatement","Adverse in all cases"],"correctIndex":2,"solutionSteps":["Step 1: Evidence establishes an omitted or inadequate disclosure.","Step 2: A known material nonpervasive misstatement calls for a qualification."],"boardTrap":"An Emphasis of Matter draws attention to appropriately disclosed matters and cannot cure omission.","citation":"PSA 540 (Revised) paras. 33–36 and PSA 705 (Revised) para. 7"},{"id":"aud-029","subject":"AUD","topic":"Adjusted Cash & Receivables","difficulty":"Easy","question":"Who should control the sending of bank confirmations and receipt of responses?","choices":["The client’s treasury manager","The financing bank alone","The auditor","The client’s internal bookkeeper"],"correctIndex":2,"solutionSteps":["Step 1: Preserve auditor control of requests.","Step 2: Direct responses to the auditor."],"boardTrap":"Client assistance with account listings does not transfer control.","citation":"PSA 505 para. 7"},{"id":"aud-030","subject":"AUD","topic":"Adjusted Cash & Receivables","difficulty":"Easy","question":"What normally follows a nonresponse to a positive receivable confirmation?","choices":["Treat silence as concurrence.","Perform alternative procedures to obtain relevant reliable evidence.","Automatically write off the receivable.","Replace positive confirmation with silence-based evidence only."],"correctIndex":1,"solutionSteps":["Step 1: Identify the evidence sought.","Step 2: Perform alternatives such as examining subsequent cash and support, where appropriate."],"boardTrap":"A nonresponse to a positive request does not verify existence.","citation":"PSA 505 para. 12"},{"id":"aud-031","subject":"AUD","topic":"Adjusted Cash & Receivables","difficulty":"Easy","question":"What does appropriateness of audit evidence measure?","choices":["Relevance and reliability","Number of documents only","Number of employees providing copies","Elapsed audit hours"],"correctIndex":0,"solutionSteps":["Step 1: Test relevance to the assertion and reliability of the evidence.","Step 2: Distinguish quality from sufficiency, which addresses quantity."],"boardTrap":"A large quantity of poorly targeted evidence does not ensure appropriateness.","citation":"PSA 500 para. 5"},{"id":"aud-032","subject":"AUD","topic":"Adjusted Cash & Receivables","difficulty":"Easy","question":"A highly liquid investment with insignificant value risk normally has what maturity to qualify as cash equivalent?","choices":["Three months after the balance-sheet date regardless of original term","Twelve months regardless of purpose","Any maturity as long as it is marketable","Three months or less from acquisition"],"correctIndex":3,"solutionSteps":["Step 1: Check short maturity from acquisition together with liquidity and purpose.","Step 2: A longer instrument does not become an equivalent simply by nearing maturity."],"boardTrap":"The reporting date does not restart the maturity test.","citation":"PAS 7 paras. 6–7; PSA 500 para. 7"},{"id":"aud-033","subject":"AUD","topic":"Adjusted Cash & Receivables","difficulty":"Moderate","question":"Confirmed bank cash is ₱916,000. There are ₱83,000 verified deposits in transit and ₱57,000 outstanding cheques. Compute adjusted bank cash.","choices":["₱890,000","₱999,000","₱776,000","₱942,000"],"correctIndex":3,"solutionSteps":["Step 1: Add deposits in transit to the confirmed balance.","Step 2: Deduct issued cheques not cleared. Result ₱942,000."],"boardTrap":"Timing differences adjust the bank side in opposite directions.","citation":"PSA 505 para. 7; BOA AUD syllabus · Cash and cash equivalents"},{"id":"aud-034","subject":"AUD","topic":"Adjusted Cash & Receivables","difficulty":"Moderate","question":"Book cash is ₱610,000. An unbooked ₱42,000 bank collection includes ₱2,000 interest. A ₱14,000 customer cheque was returned and ₱1,000 bank fees are not recorded. Adjust book cash.","choices":["₱639,000","₱595,000","₱637,000","₱665,000"],"correctIndex":2,"solutionSteps":["Step 1: Add total cash collected by bank of ₱42,000.","Step 2: Subtract returned cheque and bank fee: ₱610,000 + ₱42,000 − ₱14,000 − ₱1,000."],"boardTrap":"The ₱2,000 interest is already included in bank collection. Do not add it twice.","citation":"PSA 500 paras. 7 and 9; BOA AUD syllabus · Cash"},{"id":"aud-035","subject":"AUD","topic":"Adjusted Cash & Receivables","difficulty":"Moderate","question":"Corrected gross receivables are ₱1.25 million. Required ending allowance is ₱72,000 and booked allowance is ₱31,000 credit. What adjusted net AR results?","choices":["₱1,219,000","₱1,178,000","₱1,209,000","₱1,322,000"],"correctIndex":1,"solutionSteps":["Step 1: Apply the required ending allowance rather than the adjusting entry alone.","Step 2: ₱1,250,000 − ₱72,000 = ₱1,178,000."],"boardTrap":"The ₱41,000 increase is not the entire contra-asset balance.","citation":"PFRS 9 paras. 5.5.8 and .15; PSA 540 (Revised) para. 22"},{"id":"aud-036","subject":"AUD","topic":"Adjusted Cash & Receivables","difficulty":"Moderate","question":"Year-end AR includes an invoice of ₱96,000 for goods delivered January 3 under destination terms. No cash was received and there was no unconditional right before delivery. What correction affects AR?","choices":["Decrease ₱96,000.","Increase ₱96,000.","Leave it because an invoice was printed.","Reclassify the full amount to cash."],"correctIndex":0,"solutionSteps":["Step 1: Control passed after year-end.","Step 2: Reverse the premature receivable and revenue."],"boardTrap":"Invoicing alone does not establish an enforceable current right in this scenario.","citation":"PFRS 15 para. 31; PSA 330 para. 6"},{"id":"aud-037","subject":"AUD","topic":"Adjusted Cash & Receivables","difficulty":"Moderate","question":"A customer pays ₱105,000 after year-end against two invoices. Only ₱66,000 relates to pre-year-end sales. How much supports existence of the December balance, all else equal?","choices":["₱66,000","₱105,000","₱39,000","₱0 because cash was received later"],"correctIndex":0,"solutionSteps":["Step 1: Match the amount to underlying invoices and shipment dates.","Step 2: Only the ₱66,000 pre-year-end balance is corroborated."],"boardTrap":"Subsequent collection can include new-year invoices.","citation":"PSA 505 para. 12; PSA 500 para. 7"},{"id":"aud-038","subject":"AUD","topic":"Adjusted Cash & Receivables","difficulty":"Moderate","question":"A fund contains ₱30,000 actual cash and ₱17,000 valid expense vouchers. Ledger petty cash is ₱50,000. What unexplained shortage exists?","choices":["₱20,000","₱17,000","₱0","₱3,000"],"correctIndex":3,"solutionSteps":["Step 1: Account for ₱30,000 cash and ₱17,000 verified disbursements.","Step 2: ₱50,000 − ₱47,000 = ₱3,000 shortage."],"boardTrap":"Valid vouchers explain disbursed cash but are not physical cash.","citation":"PAS 7 para. 6; PSA 500 para. 9"},{"id":"aud-039","subject":"AUD","topic":"Adjusted Cash & Receivables","difficulty":"Difficult","question":"A ₱420,000 transfer was recorded as a December receipt in the receiving ledger and as a January disbursement in the paying ledger. There is no external cash flow. What year-end group cash adjustment removes the double count?","choices":["Increase cash by ₱420,000.","Decrease cash by ₱840,000.","Decrease cash by ₱420,000.","No change because both accounts belong to one entity."],"correctIndex":2,"solutionSteps":["Step 1: Record both legs in the same period for aggregate cash recognition.","Step 2: Remove one duplicate ₱420,000 balance at December 31."],"boardTrap":"Combining account balances without testing transfer cutoff permits kiting.","citation":"PSA 500 para. 7; BOA AUD syllabus · Interbank transfers"},{"id":"aud-040","subject":"AUD","topic":"Adjusted Cash & Receivables","difficulty":"Difficult","question":"Ledger gross AR is ₱1.6 million and existing allowance ₱70,000 credit. Write off a ₱50,000 irrecoverable account already included in the allowance. Remaining balances require ending ECL of ₱84,000. What additional impairment loss is needed?","choices":["₱14,000","₱64,000","₱84,000","₱114,000"],"correctIndex":1,"solutionSteps":["Step 1: Charge the write-off to allowance, leaving ₱20,000 credit.","Step 2: Top it up to ₱84,000 by recognizing ₱64,000 loss."],"boardTrap":"Compare required ECL with allowance after write-off, rather than the original credit.","citation":"PFRS 9 paras. 5.4.4 and 5.5.15; PSA 540 (Revised) para. 22"},{"id":"aud-041","subject":"AUD","topic":"Adjusted Cash & Receivables","difficulty":"Difficult","question":"An independently confirmed bank balance is ₱580,000. Transit deposits of ₱70,000 include ₱12,000 actually received in January. Cheques listed as outstanding are ₱49,000, including an ₱8,000 cheque held until January. What adjusted December bank-side amount results?","choices":["₱601,000","₱597,000","₱589,000","₱609,000"],"correctIndex":1,"solutionSteps":["Step 1: Valid transit deposits are ₱58,000 and valid outstanding issued cheques ₱41,000.","Step 2: Adjusted balance = ₱580,000 + ₱58,000 − ₱41,000 = ₱597,000."],"boardTrap":"Both reconciling lists need cutoff testing. A withheld cheque was not an outstanding issued cheque.","citation":"PSA 505 para. 7; PSA 500 para. 9"},{"id":"aud-042","subject":"AUD","topic":"Adjusted Cash & Receivables","difficulty":"Difficult","question":"Gross AR is ₱840,000 including ₱120,000 premature sales in the current bucket. The balance originally comprises ₱600,000 current and ₱240,000 overdue. Loss rates are 2% current and 10% overdue. What adjusted net AR is required?","choices":["₱686,400","₱684,000","₱804,000","₱696,000"],"correctIndex":0,"solutionSteps":["Step 1: Reverse premature sales, leaving ₱480,000 current and ₱240,000 overdue.","Step 2: ECL is ₱9,600 + ₱24,000 = ₱33,600 on ₱720,000 gross. Net ₱686,400."],"boardTrap":"Correct the exposure population before applying the ECL rates.","citation":"PFRS 9 paras. 5.5.8 and .15; PFRS 15 para. 31"},{"id":"aud-043","subject":"AUD","topic":"Adjusted Inventory & Net Income","difficulty":"Easy","question":"If material inventory count attendance is practicable, what does the auditor ordinarily do?","choices":["Personally count
