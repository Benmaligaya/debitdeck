 as void and incapable of ratification."],"boardTrap":"One ratifying act cannot cure different defects under the same rule.","citation":"Civil Code arts. 1390–1393 and 1409"},{"id":"rfbt-019","subject":"RFBT","topic":"Contracts","difficulty":"Difficult","question":"Assume all otherwise required substantive elements are met. A land sale was oral, but the seller accepted partial payment under the sale. What is the effect solely on the Statute of Frauds objection?","choices":["It remains unenforceable forever because land is involved.","It was void from inception and cannot be ratified.","Acceptance of benefits can ratify it for purposes of the objection.","The buyer must reject delivery before payment can count."],"correctIndex":2,"solutionSteps":["Step 1: The Statute of Frauds concerns the prescribed proof of executory agreements.","Step 2: Acceptance of benefits can ratify the covered agreement."],"boardTrap":"Separate enforceability from registrability and any other formal requirements.","citation":"Civil Code arts. 1403(2)(e) and 1405"},{"id":"rfbt-020","subject":"RFBT","topic":"Contracts","difficulty":"Difficult","question":"A buyer seeks resolution of a reciprocal supply contract after a substantial failure to deliver. The supplier argues that any remedy called rescission is subsidiary under Art. 1383. Which answer is correct?","choices":["The buyer can invoke Art. 1191 only after exhausting Art. 1383 remedies.","Art. 1191 resolution for substantial reciprocal breach has a distinct basis from rescission under Art. 1383.","Every late delivery automatically resolves the contract.","Art. 1191 applies only to contracts with an illegal object."],"correctIndex":1,"solutionSteps":["Step 1: Identify the substantial breach of a reciprocal obligation.","Step 2: Distinguish the Article 1191 remedy from subsidiary rescission for prejudice."],"boardTrap":"The same word in translations does not make the two remedies interchangeable.","citation":"Civil Code arts. 1191 and 1383"},{"id":"rfbt-021","subject":"RFBT","topic":"Corporations & Capital","difficulty":"Easy","question":"What default duration applies to a newly formed corporation unless its articles provide otherwise?","choices":["Fifty years","Perpetual existence","Twenty-five years","Until the last original incorporator leaves"],"correctIndex":1,"solutionSteps":["Step 1: Identify the RCCP corporate term rule.","Step 2: Apply perpetual existence by default."],"boardTrap":"The historical 50-year default is obsolete for this question.","citation":"RA 11232 Sec. 11"},{"id":"rfbt-022","subject":"RFBT","topic":"Corporations & Capital","difficulty":"Easy","question":"Absent special law, which event ordinarily starts the juridical personality of a stock corporation?","choices":["SEC issuance of its certificate of incorporation","Execution of the articles","Receipt of first subscription payment","Internal election of its initial board"],"correctIndex":0,"solutionSteps":["Step 1: Formation steps come before juridical personality.","Step 2: Use issuance of the certificate under the Code."],"boardTrap":"Signing foundational documents does not itself create the corporate person.","citation":"RA 11232 Secs. 12 and 18"},{"id":"rfbt-023","subject":"RFBT","topic":"Corporations & Capital","difficulty":"Easy","question":"Which is expressly prohibited consideration for original share issuance?","choices":["Cash actually received","Property actually received at a proper valuation","Services already performed","Future services"],"correctIndex":3,"solutionSteps":["Step 1: Distinguish a future promise from existing value delivered.","Step 2: Future services and promissory notes are not permissible consideration."],"boardTrap":"Actual services rendered and future services are treated differently.","citation":"RA 11232 Sec. 61"},{"id":"rfbt-024","subject":"RFBT","topic":"Corporations & Capital","difficulty":"Moderate","question":"A corporation lawfully reacquires fully paid voting shares. While held as treasury shares, how may the corporation vote them?","choices":["It may vote them through the treasurer.","It may vote them if acquired at par.","It cannot vote them while held in treasury.","It must allocate their votes to the largest stockholder."],"correctIndex":2,"solutionSteps":["Step 1: Classify reacquired issued paid shares as treasury.","Step 2: Voting is suspended during treasury holding under Sec. 56."],"boardTrap":"The original voting terms do not give the issuer a vote on its own shares.","citation":"RA 11232 Secs. 9 and 56"},{"id":"rfbt-025","subject":"RFBT","topic":"Corporations & Capital","difficulty":"Moderate","question":"A stock corporation has available unrestricted retained earnings. Its board approves a stock dividend. What additional approval is normally required?","choices":["A simple majority of all authorized shares regardless of issuance","Only the treasurer’s approval","Stockholders representing at least two-thirds of outstanding capital stock","No stockholder vote is ever required for dividends"],"correctIndex":2,"solutionSteps":["Step 1: Identify a stock dividend, rather than cash or property distribution.","Step 2: Obtain the required two-thirds outstanding-capital approval at a duly called meeting."],"boardTrap":"Board authority on cash dividends does not remove the stock-dividend voting requirement.","citation":"RA 11232 Sec. 42"},{"id":"rfbt-026","subject":"RFBT","topic":"Corporations & Capital","difficulty":"Moderate","question":"Articles do not deny preemptive rights. The corporation proposes an ordinary cash issuance outside statutory exceptions. What opportunity generally belongs to existing holders?","choices":["Demand judicial valuation in every case.","Subscribe in proportion to current shareholdings.","Purchase the entire issue on a first-come basis.","Receive the new shares free of charge."],"correctIndex":1,"solutionSteps":["Step 1: Identify no charter denial or applicable exception.","Step 2: Observe proportionate subscription rights."],"boardTrap":"A preemptive right preserves percentage ownership by subscribing, rather than granting free shares.","citation":"RA 11232 Sec. 38"},{"id":"rfbt-027","subject":"RFBT","topic":"Corporations & Capital","difficulty":"Moderate","question":"An eligible natural person forms an OPC and wishes to be president and corporate secretary. Which is permitted?","choices":["Act as president, but appoint someone else as corporate secretary.","Act in both roles with majority consent.","Serve as secretary only because the board is a sole director.","Hold neither position as the shareholder."],"correctIndex":0,"solutionSteps":["Step 1: The sole stockholder serves as director and president.","Step 2: The statute separately bars that stockholder from being corporate secretary."],"boardTrap":"The role restrictions differ across corporate offices in an OPC.","citation":"RA 11232 Secs. 116, 121 and 122"},{"id":"rfbt-028","subject":"RFBT","topic":"Corporations & Capital","difficulty":"Difficult","question":"In a stock corporation with voting and nonvoting shares, a duly called vote concerns a valid amendment of the articles. May nonvoting shares participate?","choices":["No. Only ordinary voting shareholders ever vote.","Only nonvoting shares vote because ordinary shares already govern the board.","Yes, but only if the board reverses their classification by resolution.","Yes. Amendment is a statutory exception to nonvoting status."],"correctIndex":3,"solutionSteps":["Step 1: Check whether the action is one of the Code’s fundamental matters.","Step 2: Count nonvoting shares for the amendment as provided by the Code."],"boardTrap":"Do not use an ordinary management vote rule for a fundamental action.","citation":"RA 11232 Secs. 6 and 15"},{"id":"rfbt-029","subject":"RFBT","topic":"Corporations & Capital","difficulty":"Difficult","question":"The charter preserves preemptive rights. The corporation must issue shares in compliance with a law requiring minimum public ownership. Does the ordinary preemptive right cover that issuance?","choices":["Yes because the charter did not deny the right.","Only if the existing shareholder is a director.","Yes unless the corporation offers redeemable shares instead.","No. The statutory public-ownership exception applies."],"correctIndex":3,"solutionSteps":["Step 1: Check the proviso after the general proportionate entitlement.","Step 2: An issuance required to meet minimum public ownership falls within an exception."],"boardTrap":"Preserving the right in the charter does not negate a statutory exception.","citation":"RA 11232 Sec. 38"},{"id":"rfbt-030","subject":"RFBT","topic":"Corporations & Capital","difficulty":"Difficult","question":"The board declares a stock dividend. There are 12,000 subscribed and issued shares, of which 1,200 are treasury shares. Favorable votes represent 7,000 shares. Does the vote meet the two-thirds threshold?","choices":["Yes. 7,000 is a simple majority of outstanding shares.","No. Two-thirds must be computed on all 12,000 shares.","No. Two-thirds of 10,800 outstanding is 7,200.","Yes. Only shareholders present form the denominator."],"correctIndex":2,"solutionSteps":["Step 1: Exclude treasury shares from outstanding capital stock.","Step 2: Compare 7,000 favorable votes to two-thirds of 10,800, or 7,200."],"boardTrap":"Ignoring treasury shares or converting the supermajority to a simple majority both use the wrong base.","citation":"RA 11232 Secs. 42, 56 and 173"},{"id":"rfbt-031","subject":"RFBT","topic":"Corporate Governance","difficulty":"Easy","question":"Who ordinarily exercises corporate powers and directs the business, subject to matters reserved by law?","choices":["Any stockholder acting individually","Board of directors or trustees","Outside auditor","Corporate secretary acting without delegation"],"correctIndex":1,"solutionSteps":["Step 1: Identify the governing organ.","Step 2: The board exercises the ordinary corporate power unless otherwise provided."],"boardTrap":"Ownership of shares does not itself authorize the holder to act for the corporation.","citation":"RA 11232 Sec. 22"},{"id":"rfbt-032","subject":"RFBT","topic":"Corporate Governance","difficulty":"Easy","question":"Which citizenship and residency qualifications apply to the corporate secretary?","choices":["Philippine citizen and resident","Philippine citizen but never a resident","Resident of any country with no other qualification","Foreign citizen and nonresident"],"correctIndex":0,"solutionSteps":["Step 1: Apply both statutory qualifications for the role.","Step 2: Distinguish the secretary’s qualifications from those of other officers."],"boardTrap":"The treasurer’s residency rule does not replace the secretary’s combined rule.","citation":"RA 11232 Sec. 24"},{"id":"rfbt-033","subject":"RFBT","topic":"Corporate Governance","difficulty":"Easy","question":"What does the right of appraisal give a qualifying dissenting stockholder?","choices":["Right to demand payment of fair value of shares in specified fundamental actions","Right to veto every board decision","Right to be paid book value for any disagreement","Right to immediate dividends after complaints"],"correctIndex":0,"solutionSteps":["Step 1: Identify an action carrying appraisal rights.","Step 2: A qualifying dissent may seek value through the prescribed process."],"boardTrap":"A dissent on ordinary business does not automatically create appraisal rights.","citation":"RA 11232 Secs. 80–81"},{"id":"rfbt-034","subject":"RFBT","topic":"Corporate Governance","difficulty":"Moderate","question":"Directors knowingly approve a patently unlawful corporate act causing damage. Can they face personal civil liability under the Code?","choices":["No, corporate personality always protects them.","Only the external auditor can be liable.","Only if all shareholders also vote for it.","Yes, directors who knowingly vote for or assent to it may be jointly and severally liable."],"correctIndex":3,"solutionSteps":["Step 1: Check knowledge and the unlawful board act.","Step 2: The liability rule creates an exception to ordinary separateness."],"boardTrap":"Separate corporate personality does not immunize directors from their own specified misconduct.","citation":"RA 11232 Sec. 30"},{"id":"rfbt-035","subject":"RFBT","topic":"Corporate Governance","difficulty":"Moderate","question":"A director misses a board meeting but asks a cousin to vote for her as proxy. Can the cousin cast that board vote?","choices":["Yes using the shareholder proxy rule.","Yes if the management agenda is routine.","No. Directors cannot attend or vote by proxy at board meetings.","Yes because every absent director may delegate voting."],"correctIndex":2,"solutionSteps":["Step 1: Distinguish stockholder voting from board decision-making.","Step 2: Board directors vote personally, including permitted remote participation."],"boardTrap":"A shareholder proxy does not provide a model for board votes.","citation":"RA 11232 Secs. 52–53"},{"id":"rfbt-036","subject":"RFBT","topic":"Corporate Governance","difficulty":"Moderate","question":"A director diverts a corporate opportunity for personal profit without the required stockholder ratification. What is the usual remedy under the duty of loyalty?","choices":["Keep the profit merely by using personal funds.","Account for and refund the profit to the corporation.","Transfer half to the external auditor.","Pay shareholders only if they unanimously sue first."],"correctIndex":1,"solutionSteps":["Step 1: Identify an opportunity that should belong to the corporation.","Step 2: The director must account for the profit absent the specified ratification."],"boardTrap":"Financing the opportunity personally does not remove the duty.","citation":"RA 11232 Sec. 33"},{"id":"rfbt-037","subject":"RFBT","topic":"Corporate Governance","difficulty":"Moderate","question":"A stockholder votes against a qualifying disposition of substantially all assets. How long from the vote does the stockholder generally have to demand payment in writing?","choices":["10 days","30 days","60 days","90 days"],"correctIndex":1,"solutionSteps":["Step 1: Confirm a qualifying appraisal event and a dissenting vote.","Step 2: Make the written demand within 30 days from that vote."],"boardTrap":"Time runs from the vote rather than subsequent filing or payment.","citation":"RA 11232 Secs. 80–81"},{"id":"rfbt-038","subject":"RFBT","topic":"Corporate Governance","difficulty":"Difficult","question":"A director sells property to the corporation. Her presence was needed for quorum and her vote for approval. The terms are fair. For an ordinary corporation, how may the voidable deal be ratified under the cited rule?","choices":["By at least two-thirds of outstanding capital stock at a duly called meeting, with full disclosure and fair terms.","Automatically by performance because the terms were fair.","By a majority vote of directors including the interested director again.","By two-thirds of directors with no disclosure to stockholders."],"correctIndex":0,"solutionSteps":["Step 1: Her necessary presence and vote defeat the ordinary board safeguards.","Step 2: The statutory stockholder ratification path requires disclosure, fairness and the stated approval."],"boardTrap":"Economic fairness alone does not cure defective disinterested approval.","citation":"RA 11232 Sec. 31"},{"id":"rfbt-039","subject":"RFBT","topic":"Corporate Governance","difficulty":"Difficult","question":"Two ordinary corporations share a director. The director holds 30% of A and 5% of B. The contract is fair and free of fraud. Which treatment applies to B under the RCCP’s interlock rule?","choices":["Treat the contract as void in both corporations solely because of interlock.","No rule applies because any ownership in both corporations is equally substantial.","Apply the interested-director rule only to A.","Apply the interested-director rule insofar as B is concerned."],"correctIndex":3,"solutionSteps":["Step 1: An interest above 20% is substantial for this rule.","Step 2: Relatively nominal interest in B makes the cross-reference to Sec. 31 apply to B."],"boardTrap":"Do not apply the general safe rule for fair interlocking contracts without checking the ownership imbalance.","citation":"RA 11232 Sec. 32"},{"id":"rfbt-040","subject":"RFBT","topic":"Corporate Governance","difficulty":"Difficult","question":"A qualifying dissenter votes against an amendment, but first submits a written appraisal demand 45 days after the vote. No extension applies. Can it enforce appraisal by relying on timely dissent alone?","choices":["Yes. The dissenting vote is the written demand.","Yes. The period starts only at a judicial valuation.","No. Failure to make the written demand within 30 days generally waives appraisal.","Yes as long as a certificate is surrendered within 90 days."],"correctIndex":2,"solutionSteps":["Step 1: The vote satisfies the dissent component.","Step 2: The statute separately requires a timely written payment demand."],"boardTrap":"A right can be available on the merits and still be waived by skipping procedure.","citation":"RA 11232 Secs. 80–82"},{"id":"rfbt-041","subject":"RFBT","topic":"Negotiable Instruments","difficulty":"Easy","question":"Which core requirement concerns the promise or order in a negotiable instrument?","choices":["Permission to pay by delivering inventory instead","An express future condition based on profits","Unconditional promise or order to pay a sum certain in money","A promise to perform services only"],"correctIndex":2,"solutionSteps":["Step 1: Examine the undertaking on the face of the instrument.","Step 2: It must be unconditional and for a sum certain in money, with the other formal requisites."],"boardTrap":"A fixed monetary value of goods does not turn a goods-delivery promise into one to pay money.","citation":"Act No. 2031 Sec. 1"},{"id":"rfbt-042","subject":"RFBT","topic":"Negotiable Instruments","difficulty":"Easy","question":"How is a bearer instrument negotiated in the ordinary case?","choices":["Indorsement and registration with the SEC","Delivery","Assignment by public instrument only","Written notice to the drawee in every case"],"correctIndex":1,"solutionSteps":["Step 1: Identify payable-to-bearer status.","Step 2: Delivery alone negotiates the instrument."],"boardTrap":"Order instruments ordinarily need the holder’s indorsement and delivery.","citation":"Act No. 2031 Sec. 30"},{"id":"rfbt-043","subject":"RFBT","topic":"Negotiable Instruments","difficulty":"Easy","question":"Which fact defeats holder-in-due-course status if present at negotiation?","choices":["Notice of a defect in the transferor’s title","Giving value in good faith","Taking a facially complete instrument before maturity","Holding the instrument without prior notice of dishonor"],"correctIndex":0,"solutionSteps":["Step 1: Assess the holder’s good faith, value, timing, and notice.","Step 2: Knowledge of a title defect defeats the status."],"boardTrap":"Possession or proof of payment is insufficient without the remaining conditions.","citation":"Act No. 2031 Sec. 52"},{"id":"rfbt-044","subject":"RFBT","topic":"Negotiable Instruments","difficulty":"Moderate","question":"A signed note promises ₱300,000 one month after the maker receives a bank loan. The loan may never be approved. Is the stated payment time adequate for negotiability?","choices":["Yes. One month is a fixed period regardless of the event.","Yes if the amount is certain.","Yes if the loan eventually arrives.","No. The payment depends on a contingent event."],"correctIndex":3,"solutionSteps":["Step 1: Determine whether the triggering event is certain to occur.","Step 2: Loan approval is contingent, so later occurrence does not cure the defect."],"boardTrap":"A definite interval after an uncertain event still depends on the uncertainty.","citation":"Act No. 2031 Secs. 3 and 4"},{"id":"rfbt-045","subject":"RFBT","topic":"Negotiable Instruments","difficulty":"Moderate","question":"The owner physically delivers an instrument payable to her order for value without indorsing it. What does the transferee ordinarily acquire?","choices":["Completed negotiation as holder in due course on delivery alone","No rights of any kind","Automatic discharge of the maker","Title the transferor had and a right to obtain indorsement"],"correctIndex":3,"solutionSteps":["Step 1: An unindorsed order instrument is not yet negotiated as such.","Step 2: The transfer can still pass the transferor’s title and a right to indorsement."],"boardTrap":"Do not treat incomplete negotiation as no transfer at all.","citation":"Act No. 2031 Secs. 30 and 49"},{"id":"rfbt-046","subject":"RFBT","topic":"Negotiable Instruments","difficulty":"Moderate","question":"An order note is duly indorsed with only the holder’s signature and delivered. No restrictiveness applies. How is it then described?","choices":["Restrictively indorsed to the maker","Specially indorsed to an unnamed bank","Indorsed in blank and payable to bearer","Nonnegotiable until notarized"],"correctIndex":2,"solutionSteps":["Step 1: An indorsement naming no indorsee is in blank.","Step 2: The instrument may then be negotiated by delivery."],"boardTrap":"A signature can have legal effect even without the recipient’s name.","citation":"Act No. 2031 Secs. 9 and 34"},{"id":"rfbt-047","subject":"RFBT","topic":"Negotiable Instruments","difficulty":"Moderate","question":"A written note otherwise meets the formal requisites and merely states that it arose from a machinery sale. Does that reference by itself make the promise conditional?","choices":["Yes, any mention of a transaction destroys negotiability.","No, a statement of the underlying transaction alone does not make it conditional.","Yes unless the seller releases its warranty.","No, because conditions are irrelevant to negotiability."],"correctIndex":1,"solutionSteps":["Step 1: Distinguish a descriptive reference from language conditioning payment on another contract.","Step 2: A mere recital does not make the promise conditional."],"boardTrap":"A promise expressly payable only out of a designated fund would pose a different problem.","citation":"Act No. 2031 Secs. 3 and 5"},{"id":"rfbt-048","subject":"RFBT","topic":"Negotiable Instruments","difficulty":"Difficult","question":"A genuine order instrument is moved through a forged payee indorsement. A later purchaser gave value and lacked notice. The party charged is not precluded from raising forgery. Does the purchaser acquire rights through the forged signature?","choices":["No. The forged signature is generally wholly inoperative.","Yes, because good faith always cures forgery.","Yes, if the market rate was paid.","Yes against the party charged solely because the instrument was regular on its face."],"correctIndex":0,"solutionSteps":["Step 1: Identify that title depends on a forged necessary signature.","Step 2: Apply the forgery rule and check whether the party is precluded from raising it."],"boardTrap":"Holder-in-due-course protection does not automatically cure a forged chain of title.","citation":"Act No. 2031 Secs. 23 and 57"},{"id":"rfbt-049","subject":"RFBT","topic":"Negotiable Instruments","difficulty":"Difficult","question":"A negotiable note’s principal is materially raised from ₱100,000 to ₱150,000 without authority. A holder in due course was not party to the alteration. How much can that holder generally enforce against the original maker under the exception?","choices":["₱100,000 according to the original tenor","₱150,000 because the holder is innocent","₱0 because material alteration always bars every remedy","₱50,000 equal to the unauthorized increase"],"correctIndex":0,"solutionSteps":["Step 1: Changing the sum is material.","Step 2: A qualifying innocent holder may enforce the instrument according to original tenor."],"boardTrap":"Innocence protects enforcement of original terms, rather than the unauthorized increase.","citation":"Act No. 2031 Secs. 124–125"},{"id":"rfbt-050","subject":"RFBT","topic":"Negotiable Instruments","difficulty":"Difficult","question":"A maker asserts ordinary failure of consideration. A duly negotiated purchaser before maturity gave value in good faith and had no notice. The instrument was facially regular. Can the maker generally assert that personal defense against the purchaser?","choices":["Yes, any defense against the original payee also binds the holder in due course.","Yes, unless the holder paid face value in full.","Yes, because negotiation never improves the holder’s position.","No. A holder in due course takes free from that personal defense."],"correctIndex":3,"solutionSteps":["Step 1: Check all holder-in-due-course elements.","Step 2: Ordinary failure of consideration is a personal defense cut off against that holder."],"boardTrap":"Do not equate personal defenses with real defenses such as forgery under the appropriate facts.","citation":"Act No. 2031 Secs. 52, 57–58"},{"id":"rfbt-051","subject":"RFBT","topic":"Anti-Money Laundering","difficulty":"Easy","question":"Which institution is ordinarily a covered person under the AMLA?","choices":["Every customer who holds a bank account","Every retail shop merely by accepting cash","A bank supervised by the BSP","A private person making a single household purchase"],"correctIndex":2,"solutionSteps":["Step 1: Identify the regulated entity handling the transaction.","Step 2: Banks are within the covered-person category."],"boardTrap":"A bank customer and the regulated reporting entity have different roles.","citation":"RA 10365 Sec. 1, amending RA 9160 Sec. 3(a)"},{"id":"rfbt-052","subject":"RFBT","topic":"Anti-Money Laundering","difficulty":"Easy","question":"To which body do covered institutions report covered and suspicious transactions?","choices":["Bureau of Internal Revenue only","Anti-Money Laundering Council","Local treasurer","Securities exchange only"],"correctIndex":1,"solutionSteps":["Step 1: Identify the designated AML authority.","Step 2: Covered and suspicious transaction reports go to AMLC."],"boardTrap":"A prudential regulator is not a substitute recipient for the statutory report.","citation":"RA 9160 Sec. 7, as amended"},{"id":"rfbt-053","subject":"RFBT","topic":"Anti-Money Laundering","difficulty":"Easy","question":"Can suspicious transactions exist below a covered-transaction monetary threshold?","choices":["No, both categories use the same minimum.","Yes, suspicious classification is based on statutory circumstances regardless of amount.","Only where the transaction is already subject to a final conviction.","Only for a publicly listed bank."],"correctIndex":1,"solutionSteps":["Step 1: Distinguish amount-based coverage from suspicion indicators.","Step 2: A small amount does not remove the duty to assess suspicious circumstances."],"boardTrap":"A threshold for one reporting category is not a safe harbor from the other.","citation":"RA 9194 Sec. 2, amending RA 9160 Sec. 3(b-1)"},{"id":"rfbt-054","subject":"RFBT","topic":"Anti-Money Laundering","difficulty":"Moderate","question":"A bank considers opening a new account for a person whose identity cannot be verified and who insists on an anonymous account. Which policy is consistent with the law?","choices":["Require proper customer identification and do not open the anonymous account.","Open it if a manager knows the person’s nickname.","Allow anonymity for any account that begins with a low balance.","Replace identification with a verbal promise to provide it someday."],"correctIndex":0,"solutionSteps":["Step 1: Verify the customer’s true identity under the required process.","Step 2: Anonymous accounts are prohibited under the customer-identification rule."],"boardTrap":"Commercial pressure and low balances do not remove identification duties.","citation":"RA 9160 Sec. 9(a), as amended"},{"id":"rfbt-055","subject":"RFBT","topic":"Anti-Money Laundering","difficulty":"Moderate","question":"A bank is redesigning retention for ordinary completed transaction records. What statutory baseline is relevant, subject to longer requirements in applicable cases?","choices":["Keep only until the next monthly statement.","Keep for five years from opening a customer’s first account only.","Destroy records when a customer receives a copy.","Keep records for five years from the transaction date."],"correctIndex":3,"solutionSteps":["Step 1: Identify transaction records as distinct from the closed-account record rule.","Step 2: The minimum is five years from transaction dates under the cited provision."],"boardTrap":"Different triggering dates apply to different record categories.","citation":"RA 9160 Sec. 9(b), as amended by RA 9194"},{"id":"rfbt-056","subject":"RFBT","topic":"Anti-Money Laundering","difficulty":"Moderate","question":"A relationship manager plans to tell a customer that the bank filed a suspicious report. Is this permissible in the ordinary case?","choices":["Yes, after the report is accepted.","Yes, an account holder always has a right to be alerted first.","No. The reporting confidentiality rule prohibits disclosure of that fact.","Yes if the report has not led to charges."],"correctIndex":2,"solutionSteps":["Step 1: Apply confidentiality to the fact and contents of reporting.","Step 2: Do not tip off the customer about the report."],"boardTrap":"A customer’s general account access does not include disclosure of AML reporting.","citation":"RA 9160 Sec. 9(c), as amended"},{"id":"rfbt-057","subject":"RFBT","topic":"Anti-Money Laundering","difficulty":"Moderate","question":"A transaction is both covered and suspicious under the applicable rules. Which report classification does the Act specify?","choices":["Covered transaction only","No report because the categories cancel each other","Suspicious transaction","Two unconditional reports regardless of the statutory priority"],"correctIndex":2,"solutionSteps":["Step 1: Compare the categories against Sec. 9(c). Use its specific overlap rule.","Step 2: Report the transaction as suspicious under the cited statutory rule."],"boardTrap":"Treat the overlap explicitly instead of assuming covered status displaces suspicion.","citation":"RA 9160 Sec. 9(c), as amended by RA 9194"},{"id":"rfbt-058","subject":"RFBT","topic":"Anti-Money Laundering","difficulty":"Difficult","question":"On AMLC’s verified ex parte petition in an ordinary freeze case, who may issue the order on probable cause and what initial period applies?","choices":["AMLC acting alone in every ordinary case, indefinitely","Court of Appeals, effective immediately for 20 days pending summary hearing","The bank’s board for 30 days as a judicial order","Regional trial court for five years automatically"],"correctIndex":1,"solutionSteps":["Step 1: Identify the ordinary judicial pathway as distinguished from special cases.","Step 2: The Court of Appeals issues the immediate 20-day order and conducts a hearing within that period."],"boardTrap":"An internal account hold and statutory judicial freeze are distinct.","citation":"RA 9160 Sec. 10, as amended by RA 11521 Sec. 2"},{"id":"rfbt-059","subject":"RFBT","topic":"Anti-Money Laundering","difficulty":"Difficult","question":"A compliance officer files a required report in good faith in ordinary performance of duty. A client sues solely because the report was made. What statutory protection is relevant?","choices":["The good-faith reporting safe harbor","Automatic liability for disclosure of any bank information","Complete immunity for unrelated misconduct","A requirement that the client consent before filing"],"correctIndex":0,"solutionSteps":["Step 1: Identify a good-faith report in performance of duties.","Step 2: Apply protection to the making of the required report."],"boardTrap":"The safe harbor does not immunize separate bad faith or tipping off.","citation":"RA 9160 Sec. 9(c), as amended"},{"id":"rfbt-060","subject":"RFBT","topic":"Anti-Money Laundering","difficulty":"Difficult","question":"A bank reports suspicious activity. Management assumes reporting automatically forfeits the account and proves laundering. Which position is sound?","choices":["Filing a report permanently transfers the funds to the bank.","The report itself establishes criminal guilt.","An AML report is equivalent to a final court judgment.","The report is a compliance duty, while forfeiture and findings require their separate legal processes."],"correctIndex":3,"solutionSteps":["Step 1: Distinguish reporting from AMLC investigation and judicial processes.","Step 2: A report neither establishes guilt nor automatically orders forfeiture."],"boardTrap":"Suspicion is a reporting trigger, not a final finding of unlawful conduct.","citation":"RA 9160 Secs. 7 and 9, as amended"},{"id":"rfbt-061","subject":"RFBT","topic":"Data Privacy","difficulty":"Easy","question":"What principles govern ordinary personal-data processing alongside statutory requirements?","choices":["Secrecy, indefinite retention and unrestricted reuse","Confidentiality, future usefulness and unlimited retention","Consent, resale and unannounced disclosure","Transparency, legitimate purpose and proportionality"],"correctIndex":3,"solutionSteps":["Step 1: Check purpose, notice and the amount of information processed.","Step 2: Apply the three statutory principles together."],"boardTrap":"A legitimate activity can still collect or retain more than necessary.","citation":"RA 10173 Sec. 11"},{"id":"rfbt-062","subject":"RFBT","topic":"Data Privacy","difficulty":"Easy","question":"Who is a personal information processor in a typical outsourcing arrangement?","choices":["Every employee whose data are collected","The organization deciding why data will be collected, in every capacity","The service provider processing personal data on the controller’s instructions","The National Privacy Commission acting as regulator"],"correctIndex":2,"solutionSteps":["Step 1: Distinguish deciding the purpose from processing on another’s behalf.","Step 2: Apply processor duties alongside the controller’s continuing accountability."],"boardTrap":"The party supplying software or storage does not automatically control purposes.","citation":"RA 10173 Secs. 3 and 14"},{"id":"rfbt-063","subject":"RFBT","topic":"Data Privacy","difficulty":"Easy","question":"Which right lets a data subject challenge an inaccurate entry?","choices":["Delete every financial record regardless of legal duties","Dispute and obtain correction, subject to statutory conditions","Reject any statutory record audit","Edit every employee file held by the controller"],"correctIndex":1,"solutionSteps":["Step 1: Identify the data subject and inaccurate personal information.","Step 2: Apply the statutory correction rule unless the request is vexatious or otherwise unreasonable."],"boardTrap":"Correction is different from a universal right to erase accurate lawful records.","citation":"RA 10173 Sec. 16(d)"},{"id":"rfbt-064","subject":"RFBT","topic":"Data Privacy","difficulty":"Moderate","question":"A service removes names but retains stable identifiers and a key allowing the firm to match every record to a person. Is the retained information personal?","choices":["Yes, identities remain reasonably ascertainable.","No, name removal always anonymizes information.","Only if every record also contains a phone number.","No, coded data can never identify people."],"correctIndex":0,"solutionSteps":["Step 1: Assess identification in combination with relevant other information.","Step 2: The key permits reidentification."],"boardTrap":"Pseudonymized records can remain personal information.","citation":"RA 10173 Sec. 3(g)"},{"id":"rfbt-065","subject":"RFBT","topic":"Data Privacy","difficulty":"Moderate","question":"A delivery firm needs the address of its customer to perform an agreed delivery. Which lawful basis may apply to ordinary personal information?","choices":["Necessity for contract performance","An unconditional right to sell the address to marketers","No lawful basis except consent under all circumstances","An exemption from all privacy obligations"],"correctIndex":0,"solutionSteps":["Step 1: Check whether the processing is necessary for the customer’s contract.","Step 2: The contract basis can support that use while safeguards and other principles remain."],"boardTrap":"A lawful basis for delivery does not extend automatically to advertising.","citation":"RA 10173 Sec. 12(b)"},{"id":"rfbt-066","subject":"RFBT","topic":"Data Privacy","difficulty":"Moderate","question":"A payroll processor holds personnel files under a service agreement. Who must ensure the outsourced processor implements required safeguards?","choices":["The data subjects assume it by receiving salary.","Only the payroll processor’s bank.","No one once a vendor is paid.","The personal information controller retains that responsibility."],"correctIndex":3,"solutionSteps":["Step 1: Determine whether outsourcing leaves accountability with the controller.","Step 2: The controller must ensure the processor implements safeguards."],"boardTrap":"Delegating operations does not transfer all statutory responsibility.","citation":"RA 10173 Secs. 14 and 20(d)"},{"id":"rfbt-067","subject":"RFBT","topic":"Data Privacy","difficulty":"Moderate","question":"An employee requests reasonable access to the sources of personal data processed about them. Is the request within the statutory access right, subject to applicable conditions?","choices":["No, access is limited to the person’s name.","Yes, including unrelated staff records in all cases.","Yes, sources are included in reasonable access.","No, only the controller’s identity is covered."],"correctIndex":2,"solutionSteps":["Step 1: Match the request to the list of access information.","Step 2: Sources of the requester’s personal data fall within the list."],"boardTrap":"Access relates to the requester’s data, not all personnel files.","citation":"RA 10173 Sec. 16(c)"},{"id":"rfbt-068","subject":"RFBT","topic":"Data Privacy","difficulty":"Difficult","question":"An employer needs an ordinary work email to perform a service contract and separately wants to process detailed health records. Does the contract basis for the email automatically authorize the medical records?","choices":["Yes, the same contract basis applies to every data category.","No. Assess the separate conditions applicable to sensitive personal information.","Yes if the information is useful for future analytics.","No because all medical data are forbidden in all circumstances."],"correctIndex":1,"solutionSteps":["Step 1: Identify health data as sensitive personal information.","Step 2: Test the separate exceptions under Sec. 13 rather than borrowing the ordinary-data basis."],"boardTrap":"Different categories of information can require different lawful grounds.","citation":"RA 10173 Secs. 12 and 13"},{"id":"rfbt-069","subject":"RFBT","topic":"Data Privacy","difficulty":"Difficult","question":"A controller reasonably believes an outsider acquired sensitive personal data and that the acquisition is likely to create a real risk of serious harm. What response is generally required?","choices":["Notify only its direct supervisor and close the incident.","Promptly notify the Commission and affected data subjects, subject to statutory provisions.","Wait for a final court judgment in every case.","Publish all compromised records to prove the breach."],"correctIndex":1,"solutionSteps":["Step 1: Test unauthorized acquisition and real serious-harm criteria.","Step 2: Notify the required recipients under the prescribed process."],"boardTrap":"Do not confuse notifying affected people with publicly disclosing the compromised contents.","citation":"RA 10173 Sec. 20(f)"},{"id":"rfbt-070","subject":"RFBT","topic":"Data Privacy","difficulty":"Difficult","question":"A former customer requests erasure of a record whose retention is currently required by a valid statute. What should the controller do on the stated facts?","choices":["Retain required data for the statutory period and restrict unrelated use.","Erase immediately on every request.","Retain all unrelated marketing data forever.","Send the records to all affiliates because retention is required."],"correctIndex":0,"solutionSteps":["Step 1: Separate mandatory retention from optional continued use.","Step 2: Maintain only what the law requires and apply the applicable restrictions."],"boardTrap":"A legal retention duty is neither overridden by a bare request nor a license for unrestricted processing.","citation":"RA 10173 Sec. 11(e) and Sec. 16(e)"},{"id":"rfbt-071","subject":"RFBT","topic":"Rehabilitation & Insolvency","difficulty":"Easy","question":"What is the economic purpose of rehabilitation under FRIA?","choices":["Cancel every debt as soon as a petition is filed.","Transfer all assets to the first secured creditor.","Keep every insolvent debtor operating indefinitely.","Restore viable operations when continuation improves creditors’ present-value recovery compared with immediate liquidation."],"correctIndex":3,"solutionSteps":["Step 1: Assess economic feasibility of continuation.","Step 2: Compare creditors’ expected present-value recovery with immediate liquidation."],"boardTrap":"Rehabilitation is not an entitlement to continue regardless of viability.","citation":"RA 10142 Sec. 4"},{"id":"rfbt-072","subject":"RFBT","topic":"Rehabilitation & Insolvency","difficulty":"Easy","question":"What normally happens to pending enforcement of claims against the debtor upon a valid stay order?","choices":["Every debt is automatically extinguished.","All creditors can continue independent collection.","Enforcement is suspended, subject to statutory exceptions.","Claims transfer to the debtor’s auditor."],"correctIndex":2,"solutionSteps":["Step 1: Distinguish suspension of enforcement from cancellation.","Step 2: Apply stated exceptions if supported by facts."],"boardTrap":"A stay coordinates proceedings rather than releasing liability.","citation":"RA 10142 Secs. 16–17"},{"id":"rfbt-073","subject":"RFBT","topic":"Rehabilitation & Insolvency","difficulty":"Easy","question":"Who is appointed by the court to perform the rehabilitation receiver’s role?","choices":["Automatically the petitioner’s majority shareholder","Automatically the oldest creditor","An eligible rehabilitation receiver","Any accountant chosen only by management"],"correctIndex":2,"solutionSteps":["Step 1: Check the Commencement Order for appointment.","Step 2: The appointed receiver performs statutory functions under court supervision."],"boardTrap":"Being an interested party does not itself establish appointment.","citation":"RA 10142 Secs. 16 and 31"},{"id":"rfbt-074","subject":"RFBT","topic":"Rehabilitation & Insolvency","difficulty":"Moderate","question":"A supplier’s pre-commencement invoice remains unpaid. No exception applies. Can it continue a pending ordinary action to enforce the claim against the debtor during the stay?","choices":["Yes because ending the suit would be unfair.","No, the enforcement action is generally suspended.","Yes because the invoice was issued before the order.","No, because the receivable is permanently erased."],"correctIndex":1,"solutionSteps":["Step 1: Identify a pre-commencement claim and an action against the debtor.","Step 2: Suspend enforcement during the stay unless an exception applies."],"boardTrap":"The stay covers enforcement of earlier claims without extinguishing them.","citation":"RA 10142 Sec. 16(q)"},{"id":"rfbt-075","subject":"RFBT","topic":"Rehabilitation & Insolvency","difficulty":"Moderate","question":"A creditor seeks to enforce against a surety solidarily liable with the debtor, with no relevant third-party mortgage complication. Does the ordinary stay protect the surety?","choices":["No, enforcement against such a surety is an exception.","Yes automatically because the debtor filed first.","Yes unless all creditors approve.","Only if the debt originated after commencement."],"correctIndex":0,"solutionSteps":["Step 1: Identify the party against whom enforcement is directed.","Step 2: Apply the stated exception for sureties and solidarily liable persons."],"boardTrap":"The debtor’s protection does not extend indiscriminately to all related parties.","citation":"RA 10142 Sec. 18(c)"},{"id":"rfbt-076","subject":"RFBT","topic":"Rehabilitation & Insolvency","difficulty":"Moderate","question":"After commencement, a pre-existing creditor attempts an ordinary unilateral setoff of a debt it owes the debtor. No exception applies. What effect can the order have?","choices":["It automatically makes setoff preferred.","It requires all other creditors to follow the setoff.","It approves the transaction if the two amounts are equal.","It provides the legal basis to render the post-commencement setoff void."],"correctIndex":3,"solutionSteps":["Step 1: Fix the timing of the asserted setoff.","Step 2: Apply the commencement-order effect against post-commencement setoff."],"boardTrap":"Reciprocity alone does not overcome rehabilitation-specific rules.","citation":"RA 10142 Sec. 17(c)"},{"id":"rfbt-077","subject":"RFBT","topic":"Rehabilitation & Insolvency","difficulty":"Moderate","question":"The debtor wants to sell a retired delivery fleet outside the ordinary course during the stay without court authority. What restriction applies?","choices":["All asset sales are automatically authorized.","The debtor may dispose freely once it publishes the order.","Only cash transactions are restricted, so the sale is allowed.","The stay generally prohibits such disposal outside the ordinary course."],"correctIndex":3,"solutionSteps":["Step 1: Distinguish ordinary-course operation from extraordinary disposal.","Step 2: The order restricts this transfer unless authorized under the Act."],"boardTrap":"The ability to continue ordinary operations does not permit extraordinary asset stripping.","citation":"RA 10142 Sec. 16(q)(3)"},{"id":"rfbt-078","subject":"RFBT","topic":"Rehabilitation & Insolvency","difficulty":"Difficult","question":"As of commencement, a civil appeal against the debtor is already pending in the Supreme Court. Separately, a criminal action is pending against one director. Which does the stay suspend under the stated exceptions?","choices":["Both because they concern the debtor.","Only the criminal action against the director.","Neither. A final executory judgment from the civil appeal is referred to the rehabilitation court as provided.","Only the appeal because it began before commencement."],"correctIndex":2,"solutionSteps":["Step 1: Check each against the express exceptions for pending Supreme Court appeals and specified criminal actions.","Step 2: Observe the separate referral rule for an eventual final civil judgment."],"boardTrap":"Proceeding in court and collecting the resulting judgment are separate questions.","citation":"RA 10142 Sec. 18(a) and (g)"},{"id":"rfbt-079","subject":"RFBT","topic":"Rehabilitation & Insolvency","difficulty":"Difficult","question":"A creditor seeks foreclosure of property owned by an accommodation mortgagor. The rehabilitation court, on the receiver’s recommendation, determines the property necessary to rehabilitation. Does the standard third-party mortgage exception automatically allow foreclosure?","choices":["Yes, third-party ownership alone always defeats the stay.","No, the necessity determination triggers the statutory qualification.","Yes, the receiver alone cannot affect foreclosure even after court determination.","No, because every third-party mortgage is permanently extinguished."],"correctIndex":1,"solutionSteps":["Step 1: Start with the general exception for third-party or accommodation mortgagors.","Step 2: Apply the court-determined necessity proviso on the given facts."],"boardTrap":"Do not stop reading after the general exception.","citation":"RA 10142 Sec. 18(c)"},{"id":"rfbt-080","subject":"RFBT","topic":"Rehabilitation & Insolvency","difficulty":"Difficult","question":"After commencement a creditor, with no statutory exception, attempts extrajudicial seizure of the debtor’s machine and perfection of a new lien on it. Which statement fits?","choices":["The order can nullify both post-commencement enforcement and lien perfection.","The seizure is barred but lien perfection is always valid.","Both are unaffected because no lawsuit was filed.","Both automatically become administrative expenses."],"correctIndex":0,"solutionSteps":["Step 1: Check when each action occurred and whether the asset belongs to the debtor.","Step 2: The statute addresses extrajudicial enforcement and post-commencement lien perfection separately."],"boardTrap":"Unilateral action outside court is not a way around the order.","citation":"RA 10142 Sec. 17(b), (d) and Sec. 18"},{"id":"rfbt-081","subject":"RFBT","topic":"Cooperatives","difficulty":"Easy","question":"What is the ordinary minimum number of qualified Filipino natural persons to organize a primary cooperative?","choices":["15","5","10","25"],"correctIndex":0,"solutionSteps":["Step 1: Identify a primary cooperative.","Step 2: The statute requires at least 15 qualifying organizers."],"boardTrap":"Other entity incorporation rules do not govern cooperative membership.","citation":"RA 9520 Art. 10"},{"id":"rfbt-082","subject":"RFBT","topic":"Cooperatives","difficulty":"Easy","question":"How many votes does a regular voting member of a primary cooperative ordinarily have?","choices":["One per paid-up share","Two if a founder","Up to five incentive votes by default","One"],"correctIndex":3,"solutionSteps":["Step 1: Apply democratic member voting.","Step 2: Paid-up capital is not multiplied into votes."],"boardTrap":"Do not import a corporation’s per-share model or the secondary cooperative rule.","citation":"RA 9520 Art. 36"},{"id":"rfbt-083","subject":"RFBT","topic":"Cooperatives","difficulty":"Easy","question":"What voting entitlement does an associate member ordinarily have before conversion to regular membership?","choices":["One vote and eligibility for office automatically","Half a vote based on capital","No right to vote or be voted upon","Votes only when a dividend is declared"],"correctIndex":2,"solutionSteps":["Step 1: Classify the member as regular or associate.","Step 2: The associate’s bylaw privileges do not override the statutory voting restriction."],"boardTrap":"Patronage is compatible with associate status and does not instantly confer voting rights.","citation":"RA 9520 Art. 26"},{"id":"rfbt-084","subject":"RFBT","topic":"Cooperatives","difficulty":"Moderate","question":"An ordinary nonelectric, nonbank cooperative has 240 members entitled to vote. What minimum attendance meets the statutory quorum threshold?","choices":["61","60","120","12"],"correctIndex":1,"solutionSteps":["Step 1: Take 25% of all members entitled to vote.","Step 2: 240 × .25 = 60, and the rule says at least that amount."],"boardTrap":"The applicable base is voting members, and exactly one quarter meets the minimum.","citation":"RA 9520 Art. 35"},{"id":"rfbt-085","subject":"RFBT","topic":"Cooperatives","difficulty":"Moderate","question":"A cooperative in its third year after registration has net surplus of ₱600,000. The reserve-fund excess rule is inapplicable. What minimum reserve allocation normally applies?","choices":["₱60,000","₱300,000","₱30,000","₱18,000"],"correctIndex":1,"solutionSteps":["Step 1: Check the first-five-year requirement.","Step 2: Allocate at least 50% of ₱600,000 = ₱300,000."],"boardTrap":"The ordinary 10% reserve rate does not apply during the stated early period.","citation":"RA 9520 Art. 86(1)"},{"id":"rfbt-086","subject":"RFBT","topic":"Cooperatives","difficulty":"Moderate","question":"A proposed articles amendment has 132 favorable votes out of 180 members with voting rights. All other requirements are met. Does it meet the voting threshold?","choices":["Yes. Two-thirds of all voting members is 120.","No. Three-fourths of all voting members is required.","No. Unanimity is required.","Yes only because more than half of those present voted in favor."],"correctIndex":0,"solutionSteps":["Step 1: Use the article-amendment threshold of two-thirds of eligible members.","Step 2: 132 exceeds 120."],"boardTrap":"Merger and division voting rules cannot be substituted for amendment.","citation":"RA 9520 Art. 18"},{"id":"rfbt-087","subject":"RFBT","topic":"Cooperatives","difficulty":"Moderate","question":"An associate now meets all minimum regular membership requirements, has patronized the cooperative continuously for two years, and signifies intention to remain. What status follows under the statutory conditions?","choices":["Associate forever unless the cooperative becomes a corporation","Automatic director without election","Nonmember because two years elapsed","Regular member"],"correctIndex":3,"solutionSteps":["Step 1: Apply all three conditions in the proviso.","Step 2: On the stated facts the associate is considered a regular member."],"boardTrap":"Duration of membership alone is insufficient without qualifications and expressed intent.","citation":"RA 9520 Art. 26"},{"id":"rfbt-088","subject":"RFBT","topic":"Cooperatives","difficulty":"Difficult","question":"A cooperative has 160 voting members. At a properly convened separate merger meeting, 120 are present and 92 approve. The other constituent meets its threshold. Does this cooperative meet the merger vote requirement?","choices":["No. Two-thirds of all 160 is always required.","No. Three-fourths of all 160 must vote in favor at a merger meeting.","Yes. 92 meets three-fourths of the 120 present and constituting a quorum.","Yes because 50% of those present suffices."],"correctIndex":2,"solutionSteps":["Step 1: Check quorum and the merger rule distinct from charter amendment.","Step 2: Three-fourths of 120 is 90, and 92 voted in favor."],"boardTrap":"Article 18 uses a different denominator for amendments.","citation":"RA 9520 Arts. 18, 21 and 35"},{"id":"rfbt-089","subject":"RFBT","topic":"Cooperatives","difficulty":"Difficult","question":"In year three, a cooperative earns ₱1 million surplus. It allocates the minimum reserve, the maximum education and training fund, minimum community fund, and no optional fund. No exception applies. How much remains before allocating member returns?","choices":["₱770,000","₱400,000","₱370,000","₱500,000"],"correctIndex":2,"solutionSteps":["Step 1: Reserve ₱500,000, education ₱100,000 and community ₱30,000.","Step 2: Deduct ₱630,000 from surplus, leaving ₱370,000."],"boardTrap":"Do not use the default reserve rate or omit the community minimum.","citation":"RA 9520 Art. 86(1)–(4)"},{"id":"rfbt-090","subject":"RFBT","topic":"Cooperatives","difficulty":"Difficult","question":"When dissolving a cooperative, may members allocate the statutory reserve fund among themselves as an extra return on shares?","choices":["Yes after paying all creditors.","No. The reserve fund is not distributed among members on dissolution.","Yes if a simple majority agrees.","Yes at least in proportion to share capital."],"correctIndex":1,"solutionSteps":["Step 1: Segregate the statutory reserve from members’ capital claims.","Step 2: Apply the specific disposition rule for the reserve upon dissolution."],"boardTrap":"A residual balance need not be a distributable member asset.","citation":"RA 9520 Art. 86(1)(c)"},{"id":"rfbt-091","subject":"RFBT","topic":"Ease of Doing Business","difficulty":"Easy","question":"Where should a covered agency state documentary requirements, fees, and the steps and processing period for its services?","choices":["Citizen’s Charter","An unpublished internal memo","A private employee chat","An oral instruction from a fixer"],"correctIndex":0,"solutionSteps":["Step 1: The published service standard gives requirements and timelines.","Step 2: Use the Citizen’s Charter to identify the applicable published procedure."],"boardTrap":"Unofficial instructions do not establish required documents.","citation":"RA 11032 Sec. 6"},{"id":"rfbt-092","subject":"RFBT","topic":"Ease of Doing Business","difficulty":"Easy","question":"For an ordinary simple complete application, what is the initial general maximum processing period absent a lawful exception?","choices":["Three calendar days","Seven working days","Twenty working days","Three working days"],"correctIndex":3,"solutionSteps":["Step 1: Classify the transaction as simple.","Step 2: Apply the working-day limit stated by law, subject to a shorter prescribed time."],"boardTrap":"Seven days is for ordinary complex processing.","citation":"RA 11032 Sec. 9(b)(1)"},{"id":"rfbt-093","subject":"RFBT","topic":"Ease of Doing Business","difficulty":"Easy","question":"How many signatories may a covered agency ordinarily require on a document under the cited rule?","choices":["At least three","Up to seven","As many as there are departments","At most three"],"correctIndex":3,"solutionSteps":["Step 1: Count the required direct supervisory approvals.","Step 2: The rule caps signatories at three, with alternate arrangements where applicable."],"boardTrap":"The maximum does not require filling all three slots.","citation":"RA 11032 Sec. 9(d)"},{"id":"rfbt-094","subject":"RFBT","topic":"Ease of Doing Business","difficulty":"Moderate","question":"The Charter allows seven working days for a complex filing. A complete application arrives Monday morning and no special rule applies. May the office use a default 20-working-day initial deadline because it is busy?","choices":["Yes. Every agency may use 20 days by default.","Yes if staff cite workload orally without any compliant extension.","No. Ordinary complex processing uses the applicable seven-working-day maximum.","No. All applications must be decided in one day."],"correctIndex":2,"solutionSteps":["Step 1: Apply the complex time limit from receipt of a complete application.","Step 2: Do not substitute the highly technical ceiling merely for internal workload."],"boardTrap":"Transaction category and a compliant extension are separate questions.","citation":"RA 11032 Sec. 9(b)(1)"},{"id":"rfbt-095","subject":"RFBT","topic":"Ease of Doing Business","difficulty":"Moderate","question":"An officer denies a permit by phone without written reasons or identifying the decision maker. What formal response does the law require?","choices":["A phone call alone in all cases","Written explanation stating the grounds and identifying the person making the denial","Private advice to refile with no explanation","A receipt confirming full approval instead"],"correctIndex":1,"solutionSteps":["Step 1: A denial must go through prescribed notice.","Step 2: Provide it in writing with grounds and the responsible person’s name."],"boardTrap":"Meeting a time limit does not excuse a deficient form of denial.","citation":"RA 11032 Sec. 9(b)(2) and (c)"},{"id":"rfbt-096","subject":"RFBT","topic":"Ease of Doing Business","difficulty":"Moderate","question":"A city asks each municipal department to collect a separate new business application with repeated fields. What statutory design addresses this duplication?","choices":["Unified business application and one-stop processing","Mandatory separate applications for each city department","An SEC share subscription in place of business forms","An informal oral application accepted by each department"],"correctIndex":0,"solutionSteps":["Step 1: Use the single form gathering relevant departmental requirements.","Step 2: Process related applications through the local one-stop arrangement."],"boardTrap":"Streamlining consolidates submissions without erasing substantive applicable requirements.","citation":"RA 11032 Sec. 11(a)–(b)"},{"id":"rfbt-097","subject":"RFBT","topic":"Ease of Doing Business","difficulty":"Moderate","question":"Two covered agencies can retrieve the same record from the Philippine Business Databank. The applicant already submitted it to the first agency. What is the ordinary rule for the second?","choices":["Do not require duplicate submission. Retrieve and crosscheck it through the databank.","Request the same record again every time.","Refuse to process the request unless a notarized original is resubmitted.","Demand an unrelated new record instead."],"correctIndex":0,"solutionSteps":["Step 1: Check availability and access to the common databank.","Step 2: Reuse the existing records under the statutory rule."],"boardTrap":"Access to the shared system is a material part of the premise.","citation":"RA 11032 Sec. 14"},{"id":"rfbt-098","subject":"RFBT","topic":"Ease of Doing Business","difficulty":"Difficult","question":"A complete original permit request with all fees paid remains undecided beyond its prescribed period. No valid extension or exception applies. What documents can substantiate automatic approval under the statute?","choices":["An unpaid application form alone","The applicant’s verbal statement without filing proof","An official payment receipt alone in all circumstances","The acknowledgment receipt plus the official receipt for all required fees"],"correctIndex":3,"solutionSteps":["Step 1: Check completeness, payment and expiration of the period.","Step 2: Read the statutory combined proof rule for automatic approval."],"boardTrap":"Agency silence alone is insufficient if documents or required fees were missing.","citation":"RA 11032 Secs. 9 and 10"},{"id":"rfbt-099","subject":"RFBT","topic":"Ease of Doing Business","difficulty":"Difficult","question":"A business timely files a complete renewal with all required fees. The agency takes no action within the prescribed period, and no exception applies. What follows under the renewal rule?","choices":["The existing permit automatically becomes an original new license.","It is automatically denied.","The existing permit is automatically extended.","No action is possible until indefinite review ends."],"correctIndex":2,"solutionSteps":["Step 1: Distinguish renewal from an original request.","Step 2: Agency inaction can automatically extend the existing authorization."],"boardTrap":"The statute uses different effects for original applications and renewals.","citation":"RA 11032 Sec. 10"},{"id":"rfbt-100","subject":"RFBT","topic":"Ease of Doing Business","difficulty":"Difficult","question":"An ordinary highly technical application has a 12-working-day Charter deadline. The agency tries to extend it on day 13 and only notifies the applicant after the initial deadline. Is this an ordinary valid extension under the stated rule?","choices":["Yes. Twenty working days always replaces the shorter Charter period.","No. It must be justified and communicated in writing before the initial deadline lapses.","Yes. Written notice is never required if the application is highly technical.","Yes. The officer can backdate the notice to cure the lapse."],"correctIndex":1,"solutionSteps":["Step 1: Use the shorter applicable deadline and verify the advance notice conditions.","Step 2: Late notice cannot satisfy the statutory extension procedure."],"boardTrap":"The 20-day maximum is not authority to ignore a shorter Charter deadline.","citation":"RA 11032 Sec. 9(b)(1)"}]'),Df=JSON.parse('[{"id":"far-001","subject":"FAR","topic":"Revenue, Warranties & Loyalty Points","difficulty":"Easy","question":"When is a promised service distinct?","choices":["It is separately billed only.","It is performed by a different employee.","It has a published price only.","Customer can benefit and promise is separately identifiable."],"correctIndex":3,"solutionSteps":["Step 1: Assess whether the customer can benefit.","Step 2: Then assess separability within this contract."],"boardTrap":"A price list does not resolve significant integration.","citation":"PFRS 15 paras. 22 and 27"},{"id":"far-002","subject":"FAR","topic":"Revenue, Warranties & Loyalty Points","difficulty":"Easy","question":"Which event triggers recognition for a point-in-time performance obligation?","choices":["Signing the order","Receipt of a deposit","Transfer of control","Issue of every invoice"],"correctIndex":2,"solutionSteps":["Step 1: Identify when the customer obtains control.","Step 2: Recognize revenue on that event."],"boardTrap":"Prepayment generally creates a contract liability while performance is outstanding.","citation":"PFRS 15 paras. 9 and 31"},{"id":"far-003","subject":"FAR","topic":"Revenue, Warranties & Loyalty Points","difficulty":"Easy","question":"What does an assurance-only warranty normally create at sale?","choices":["A separate performance obligation","A PAS 37 provision when recognition criteria are met","An unconditional receivable","A refund liability as the only entry"],"correctIndex":1,"solutionSteps":["Step 1: Decide whether the warranty promises a separate service.","Step 2: An assurance warranty follows PAS 37."],"boardTrap":"The service warranty’s allocation model does not apply to mere defect assurance.","citation":"PFRS 15 paras. B28–B30"},{"id":"far-004","subject":"FAR","topic":"Revenue, Warranties & Loyalty Points","difficulty":"Easy","question":"When does an option for future goods create a performance obligation?","choices":["When it gives a material right the customer would not receive otherwise.","Whenever a discount is advertised to everyone.","Only if the customer prepays the option exercise price.","Whenever the item has an observable stand-alone price."],"correctIndex":0,"solutionSteps":["Step 1: Compare the option with discounts available without the original contract.","Step 2: Account separately for a material incremental right."],"boardTrap":"A broad market discount creates no incremental right from this contract.","citation":"PFRS 15 paras. B39–B43"},{"id":"far-005","subject":"FAR","topic":"Revenue, Warranties & Loyalty Points","difficulty":"Moderate","question":"A Cebu retailer sells an appliance and distinct installation for ₱51,000, with stand-alone prices of ₱48,000 and ₱12,000. The discount relates to both. Control of the appliance transfers immediately and installation occurs next month.\\n\\nWhat is initial appliance revenue?","choices":["₱40,800","₱48,000","₱39,000","₱51,000"],"correctIndex":0,"solutionSteps":["Step 1: Appliance share is ₱48,000 ÷ ₱60,000 = 80%.","Step 2: Allocate and recognize 80% of ₱51,000 = ₱40,800."],"boardTrap":"Allocating the full discount to hardware or recognizing the whole package ignores the distinct installation.","citation":"PFRS 15 paras. 73–76"},{"id":"far-006","subject":"FAR","topic":"Revenue, Warranties & Loyalty Points","difficulty":"Moderate","question":"A Cebu retailer sells an appliance and distinct installation for ₱51,000, with stand-alone prices of ₱48,000 and ₱12,000. The discount relates to both. Control of the appliance transfers immediately and installation occurs next month.\\n\\nThe customer pays the whole price up front. What contract liability remains after appliance delivery?","choices":["₱12,000","₱9,000","₱0","₱10,200"],"correctIndex":3,"solutionSteps":["Step 1: Allocate 20% of transaction price to installation = ₱10,200.","Step 2: Defer it until installation is performed."],"boardTrap":"The installation list price is not the allocated consideration.","citation":"PFRS 15 paras. 31 and 106"},{"id":"far-007","subject":"FAR","topic":"Revenue, Warranties & Loyalty Points","difficulty":"Moderate","question":"A store separately sells a two-year service warranty. A bundled ₱27,000 cash sale has stand-alone prices of ₱27,000 for goods and ₱3,000 for the warranty. What warranty consideration is initially deferred?","choices":["₱3,000","₱0","₱2,700","₱5,400"],"correctIndex":2,"solutionSteps":["Step 1: The separately purchasable warranty is a performance obligation.","Step 2: Allocate ₱27,000 × ₱3,000/₱30,000 = ₱2,700."],"boardTrap":"Do not equate a separately purchasable service with assurance-only coverage.","citation":"PFRS 15 paras. B28–B33 and 76"},{"id":"far-008","subject":"FAR","topic":"Revenue, Warranties & Loyalty Points","difficulty":"Moderate","question":"A café sells ₱18,000 of goods and awards material-right points. Estimated stand-alone prices are ₱18,000 for the goods and ₱2,000 for the points. What is initial goods revenue?","choices":["₱18,000","₱16,200","₱16,000","₱1,800"],"correctIndex":1,"solutionSteps":["Step 1: Goods receive 90% of the transaction price.","Step 2: Recognize ₱18,000 × 90% = ₱16,200."],"boardTrap":"Do not deduct the full point stand-alone price or ignore points.","citation":"PFRS 15 paras. 73–76 and B42"},{"id":"far-009","subject":"FAR","topic":"Revenue, Warranties & Loyalty Points","difficulty":"Moderate","question":"A contractor estimates a ₱240,000 bonus. Only ₱90,000 meets the significant-reversal constraint. What bonus enters the transaction price today?","choices":["₱240,000","₱90,000","₱150,000","₱0"],"correctIndex":1,"solutionSteps":["Step 1: Estimate variable consideration using the appropriate method.","Step 2: Include only the amount meeting the highly-probable reversal threshold."],"boardTrap":"The gross estimate and amount passing the constraint are different.","citation":"PFRS 15 paras. 56–58"},{"id":"far-010","subject":"FAR","topic":"Revenue, Warranties & Loyalty Points","difficulty":"Moderate","question":"A firm delivers a completed module. Payment is due 30 days after unconditional billing, with no remaining milestone. What entry recognizes a ₱130,000 right?","choices":["Dr receivable, Cr revenue ₱130,000","Dr contract asset, Cr revenue ₱130,000","Dr receivable, Cr contract liability ₱130,000","Dr contract liability, Cr revenue ₱130,000"],"correctIndex":0,"solutionSteps":["Step 1: Only time remains before payment, so the right is a receivable.","Step 2: Credit revenue for satisfied performance."],"boardTrap":"An unbilled conditional right is a contract asset. The facts specify an unconditional right.","citation":"PFRS 15 paras. 105–108"},{"id":"far-011","subject":"FAR","topic":"Revenue, Warranties & Loyalty Points","difficulty":"Difficult","question":"₱180,000 was allocated to loyalty points. Customers have redeemed 9,000 points to date. Expected ultimate redemption increases from 12,000 to 15,000 before year-end. Prior periods recognized ₱72,000. What is current-year point revenue?","choices":["₱63,000","₱108,000","₱45,000","₱36,000"],"correctIndex":3,"solutionSteps":["Step 1: Updated cumulative revenue = ₱180,000 × 9,000/15,000 = ₱108,000.","Step 2: Subtract prior ₱72,000 to obtain ₱36,000."],"boardTrap":"The previous expected denominator produces ₱63,000 current revenue.","citation":"PFRS 15 paras. B39–B43 and Illustrative Example 52"},{"id":"far-012","subject":"FAR","topic":"Revenue, Warranties & Loyalty Points","difficulty":"Difficult","question":"A service provider adds distinct future units at a negotiated price that does not reflect stand-alone prices. Remaining services are distinct from those already delivered. How is the modification accounted for?","choices":["Separate contract regardless of new price.","Retrospective correction of all prior billing.","Prospectively as termination of the old contract and creation of a new one for remaining services.","Cumulative catch-up on the completed units."],"correctIndex":2,"solutionSteps":["Step 1: Separate-contract test fails on price.","Step 2: Distinct remaining services trigger prospective reallocation of remaining consideration."],"boardTrap":"A cumulative catch-up applies when remaining work is part of a partly satisfied non-distinct obligation.","citation":"PFRS 15 paras. 20–21"},{"id":"far-013","subject":"FAR","topic":"Revenue, Warranties & Loyalty Points","difficulty":"Difficult","question":"A retailer sells 100 units for ₱1,000 each, cost ₱600. It expects five undamaged returns with no recovery costs. What revenue, refund liability and recovery asset arise?","choices":["₱100,000 revenue, no liability, ₱3,000 asset","₱95,000 revenue, ₱5,000 liability, ₱5,000 asset","₱95,000 revenue, ₱5,000 refund liability, ₱3,000 recovery asset","₱95,000 revenue, ₱3,000 liability, ₱5,000 asset"],"correctIndex":2,"solutionSteps":["Step 1: Exclude the five expected returns from revenue and recognize a ₱5,000 refund liability.","Step 2: Measure recoverable goods at 5 × ₱600 = ₱3,000."],"boardTrap":"The liability uses selling price, while the recovery asset uses carrying cost adjusted for expected recovery costs.","citation":"PFRS 15 paras. B20–B25"},{"id":"far-014","subject":"FAR","topic":"Revenue, Warranties & Loyalty Points","difficulty":"Difficult","question":"A bundle sells for ₱103,500. Stand-alone equipment and two years of distinct service coverage are ₱100,000 and ₱15,000. A separate assurance obligation has an estimated regulatory defect cost of ₱4,000. What consideration is deferred for service?","choices":["₱15,000","₱13,500","₱17,500","₱9,500"],"correctIndex":1,"solutionSteps":["Step 1: Allocate ₱103,500 × ₱15,000/₱115,000 = ₱13,500 to separate service.","Step 2: Account separately for the assurance provision, rather than adding it to transaction-price allocation."],"boardTrap":"The assurance cost is not another contract performance obligation.","citation":"PFRS 15 paras. B29–B32 and 76"},{"id":"far-015","subject":"FAR","topic":"Lessee Accounting","difficulty":"Easy","question":"A contract contains a lease when what right is conveyed over an identified asset for consideration?","choices":["Control of its use for a period of time","Legal ownership","Only the right to purchase it eventually","Use at the supplier’s direction without economic benefits"],"correctIndex":0,"solutionSteps":["Step 1: Assess rights to economic benefits and direction of use.","Step 2: An identified asset alone is insufficient."],"boardTrap":"Ownership and control of use can reside with different parties.","citation":"PFRS 16 para. 9 and B9"},{"id":"far-016","subject":"FAR","topic":"Lessee Accounting","difficulty":"Easy","question":"What prevents use of the short-term lease exemption for an otherwise ten-month lease?","choices":["Monthly payments","A variable usage charge","The supplier retaining the legal title","A purchase option"],"correctIndex":3,"solutionSteps":["Step 1: Check both lease term and purchase option.","Step 2: A lease containing a purchase option is excluded from the short-term definition."],"boardTrap":"The term test alone is incomplete.","citation":"PFRS 16 paras. 5–8 and Appendix A"},{"id":"far-017","subject":"FAR","topic":"Lessee Accounting","difficulty":"Easy","question":"Which discount rate does a lessee use when the implicit lease rate cannot be readily determined?","choices":["Lessor’s central bank policy rate","Zero until lease commencement","Cash coupon on any unrelated short-term debt","Its incremental borrowing rate"],"correctIndex":3,"solutionSteps":["Step 1: First assess whether the implicit rate is readily determinable.","Step 2: Otherwise use the lessee’s relevant incremental borrowing rate."],"boardTrap":"The nearest available borrowing rate need not match lease term, security and environment.","citation":"PFRS 16 para. 26"},{"id":"far-018","subject":"FAR","topic":"Lessee Accounting","difficulty":"Easy","question":"Which payment normally enters the initial lease liability?","choices":["All sales-based payments at forecast sales","Amounts paid at commencement as future cash flows","In-substance fixed future payments","General nonincremental payroll costs"],"correctIndex":2,"solutionSteps":["Step 1: Include unpaid fixed and in-substance fixed payments and specified other categories.","Step 2: Exclude purely usage- or sales-linked payments at inception."],"boardTrap":"Variable in form can be fixed in substance, but genuine activity variability is different.","citation":"PFRS 16 para. 27"},{"id":"far-019","subject":"FAR","topic":"Lessee Accounting","difficulty":"Moderate","question":"At commencement, unpaid lease payments have PV of ₱540,000. The lessee pays ₱80,000 up front and incurs ₱15,000 qualifying initial direct costs. No other adjustments. What initial ROU asset is recognized?","choices":["₱555,000","₱635,000","₱540,000","₱620,000"],"correctIndex":1,"solutionSteps":["Step 1: Start with the ₱540,000 liability.","Step 2: Add the commencement payment and qualifying direct cost for ₱635,000."],"boardTrap":"The ₱80,000 payment is excluded from unpaid liability but included in the ROU asset.","citation":"PFRS 16 paras. 24 and 26"},{"id":"far-020","subject":"FAR","topic":"Lessee Accounting","difficulty":"Moderate","question":"Opening lease liability is ₱480,000, rate 8%, and year-end lease payment ₱135,000. What is the closing liability before any remeasurement?","choices":["₱383,400","₱345,000","₱421,800","₱518,400"],"correctIndex":0,"solutionSteps":["Step 1: Add effective interest of ₱38,400.","Step 2: Deduct the ₱135,000 period-end payment: ₱383,400."],"boardTrap":"Subtracting all cash from opening principal ignores interest.","citation":"PFRS 16 paras. 26 and 36"},{"id":"far-021","subject":"FAR","topic":"Lessee Accounting","difficulty":"Moderate","question":"A ₱720,000 ROU asset has a six-year useful life and a four-year lease. No ownership transfer or reasonably certain purchase. What annual straight-line depreciation applies?","choices":["₱180,000","₱120,000","₱0","₱240,000"],"correctIndex":0,"solutionSteps":["Step 1: Compare use life and lease term.","Step 2: Use four years here: ₱720,000 ÷ 4 = ₱180,000."],"boardTrap":"Useful life alone applies when ownership transfers or exercise of a purchase option is reasonably certain.","citation":"PFRS 16 paras. 31–32"},{"id":"far-022","subject":"FAR","topic":"Lessee Accounting","difficulty":"Moderate","question":"A brokerage commission of ₱36,000 is payable only if the lease is signed. Due-diligence salary allocated to the deal is ₱19,000 regardless of success. What amount enters ROU cost as initial direct cost?","choices":["₱55,000","₱19,000","₱0","₱36,000"],"correctIndex":3,"solutionSteps":["Step 1: Apply the incremental test: the commission would not have been incurred without obtaining the lease.","Step 2: The common salary would still have been paid."],"boardTrap":"Directly traced cost is not automatically incremental.","citation":"PFRS 16 paras. 24(c) and 26"},{"id":"far-023","subject":"FAR","topic":"Lessee Accounting","difficulty":"Moderate","question":"PV of unpaid rentals is ₱690,000 and PV of a commencement restoration obligation is ₱64,000. No other amounts apply. Which balances arise?","choices":["ROU and lease liability both ₱754,000","ROU ₱690,000, lease liability ₱690,000, expense ₱64,000","ROU ₱754,000, lease liability ₱690,000, separate provision ₱64,000","ROU ₱626,000, lease liability ₱690,000"],"correctIndex":2,"solutionSteps":["Step 1: Include the restoration provision in ROU cost.","Step 2: Recognize the provision separately from the rental liability."],"boardTrap":"Restoration is a separate obligation even though both affect ROU measurement.","citation":"PFRS 16 paras. 24(d) and 26; PAS 37 para. 45"},{"id":"far-024","subject":"FAR","topic":"Lessee Accounting","difficulty":"Moderate","question":"A retailer’s lease includes ₱40,000 fixed annual rentals and 3% of sales. Sales are ₱900,000. How much usage-linked expense is recognized this year, assuming it is not included in another asset?","choices":["₱40,000","₱27,000","₱67,000","₱0"],"correctIndex":1,"solutionSteps":["Step 1: Apply the sales percentage when the triggering sales occur.","Step 2: ₱900,000 × 3% = ₱27,000."],"boardTrap":"The fixed payment has separate liability accounting and is not added to the variable expense.","citation":"PFRS 16 para. 38(b)"},{"id":"far-025","subject":"FAR","topic":"Lessee Accounting","difficulty":"Difficult","question":"An index-linked rental is revised after the index changes, with no floating interest component. Remeasurement at the applicable rate increases the liability by ₱42,000. What entry is ordinarily required?","choices":["Dr rent expense and Cr cash ₱42,000","Dr ROU asset and Cr lease liability ₱42,000","Dr lease liability and C
