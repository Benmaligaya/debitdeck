 all units alone.","Rely exclusively on management’s summary.","Only obtain the purchase budget.","Observe counting, inspect inventory, perform test counts and test final records."],"correctIndex":3,"solutionSteps":["Step 1: Attendance involves evaluation, observation and tests.","Step 2: Reconcile the results to final inventory records."],"boardTrap":"Observation by itself does not establish all inventory assertions.","citation":"PSA 501 para. 4"},{"id":"aud-044","subject":"AUD","topic":"Adjusted Inventory & Net Income","difficulty":"Easy","question":"What is the basis for closing inventory under PAS 2?","choices":["Higher of cost and replacement cost","Latest selling price regardless of costs","Lower of cost and net realizable value","Cost with no write-down until sale"],"correctIndex":2,"solutionSteps":["Step 1: Determine cost and estimated net selling proceeds.","Step 2: Carry inventory at the lower amount."],"boardTrap":"Gross selling price can exceed recoverable value after completion and selling costs.","citation":"PAS 2 paras. 6 and 9"},{"id":"aud-045","subject":"AUD","topic":"Adjusted Inventory & Net Income","difficulty":"Easy","question":"After timely communication of accumulated misstatements to management, what should the auditor ordinarily request?","choices":["That the auditor independently alter the books","That all errors be carried into next year","That management correct them","That the previous report be reissued automatically"],"correctIndex":2,"solutionSteps":["Step 1: Management retains responsibility for the statements.","Step 2: Request correction and evaluate any uncorrected effect."],"boardTrap":"Identifying an error does not authorize the auditor to post it.","citation":"PSA 450 para. 8"},{"id":"aud-046","subject":"AUD","topic":"Adjusted Inventory & Net Income","difficulty":"Easy","question":"A December utility service is unpaid at year-end. What does the basic adjustment recognize?","choices":["January expense only on payment","December expense and accrued liability","A prepaid asset in December","A reduction of sales revenue"],"correctIndex":1,"solutionSteps":["Step 1: Determine when the service was consumed.","Step 2: Debit December expense and credit the payable."],"boardTrap":"Cash-basis recording omits a current expense and liability.","citation":"PAS 1 paras. 27–28; PSA 450"},{"id":"aud-047","subject":"AUD","topic":"Adjusted Inventory & Net Income","difficulty":"Moderate","question":"Year-end count is ₱770,000. It includes ₱48,000 held as consignee and omits ₱62,000 the company owns on consignment at a dealer. What inventory balance should be reported?","choices":["₱784,000","₱722,000","₱832,000","₱756,000"],"correctIndex":0,"solutionSteps":["Step 1: Remove inventory held for others and add owned inventory at the dealer.","Step 2: ₱770,000 − ₱48,000 + ₱62,000 = ₱784,000."],"boardTrap":"Physical location does not establish ownership in a consignment.","citation":"PAS 2 paras. 6 and 34; PSA 501 paras. 4–8"},{"id":"aud-048","subject":"AUD","topic":"Adjusted Inventory & Net Income","difficulty":"Moderate","question":"An inventory lot cost ₱380,000. Expected sales are ₱410,000, completion ₱31,000, and selling costs ₱19,000. Compute the write-down.","choices":["₱0","₱50,000","₱30,000","₱20,000"],"correctIndex":3,"solutionSteps":["Step 1: NRV = ₱410,000 − ₱31,000 − ₱19,000 = ₱360,000.","Step 2: Write down from cost by ₱20,000."],"boardTrap":"A gross sale estimate above cost can still require a write-down.","citation":"PAS 2 paras. 28–33; PSA 501 para. 4"},{"id":"aud-049","subject":"AUD","topic":"Adjusted Inventory & Net Income","difficulty":"Moderate","question":"Opening inventory is correct. Ending inventory is overstated by ₱44,000. Ignore income tax. How does the error affect current net income?","choices":["Understates it by ₱44,000.","Only changes assets.","Overstates it by ₱88,000.","Overstates it by ₱44,000."],"correctIndex":3,"solutionSteps":["Step 1: COGS is opening inventory plus purchases less ending inventory.","Step 2: An overstated ending balance understates COGS and overstates income by ₱44,000."],"boardTrap":"The subtraction in the COGS formula reverses the balance-sheet error’s expense direction.","citation":"PAS 2 paras. 6 and 34; PSA 450 para. 8"},{"id":"aud-050","subject":"AUD","topic":"Adjusted Inventory & Net Income","difficulty":"Moderate","question":"A ₱600,000 machine with ₱60,000 residual and six-year life is available April 1. Straight line and monthly convention apply. The ledger recorded ₱90,000 depreciation. What profit adjustment is needed?","choices":["Decrease income by ₱22,500.","Increase income by ₱15,000.","Increase income by ₱22,500.","No adjustment."],"correctIndex":2,"solutionSteps":["Step 1: Annual depreciation is ₱90,000, but nine months is ₱67,500.","Step 2: Reverse excess expense of ₱22,500."],"boardTrap":"The asset was ready for only nine months, so annual expense overstates the period charge.","citation":"PAS 16 paras. 50–55; PSA 450 para. 8"},{"id":"aud-051","subject":"AUD","topic":"Adjusted Inventory & Net Income","difficulty":"Moderate","question":"Unpaid December services of ₱46,000 were not booked. The vendor invoice also includes ₱9,000 for January services not yet performed. What December adjusting entry is correct?","choices":["Dr service expense, Cr accrued liability ₱55,000","Dr service expense, Cr accrued liability ₱46,000","Dr prepaid asset, Cr accrued liability ₱46,000","No entry until cash payment"],"correctIndex":1,"solutionSteps":["Step 1: Recognize the amounts incurred in December.","Step 2: Exclude the future service portion from the December accrual."],"boardTrap":"The invoice amount crosses the reporting-period cutoff.","citation":"PAS 1 paras. 27–28; PSA 450 para. 8"},{"id":"aud-052","subject":"AUD","topic":"Adjusted Inventory & Net Income","difficulty":"Moderate","question":"The ledger excludes a December shipment under shipping-point terms. Contract control passed on shipment. The sales price is ₱175,000 and inventory cost ₱112,000, both unrecorded. What pretax income adjustment follows?","choices":["Increase ₱63,000.","Increase ₱175,000.","Decrease ₱112,000.","No change until receipt."],"correctIndex":0,"solutionSteps":["Step 1: Recognize ₱175,000 revenue and ₱112,000 cost.","Step 2: Net profit rises ₱63,000."],"boardTrap":"Recording revenue without matching inventory derecognition overstates the increase.","citation":"PAS 2 para. 34; PFRS 15 para. 31"},{"id":"aud-053","subject":"AUD","topic":"Adjusted Inventory & Net Income","difficulty":"Difficult","question":"Opening inventory was overstated ₱75,000 and closing inventory is understated ₱42,000. All purchases are correct. What is this year’s pretax income error?","choices":["Understated by ₱117,000.","Understated by ₱33,000.","Overstated by ₱117,000.","Overstated by ₱33,000."],"correctIndex":0,"solutionSteps":["Step 1: Too-high opening inventory adds ₱75,000 to COGS.","Step 2: Too-low ending inventory adds another ₱42,000, understating income by ₱117,000."],"boardTrap":"Different directions in the two inventory balances reinforce each other in COGS.","citation":"PAS 2 para. 34; PSA 450 para. 11"},{"id":"aud-054","subject":"AUD","topic":"Adjusted Inventory & Net Income","difficulty":"Difficult","question":"Draft income is ₱1,240,000. A premature ₱210,000 sale also recorded ₱138,000 COGS. A separate ₱36,000 December payroll accrual is missing. Ignore tax. What adjusted income results?","choices":["₱994,000","₱1,168,000","₱1,306,000","₱1,132,000"],"correctIndex":3,"solutionSteps":["Step 1: Reverse the premature net margin of ₱72,000.","Step 2: Deduct the missing expense of ₱36,000 from the revised income."],"boardTrap":"Reversing sales alone ignores the associated restoration of inventory and reversal of COGS.","citation":"PFRS 15 para. 31; PAS 2 para. 34; PSA 450 para. 11"},{"id":"aud-055","subject":"AUD","topic":"Adjusted Inventory & Net Income","difficulty":"Difficult","question":"Two unrelated items are tested separately. A cost ₱210,000 with NRV ₱189,000. B cost ₱158,000 with NRV ₱188,000. What total carrying amount is appropriate?","choices":["₱368,000","₱377,000","₱347,000","₱398,000"],"correctIndex":2,"solutionSteps":["Step 1: Carry A at ₱189,000 and B at cost of ₱158,000.","Step 2: Add to ₱347,000."],"boardTrap":"Offsetting one loss with another unrelated item’s unrealized upside masks the write-down.","citation":"PAS 2 paras. 9 and 29; PSA 501 para. 4"},{"id":"aud-056","subject":"AUD","topic":"Adjusted Inventory & Net Income","difficulty":"Difficult","question":"Item cost was ₱500,000, and prior-year NRV of ₱420,000 was fully recognized. This year NRV is ₱528,000. A separate ₱24,000 inventory shortage was omitted. What net pretax profit increase is required from these two entries?","choices":["₱84,000","₱56,000","₱80,000","₱104,000"],"correctIndex":1,"solutionSteps":["Step 1: Reverse only the original ₱80,000 write-down.","Step 2: Recognize the separate ₱24,000 shortage, netting ₱56,000 income increase."],"boardTrap":"Do not carry the recovered item above original cost.","citation":"PAS 2 paras. 33–34; PSA 450 para. 11"},{"id":"aud-057","subject":"AUD","topic":"Audit Opinions & Reporting","difficulty":"Easy","question":"When is an unmodified opinion appropriate?","choices":["All internal controls worked perfectly.","Statements comply in all material respects with the applicable framework.","Every item was individually tested.","An emphasis paragraph replaces required corrections."],"correctIndex":1,"solutionSteps":["Step 1: Evaluate sufficient evidence and material framework compliance.","Step 2: Express an unmodified opinion when the standard’s condition is met."],"boardTrap":"An unmodified opinion is a material reporting conclusion, not a control guarantee.","citation":"PSA 700 (Revised) para. 16"},{"id":"aud-058","subject":"AUD","topic":"Audit Opinions & Reporting","difficulty":"Easy","question":"Which opinions can result from material inability to obtain sufficient appropriate evidence?","choices":["Qualified or disclaimer, depending on pervasiveness","Adverse or unmodified only","Always adverse","Only unmodified with emphasis"],"correctIndex":0,"solutionSteps":["Step 1: Classify the issue as a limitation rather than proved misstatement.","Step 2: Evaluate the possible materiality and pervasiveness."],"boardTrap":"Adverse generally communicates a known material and pervasive misstatement.","citation":"PSA 705 (Revised) paras. 7–9"},{"id":"aud-059","subject":"AUD","topic":"Audit Opinions & Reporting","difficulty":"Easy","question":"What is an Emphasis of Matter paragraph about?","choices":["An omitted disclosure the auditor intends to supply","Any audit matter regardless of user relevance","A guarantee that a future event will occur","A matter appropriately presented or disclosed that is fundamental to users’ understanding"],"correctIndex":3,"solutionSteps":["Step 1: Confirm appropriate presentation or disclosure.","Step 2: Assess fundamental importance to understanding the statements."],"boardTrap":"An emphasis paragraph cannot correct an inadequate note.","citation":"PSA 706 (Revised) para. 7"},{"id":"aud-060","subject":"AUD","topic":"Audit Opinions & Reporting","difficulty":"Easy","question":"From which initial population are key audit matters selected?","choices":["All transactions above planning materiality","All specialist engagements automatically","Matters communicated with those charged with governance","Only uncorrected misstatements"],"correctIndex":2,"solutionSteps":["Step 1: Identify governance matters requiring significant auditor attention.","Step 2: Select those of most significance in the audit."],"boardTrap":"KAMs can arise despite an unmodified opinion.","citation":"PSA 701 paras. 8–10"},{"id":"aud-061","subject":"AUD","topic":"Audit Opinions & Reporting","difficulty":"Easy","question":"An auditor discusses a relevant matter outside the financial statements, related to users’ understanding of the audit or report. Which paragraph is contemplated, if conditions are met?","choices":["Emphasis of Matter","Basis for Adverse Opinion in all cases","Other Matter","Management’s Responsibility"],"correctIndex":2,"solutionSteps":["Step 1: Determine whether the matter is outside the financial statements.","Step 2: If relevant to the audit, responsibilities or report and permitted, consider Other Matter."],"boardTrap":"Emphasis points to a matter presented or disclosed in the statements.","citation":"PSA 706 (Revised) para. 10"},{"id":"aud-062","subject":"AUD","topic":"Audit Opinions & Reporting","difficulty":"Moderate","question":"Management refuses correction of a known material inventory error confined to the single balance and related expense. The effect is nonpervasive. Which opinion applies?","choices":["Adverse","Qualified for misstatement","Disclaimer","Unmodified with an Emphasis of Matter"],"correctIndex":1,"solutionSteps":["Step 1: Sufficient evidence confirms a material error.","Step 2: Nonpervasiveness makes the opinion qualified."],"boardTrap":"Confined does not mean immaterial. The evidence is available.","citation":"PSA 705 (Revised) para. 7(a)"},{"id":"aud-063","subject":"AUD","topic":"Audit Opinions & Reporting","difficulty":"Moderate","question":"A known framework departure affects most assets, liabilities and earnings and is material and pervasive. Which opinion applies?","choices":["Adverse","Disclaimer","Qualified","Unmodified with KAM"],"correctIndex":0,"solutionSteps":["Step 1: Evidence establishes the misstatements.","Step 2: Their pervasive effects require an adverse opinion."],"boardTrap":"A disclaimer ordinarily relates to an evidence limitation rather than established pervasive errors.","citation":"PSA 705 (Revised) para. 8"},{"id":"aud-064","subject":"AUD","topic":"Audit Opinions & Reporting","difficulty":"Moderate","question":"An inventory location was inaccessible. Alternatives failed, but possible material effects are limited and nonpervasive. Which opinion applies?","choices":["Adverse","Disclaimer","Unmodified","Qualified for inability to obtain evidence"],"correctIndex":3,"solutionSteps":["Step 1: Classify the event as an evidence limitation.","Step 2: Possible material nonpervasive effects require qualification."],"boardTrap":"Do not describe an unknown misstatement as proved.","citation":"PSA 705 (Revised) para. 7(b)"},{"id":"aud-065","subject":"AUD","topic":"Audit Opinions & Reporting","difficulty":"Moderate","question":"Records essential to numerous fundamental balances were destroyed and alternatives failed. Possible effects are material and pervasive. Which opinion applies?","choices":["Adverse","Qualified for known misstatement","Unmodified with an Other Matter paragraph","Disclaimer"],"correctIndex":3,"solutionSteps":["Step 1: Evidence is insufficient across pervasive balances.","Step 2: Disclaim an opinion when possible effects meet both tests."],"boardTrap":"The severity of the limitation does not provide evidence of a known misstatement.","citation":"PSA 705 (Revised) para. 9"},{"id":"aud-066","subject":"AUD","topic":"Audit Opinions & Reporting","difficulty":"Difficult","question":"For a calendar-year 2026 audit, going concern is appropriate. A material uncertainty exists and disclosures are adequate. Which report treatment is generally appropriate under the cited PSA?","choices":["Unmodified opinion with only an ordinary Emphasis of Matter paragraph","Adverse opinion because uncertainty exists","Unmodified opinion with a separate Material Uncertainty Related to Going Concern section","Disclaimer because future cash flows are uncertain"],"correctIndex":2,"solutionSteps":["Step 1: Assess basis appropriateness and adequacy of the disclosure separately.","Step 2: Adequate disclosure calls for the prescribed uncertainty section with an unmodified opinion."],"boardTrap":"An ordinary emphasis paragraph is not a substitute for the dedicated section.","citation":"PSA 570 (Revised) paras. 21–23; PSA 705 (Revised)"},{"id":"aud-067","subject":"AUD","topic":"Audit Opinions & Reporting","difficulty":"Difficult","question":"For a calendar-year 2026 audit, a liquidation decision makes the going-concern basis inappropriate, but management retains it and fully describes the liquidation in a note. What opinion is required?","choices":["Unmodified with the dedicated uncertainty section","Adverse opinion","Qualified because disclosure mitigates the basis problem","Disclaimer solely because liquidation is planned"],"correctIndex":1,"solutionSteps":["Step 1: Determine that the accounting basis itself is inappropriate.","Step 2: A note cannot fix the pervasive basis problem, which requires adverse opinion."],"boardTrap":"Disclosing the decision is different from using an appropriate basis of preparation.","citation":"PSA 570 (Revised) para. 21; PSA 705 (Revised) para. 8"},{"id":"aud-068","subject":"AUD","topic":"Audit Opinions & Reporting","difficulty":"Difficult","question":"A listed entity’s material nonpervasive inventory misstatement leads to qualification and was a matter of most significance. Where should it be explained?","choices":["Basis for Qualified Opinion, with reference from Key Audit Matters as applicable","Only the Key Audit Matters section","An Emphasis of Matter paragraph instead of a basis section","Only in the audit engagement letter"],"correctIndex":0,"solutionSteps":["Step 1: Describe the cause of modification in the basis section.","Step 2: Do not describe it as an ordinary KAM in the same way as unrelated significant matters."],"boardTrap":"KAM reporting does not replace the required modification basis.","citation":"PSA 701 para. 15; PSA 705 (Revised) para. 7"},{"id":"aud-069","subject":"AUD","topic":"Audit Opinions & Reporting","difficulty":"Difficult","question":"The only reason a listed entity’s appropriately disclosed material lawsuit is fundamental is the same matter already determined to be a KAM. Should the auditor add a duplicative Emphasis of Matter paragraph for it?","choices":["No. Address it through the applicable KAM reporting.","Yes, duplicate every KAM in an emphasis paragraph.","Yes, because a properly disclosed matter must always be emphasized.","Issue a disclaimer instead."],"correctIndex":0,"solutionSteps":["Step 1: Determine whether it is already a KAM under PSA 701.","Step 2: PSA 706 restricts use of Emphasis of Matter for a matter determined to be a KAM."],"boardTrap":"Importance does not automatically mean two separate paragraphs.","citation":"PSA 706 (Revised) paras. 8–9; PSA 701 para. 8"},{"id":"aud-070","subject":"AUD","topic":"Audit Opinions & Reporting","difficulty":"Difficult","question":"After signing but before release, the auditor learns reliable facts that would have materially changed the report had they been known. What is the responsive first course?","choices":["Release the report unchanged because the signature is final.","Silently revise management’s financial statements.","Automatically issue an unmodified report with an Other Matter paragraph.","Discuss with management and governance as appropriate, determine whether amendment is needed, and inquire how management will respond."],"correctIndex":3,"solutionSteps":["Step 1: Assess the new fact and discuss it with the responsible parties.","Step 2: If amendment is necessary, follow the subsequent-event procedures before release."],"boardTrap":"A signed but unreleased report does not end all responsibility for newly learned facts.","citation":"PSA 560 paras. 10–13; PAS 10 paras. 8–9"}]'),Nf=JSON.parse('[{"id":"tax-001","subject":"TAX","topic":"Passive Income & Capital Gains (CMEPA)","difficulty":"Easy","question":"A resident Filipino earns interest on a Philippine expanded FCDU deposit opened in August 2025. What final tax rate applies?","choices":["15%","25%","0%","20%"],"correctIndex":3,"solutionSteps":["Step 1: Apply the new any-currency bank-deposit rule to the resident holder.","Step 2: The deposit was opened after the July 1, 2025 transition date."],"boardTrap":"15% carried over the old FCDU rule. Exemption for qualifying nonresident FCDU transactions is a separate rule.","citation":"NIRC Sec. 24(B)(1), RA 12214"},{"id":"tax-002","subject":"TAX","topic":"Passive Income & Capital Gains (CMEPA)","difficulty":"Easy","question":"A resident individual opens a six-year Philippine time deposit in 2026. What rate applies to its otherwise ordinary bank interest?","choices":["Exempt because maturity exceeds five years","15% final tax","20% final tax","Graduated income tax"],"correctIndex":2,"solutionSteps":["Step 1: Classify the income as interest on a bank deposit.","Step 2: Under CMEPA the general final rate applies regardless of tenure."],"boardTrap":"The pre-CMEPA long-term exemption does not apply to a new instrument.","citation":"NIRC Sec. 24(B)(1), RA 12214"},{"id":"tax-003","subject":"TAX","topic":"Passive Income & Capital Gains (CMEPA)","difficulty":"Easy","question":"Which base applies to a nondealer’s sale of shares listed and actually traded through the Philippine Stock Exchange in 2026?","choices":["Net capital gain","Gross selling price or gross value","Amount originally paid for the shares","Proceeds net of brokerage"],"correctIndex":1,"solutionSteps":["Step 1: Determine where the sale was made.","Step 2: For a qualifying exchange trade, multiply gross selling price or value by the STT rate."],"boardTrap":"Capital gain is the wrong base even when the investor made a loss.","citation":"NIRC Sec. 127(A), RA 12214"},{"id":"tax-004","subject":"TAX","topic":"Passive Income & Capital Gains (CMEPA)","difficulty":"Easy","question":"Which rate and base apply to an original issue of par-value shares in 2026?","choices":["0.75% of par value","1% of par value","0.75% of issue price including premium","0.1% of gross proceeds"],"correctIndex":0,"solutionSteps":["Step 1: Identify an original issuance rather than a secondary exchange sale.","Step 2: For shares with par value, use the 0.75% rate on par."],"boardTrap":"Issue proceeds can exceed par. The former DST rate and STT rate apply to different facts.","citation":"NIRC Sec. 174, RA 12214"},{"id":"tax-005","subject":"TAX","topic":"Passive Income & Capital Gains (CMEPA)","difficulty":"Moderate","question":"Lina receives ₱62,000 in gross resident FCDU interest on a 2026 deposit and ₱8,000 in gross interest on a new peso savings account. How much final tax is withheld in total?","choices":["₱14,000","₱10,900","₱12,400","₱15,500"],"correctIndex":0,"solutionSteps":["Step 1: Combine covered interest of ₱62,000 + ₱8,000 = ₱70,000.","Step 2: Apply 20% to both deposits: ₱14,000."],"boardTrap":"Blending the former foreign-currency rate with the current peso rate produces ₱10,900.","citation":"NIRC Sec. 24(B)(1), RA 12214"},{"id":"tax-006","subject":"TAX","topic":"Passive Income & Capital Gains (CMEPA)","difficulty":"Moderate","question":"A nondealer sells PSE shares for ₱840,000 in 2026. Cost was ₱910,000 and brokerage is ₱4,200. What is STT?","choices":["₱5,040","₱0","₱835.80","₱840"],"correctIndex":3,"solutionSteps":["Step 1: The sale occurred through the exchange, so a capital loss does not eliminate STT.","Step 2: Multiply the gross selling price by 0.1%: ₱840."],"boardTrap":"Do not apply the old 0.6%, net brokerage, or use the capital-loss amount.","citation":"NIRC Sec. 127(A), RA 12214"},{"id":"tax-007","subject":"TAX","topic":"Passive Income & Capital Gains (CMEPA)","difficulty":"Moderate","question":"A corporation originally issues 36,000 shares for ₱28 each with a par value of ₱20. How much DST applies under CMEPA?","choices":["₱7,560","₱7,200","₱5,400","₱1,008"],"correctIndex":2,"solutionSteps":["Step 1: Compute aggregate par, 36,000 × ₱20 = ₱720,000.","Step 2: Multiply by 0.75% = ₱5,400."],"boardTrap":"The ₱8 premium is outside the par-share DST base.","citation":"NIRC Sec. 174, RA 12214"},{"id":"tax-008","subject":"TAX","topic":"Passive Income & Capital Gains (CMEPA)","difficulty":"Moderate","question":"A resident individual receives ₱84,000 gross cash dividends from a domestic corporation in 2026. What final tax applies?","choices":["₱16,800","₱8,400","₱12,600","₱0"],"correctIndex":1,"solutionSteps":["Step 1: Classify the distribution as domestic cash dividends to an individual.","Step 2: Apply 10% × ₱84,000 = ₱8,400."],"boardTrap":"The 20% deposit-interest rate does not carry over to domestic dividends.","citation":"NIRC Sec. 24(B)(2), RA 12214"},{"id":"tax-009","subject":"TAX","topic":"Passive Income & Capital Gains (CMEPA)","difficulty":"Moderate","question":"A resident nondealer transfers unlisted domestic shares for ₱580,000. Allowable acquisition cost is ₱420,000 and there are no other expenses. What capital gains tax applies?","choices":["₱87,000","₱24,000","₱580","₱0"],"correctIndex":1,"solutionSteps":["Step 1: Compute the net capital gain of ₱160,000.","Step 2: Apply 15% to the gain, giving ₱24,000."],"boardTrap":"STT applies to covered exchange trades. A private unlisted sale uses net gain, rather than gross proceeds.","citation":"NIRC Sec. 24(B)(3), RA 12214"},{"id":"tax-010","subject":"TAX","topic":"Passive Income & Capital Gains (CMEPA)","difficulty":"Moderate","question":"A Philippine corporation originally issues 20,000 no-par shares for total consideration of ₱1,280,000 in 2026. What DST applies?","choices":["₱9,600","₱12,800","₱1,280","₱0"],"correctIndex":0,"solutionSteps":["Step 1: For an original no-par issuance, use the actual consideration.","Step 2: Multiply ₱1,280,000 × 0.75% = ₱9,600."],"boardTrap":"Absence of stated par changes the base. It does not eliminate DST.","citation":"NIRC Sec. 174, RA 12214"},{"id":"tax-011","subject":"TAX","topic":"Passive Income & Capital Gains (CMEPA)","difficulty":"Difficult","question":"In 2026, a resident earned ₱96,000 from a qualifying six-year peso deposit issued May 2025 and held under its original terms. A separate six-year deposit issued August 2025 paid ₱110,000. What total final tax applies?","choices":["₱41,200","₱0","₱19,200","₱22,000"],"correctIndex":3,"solutionSteps":["Step 1: The pre-July instrument retains its qualifying exemption for remaining original maturity.","Step 2: The August instrument is subject to 20% × ₱110,000 = ₱22,000."],"boardTrap":"Use the instrument’s issuance date, rather than the common date the interest was paid.","citation":"NIRC Sec. 24(B)(1), RA 12214 Sec. 28, RR 21-2025 Sec. 10"},{"id":"tax-012","subject":"TAX","topic":"Passive Income & Capital Gains (CMEPA)","difficulty":"Difficult","question":"A resident has ₱740,000 taxable compensation, ₱40,000 gross bank interest on a 2026 deposit, and ₱50,000 domestic cash dividends. The regular bracket is ₱22,500 plus 20% over ₱400,000. What combined regular and final taxes arise before credits?","choices":["₱110,000","₱90,500","₱103,500","₱121,500"],"correctIndex":2,"solutionSteps":["Step 1: Compute regular tax of ₱90,500 on compensation only.","Step 2: Bank interest contributes ₱8,000 and dividends ₱5,000 of final tax. Total ₱103,500."],"boardTrap":"Pooling all receipts in the regular schedule puts ₱830,000 in the next bracket and loses the separate final taxes.","citation":"NIRC Secs. 24(A), 24(B)(1) and (2), RA 12214"},{"id":"tax-013","subject":"TAX","topic":"Passive Income & Capital Gains (CMEPA)","difficulty":"Difficult","question":"On the same day in 2026, an issuer sells 120,000 new ₱10 par shares at ₱15 each. An unrelated nondealer sells previously issued shares through the PSE for ₱1,650,000. What total of original-issue DST and seller STT arises?","choices":["₱15,150","₱18,900","₱10,650","₱3,450"],"correctIndex":2,"solutionSteps":["Step 1: DST uses aggregate par of ₱1,200,000 × 0.75% = ₱9,000.","Step 2: The reselling shareholder owes ₱1,650,000 × 0.1% = ₱1,650. Total ₱10,650."],"boardTrap":"Separate the two taxpayers, transactions, rates, and bases rather than taxing both on gross proceeds at a single rate.","citation":"NIRC Secs. 127(A) and 174, RA 12214"},{"id":"tax-014","subject":"TAX","topic":"Passive Income & Capital Gains (CMEPA)","difficulty":"Difficult","question":"In 2026 a resident’s original-term FCDU deposit opened April 2025 earns ₱48,000 and qualifies for the former preferential rate. A newly opened FCDU deposit earns ₱72,000. What is total final withholding?","choices":["₱24,000","₱21,600","₱18,000","₱16,800"],"correctIndex":1,"solutionSteps":["Step 1: Preserve the old 15% rate on the April instrument: ₱7,200.","Step 2: Apply 20% to the new deposit: ₱14,400. Total ₱21,600."],"boardTrap":"Applying the same rate to both instruments disregards the transition rule.","citation":"NIRC Sec. 24(B)(1), RA 12214 Sec. 28, RR 21-2025 Sec. 10"},{"id":"tax-015","subject":"TAX","topic":"Corporate Incentives (CREATE MORE)","difficulty":"Easy","question":"What income tax rate applies to an eligible domestic RBE’s taxable income from its registered activity under EDR?","choices":["20%","25%","5%","0%"],"correctIndex":0,"solutionSteps":["Step 1: Identify the registered activity and EDR election.","Step 2: Use the special 20% corporate rate for the eligible taxable income."],"boardTrap":"5% is the SCIT rate on gross income earned. An ITH is a separate package.","citation":"NIRC Secs. 27(A) and 294(C), RA 12066"},{"id":"tax-016","subject":"TAX","topic":"Corporate Incentives (CREATE MORE)","difficulty":"Easy","question":"Which enterprise may elect immediate SCIT from the start of commercial operations, assuming approval and other conditions?","choices":["Any domestic market enterprise with high sales","Any ordinary domestic corporation that paid MCIT","Any exporter before registration","A registered export enterprise"],"correctIndex":3,"solutionSteps":["Step 1: Check registration, enterprise type, and approved incentive package.","Step 2: A registered export enterprise can elect SCIT immediately."],"boardTrap":"An income tax holiday is one path, rather than a prerequisite for immediate SCIT.","citation":"NIRC Secs. 294(B) and 295(A), RA 12066"},{"id":"tax-017","subject":"TAX","topic":"Corporate Incentives (CREATE MORE)","difficulty":"Easy","question":"Which regime is expressly excluded from the optional RBE local tax?","choices":["EDR","Income tax holiday","EDR immediately elected","SCIT"],"correctIndex":3,"solutionSteps":["Step 1: Check whether the enterprise is availing of SCIT.","Step 2: The RBE local tax applies during ITH or EDR when properly imposed, and excludes SCIT."],"boardTrap":"The tax is not uniformly layered over every package.","citation":"NIRC Sec. 294(F), RA 12066"},{"id":"tax-018","subject":"TAX","topic":"Corporate Incentives (CREATE MORE)","difficulty":"Easy","question":"Can an RBE ordinarily switch a valid package election after one year because another regime turns out cheaper?","choices":["Yes, if the enterprise was profitable.","Yes, SCIT and EDR can be alternated.","No, the election is irrevocable for the entitlement period.","Yes, once a second tax return is filed."],"correctIndex":2,"solutionSteps":["Step 1: Identify a valid election and its entitlement period.","Step 2: The statute makes the election irrevocable for that period."],"boardTrap":"A fresh annual return does not reopen the original incentive election.","citation":"NIRC Sec. 295(A)–(B), RA 12066"},{"id":"tax-019","subject":"TAX","topic":"Corporate Incentives (CREATE MORE)","difficulty":"Moderate","question":"A registered EDR project has ₱4,800,000 taxable income before enhanced deductions. Its ₱560,000 qualifying power expense is already included as an ordinary deduction. What is income tax after the additional power deduction?","choices":["₱960,000","₱848,000","₱736,000","₱1,060,000"],"correctIndex":1,"solutionSteps":["Step 1: Deduct another 100% of qualifying power, leaving ₱4,240,000.","Step 2: Apply 20% = ₱848,000."],"boardTrap":"The starting net income already includes the regular power deduction. Do not subtract it twice again.","citation":"NIRC Secs. 27(A) and 294(C)(6), RA 12066"},{"id":"tax-020","subject":"TAX","topic":"Corporate Incentives (CREATE MORE)","difficulty":"Moderate","question":"A registered export enterprise under SCIT has ₱18 million sales and ₱11.6 million eligible direct costs. General selling costs are ₱1.2 million and not deductible for SCIT. Compute SCIT.","choices":["₱320,000","₱260,000","₱900,000","₱1,280,000"],"correctIndex":0,"solutionSteps":["Step 1: Determine gross income earned of ₱6.4 million.","Step 2: Apply 5% = ₱320,000."],"boardTrap":"Netting general selling costs confuses the statutory gross base with net taxable income under regular income tax.","citation":"NIRC Secs. 293 and 294(B), RA 12066"},{"id":"tax-021","subject":"TAX","topic":"Corporate Incentives (CREATE MORE)","difficulty":"Moderate","question":"An EDR taxpayer deducted ₱360,000 eligible trade-fair expenses in arriving at ₱2,100,000 taxable income before enhancements. Other adjustments are nil. What is taxable income under EDR?","choices":["₱1,920,000","₱1,740,000","₱1,560,000","₱2,100,000"],"correctIndex":0,"solutionSteps":["Step 1: Compute the additional deduction of ₱360,000 × 50% = ₱180,000.","Step 2: Subtract it from ₱2,100,000, leaving ₱1,920,000."],"boardTrap":"Deducting all ₱360,000 again applies a 100% enhancement to an expense with a 50% enhancement.","citation":"NIRC Secs. 294(C)(8) and 295(B), RA 12066"},{"id":"tax-022","subject":"TAX","topic":"Corporate Incentives (CREATE MORE)","difficulty":"Moderate","question":"An LGU validly imposes the RBE local tax at 1.5% on an EDR enterprise’s ₱8.4 million statutory gross income. Taxable net income is ₱3.9 million. What is the RBE local tax?","choices":["₱168,000","₱58,500","₱0","₱126,000"],"correctIndex":3,"solutionSteps":["Step 1: RBE local tax uses statutory gross income under the ordinance.","Step 2: ₱8,400,000 × 1.5% = ₱126,000."],"boardTrap":"The 2% rate is a ceiling, not a mandatory rate. Net taxable income is a different base.","citation":"NIRC Sec. 294(F), RA 12066"},{"id":"tax-023","subject":"TAX","topic":"Corporate Incentives (CREATE MORE)","difficulty":"Moderate","question":"An eligible registered export project buys outsourced accounting support used only for that project. What fact is critical when assessing its zero-rating entitlement?","choices":["Whether the service directly touches exported inventory","Whether the service provider is also a registered export enterprise in every case","Whether the IPA determines the service is incidental and reasonably necessary to the registered activity and other requirements are met","Whether the RBE calls it a production expense in the ledger"],"correctIndex":2,"solutionSteps":["Step 1: Check the updated directly attributable definition, which can include administrative support.","Step 2: Apply the IPA determination and statutory conditions."],"boardTrap":"The former direct-and-exclusive-use shorthand can wrongly exclude eligible support.","citation":"NIRC Secs. 293 and 295(C)–(D), RA 12066"},{"id":"tax-024","subject":"TAX","topic":"Corporate Incentives (CREATE MORE)","difficulty":"Moderate","question":"An ordinary domestic corporation outside the RBE regime has ₱4.6 million taxable income and ₱98 million statutory qualifying assets after the specified land exclusion. Ignore MCIT. Compute regular tax.","choices":["₱1,150,000","₱920,000","₱805,000","₱230,000"],"correctIndex":1,"solutionSteps":["Step 1: Both ordinary reduced-rate conditions are satisfied.","Step 2: ₱4,600,000 × 20% = ₱920,000."],"boardTrap":"Do not apply 25% merely because the company has no EDR election. The ordinary size tests are separate.","citation":"NIRC Sec. 27(A), RA 12066"},{"id":"tax-025","subject":"TAX","topic":"Corporate Incentives (CREATE MORE)","difficulty":"Difficult","question":"A domestic market RBE under EDR has ₱7.8 million pre-enhancement registered income, including deductions of ₱0.9 million eligible power and ₱0.4 million eligible trade-fair expenses. Its separate unregistered activity has ₱2.4 million regular taxable income. The ordinary 25% rate applies. What total regular corporate tax is due, ignoring MCIT?","choices":["₱1,820,000","₱1,940,000","₱2,275,000","₱2,160,000"],"correctIndex":1,"solutionSteps":["Step 1: Reduce registered income by ₱900,000 and ₱200,000. ₱6.7 million × 20% = ₱1.34 million.","Step 2: Apply 25% to the unregistered ₱2.4 million = ₱600,000. Total ₱1.94 million."],"boardTrap":"Applying the EDR rate to unregistered income yields ₱1.82 million and overlooks scope.","citation":"NIRC Secs. 27(A), 294(C) and 295(B), RA 12066"},{"id":"tax-026","subject":"TAX","topic":"Corporate Incentives (CREATE MORE)","difficulty":"Difficult","question":"An export RBE compares approved immediate packages for an isolated year. Gross income earned for SCIT is ₱24 million, EDR taxable income after enhancements is ₱5.5 million, and ordinance local tax during EDR is 1% of ₱24 million. Which gives lower combined taxes for this year?","choices":["SCIT by ₱140,000","EDR by ₱100,000","SCIT by ₱380,000","Both are ₱1.2 million"],"correctIndex":0,"solutionSteps":["Step 1: SCIT = ₱24 million × 5% = ₱1.2 million. No RBE local tax applies to SCIT.","Step 2: EDR = ₱1.1 million national tax + ₱240,000 local tax = ₱1.34 million."],"boardTrap":"EDR looks cheaper if you omit the ordinance. A one-year comparison is not a recommendation across the irrevocable entitlement period.","citation":"NIRC Secs. 294(B)–(C), 295(A), 27(A), RA 12066"},{"id":"tax-027","subject":"TAX","topic":"Corporate Incentives (CREATE MORE)","difficulty":"Difficult","question":"An EDR project starts with ₱3.8 million taxable income after ordinary operating expenses. Metered power costing ₱660,000 is 75% attributable to this registered activity and 25% to a separate activity. Only the qualifying part may be enhanced. What registered income tax results?","choices":["₱628,000","₱760,000","₱826,250","₱661,000"],"correctIndex":3,"solutionSteps":["Step 1: Compute qualifying extra deduction: ₱660,000 × 75% = ₱495,000.","Step 2: Apply 20% to ₱3,305,000 = ₱661,000."],"boardTrap":"Taking the enhancement on all metered power disregards the separate activity.","citation":"NIRC Secs. 294(C)(6), 295(B)(6) and 27(A), RA 12066"},{"id":"tax-028","subject":"TAX","topic":"Corporate Incentives (CREATE MORE)","difficulty":"Difficult","question":"An export RBE and a domestic market RBE each seek immediate incentives. Each is otherwise eligible and seeks the full period. Which pair can be approved?","choices":["Immediate SCIT for both","Immediate SCIT and EDR simultaneously for the exporter","Immediate SCIT for the exporter and immediate EDR for the domestic RBE","Immediate EDR for the exporter and mandatory ITH for the domestic RBE"],"correctIndex":2,"solutionSteps":["Step 1: The exporter may choose immediate SCIT or EDR, or the ITH path.","Step 2: The domestic market RBE may choose immediate EDR or ITH followed by EDR."],"boardTrap":"Domestic market registration does not grant the export enterprise’s SCIT option.","citation":"NIRC Secs. 294(A)–(C) and 295(A)–(B), RA 12066"},{"id":"tax-029","subject":"TAX","topic":"Invoice-Based VAT (EOPT)","difficulty":"Easy","question":"What is the ordinary output VAT base for a standard-rated service rendered today under EOPT?","choices":["Only collected cash","Only the provider’s margin","VAT-exclusive gross sales from the rendered service","Only the amount net of input VAT"],"correctIndex":2,"solutionSteps":["Step 1: Identify services already rendered and consideration paid or payable.","Step 2: The VAT-exclusive gross sales are the output base."],"boardTrap":"Accrual of VAT on rendered services differs from the prior collection-based rule.","citation":"NIRC Secs. 108(A) and 113, RA 11976"},{"id":"tax-030","subject":"TAX","topic":"Invoice-Based VAT (EOPT)","difficulty":"Easy","question":"After transition, which principal sales document should a VAT-registered consulting firm issue for completed services?","choices":["Official receipt only","VAT invoice","Acknowledgment stub alone","Billing statement alone"],"correctIndex":1,"solutionSteps":["Step 1: Determine the document required for a VAT sale of services.","Step 2: Issue a VAT invoice satisfying required particulars."],"boardTrap":"A collection receipt can document payment, while the VAT invoice supports VAT recognition.","citation":"NIRC Sec. 113, RA 11976"},{"id":"tax-031","subject":"TAX","topic":"Invoice-Based VAT (EOPT)","difficulty":"Easy","question":"For an 18-month taxable lease, when does EOPT require the monthly invoice?","choices":["In the month the property use is supplied","Only when the lessee pays","After the whole contract ends","At signing for the entire 18 months in every case"],"correctIndex":0,"solutionSteps":["Step 1: Identify a contract of at least one year.","Step 2: Invoice in the month when the service or use is rendered or supplied."],"boardTrap":"The contractual collection schedule does not move the invoice requirement.","citation":"NIRC Sec. 108(A), RA 11976"},{"id":"tax-032","subject":"TAX","topic":"Invoice-Based VAT (EOPT)","difficulty":"Easy","question":"When a seller later recovers a receivable on which it previously took an output VAT credit, what must the seller do?","choices":["Keep the credit without change.","Treat the amount as input VAT.","Amend the original filing in every case.","Add the recovered VAT component to output VAT for the period of recovery."],"correctIndex":3,"solutionSteps":["Step 1: Identify the original credit and the amount now recovered.","Step 2: Restore the associated output VAT in the recovery period."],"boardTrap":"A prior credit for noncollection does not permanently exempt a later recovery.","citation":"NIRC Sec. 110(D), RA 11976"},{"id":"tax-033","subject":"TAX","topic":"Invoice-Based VAT (EOPT)","difficulty":"Moderate","question":"A consultancy completed ₱490,000 of standard-rated work in June and collected only ₱180,000. A separate ₱40,000 pass-through met the statutory earmarked reimbursement requirements. What is Q2 output VAT, excluding other items?","choices":["₱21,600","₱63,600","₱54,000","₱58,800"],"correctIndex":3,"solutionSteps":["Step 1: Include the full VAT-exclusive rendered amount of ₱490,000.","Step 2: Exclude the separate qualified reimbursement and apply 12% = ₱58,800."],"boardTrap":"Do not use collected cash or add the earmarked payment to the seller’s consideration.","citation":"NIRC Sec. 108(A), RA 11976"},{"id":"tax-034","subject":"TAX","topic":"Invoice-Based VAT (EOPT)","difficulty":"Moderate","question":"A service company issues VAT invoices for ₱1,232,000 VAT-inclusive standard-rated sales. Valid input VAT is already stated as ₱74,500. What net VAT is payable?","choices":["₱73,340","₱132,000","₱57,500","₱123,060"],"correctIndex":2,"solutionSteps":["Step 1: Extract output VAT as ₱1,232,000 × 12/112 = ₱132,000.","Step 2: Subtract creditable input VAT of ₱74,500 = ₱57,500."],"boardTrap":"Applying 12% to a VAT-inclusive total overstates output. Do not multiply already-stated input VAT by 12% again.","citation":"NIRC Secs. 108(A) and 110(A), RA 11976"},{"id":"tax-035","subject":"TAX","topic":"Invoice-Based VAT (EOPT)","difficulty":"Moderate","question":"VATable goods with a ₱260,000 exclusive list price carry a ₱20,000 unconditional discount stated on the invoice. What is output VAT?","choices":["₱31,200","₱28,800","₱25,714.29","₱33,600"],"correctIndex":1,"solutionSteps":["Step 1: Exclude the qualifying contemporaneous discount. Net gross sales are ₱240,000.","Step 2: Apply 12% = ₱28,800."],"boardTrap":"The stem gives exclusive prices. Using 12/112 or taxing the undiscounted price uses the wrong base.","citation":"NIRC Sec. 106(D), RA 11976"},{"id":"tax-036","subject":"TAX","topic":"Invoice-Based VAT (EOPT)","difficulty":"Moderate","question":"A VAT-registered engineer grants a ₱75,000 exclusive allowance on March services and issues the credit memorandum in April. How much may the April-quarter output VAT be reduced?","choices":["₱9,000","₱0, because the sale was in March","₱8,035.71","₱75,000"],"correctIndex":0,"solutionSteps":["Step 1: Deduct the allowance in the quarter of the credit memorandum.","Step 2: The output reduction is ₱75,000 × 12% = ₱9,000."],"boardTrap":"The original invoice date does not pull an April allowance back into Q1.","citation":"NIRC Sec. 108(C), RA 11976"},{"id":"tax-037","subject":"TAX","topic":"Invoice-Based VAT (EOPT)","difficulty":"Moderate","question":"A fully VAT-paid ₱336,000 VAT-inclusive receivable remains unpaid after its agreed deadline. The seller meets all requirements for the output VAT credit. What VAT amount may be credited?","choices":["₱36,000","₱40,320","₱336,000","₱30,000"],"correctIndex":0,"solutionSteps":["Step 1: Isolate the original output VAT from the inclusive receivable.","Step 2: ₱336,000 × 12/112 = ₱36,000."],"boardTrap":"The credit is the associated output VAT, not the entire receivable or 12% of the inclusive balance.","citation":"NIRC Sec. 110(D), RA 11976"},{"id":"tax-038","subject":"TAX","topic":"Invoice-Based VAT (EOPT)","difficulty":"Moderate","question":"A seller invoices ₱620,000 VAT-exclusive goods price before separately stated excise tax of ₱48,000 that is included in the customer’s consideration. Compute VAT.","choices":["₱74,400","₱71,571.43","₱5,760","₱80,160"],"correctIndex":3,"solutionSteps":["Step 1: Excise is part of gross sales for VAT. Add ₱48,000 to ₱620,000.","Step 2: Multiply ₱668,000 by 12% = ₱80,160."],"boardTrap":"VAT itself is outside the basis. Separately showing excise does not remove it.","citation":"NIRC Sec. 106(A), RA 11976"},{"id":"tax-039","subject":"TAX","topic":"Invoice-Based VAT (EOPT)","difficulty":"Difficult","question":"A fully VAT-paid receivable was due June 20. It remains uncollected through September. The seller deducted its VAT component under Sec. 34(E). May the seller claim the output VAT credit for Q3?","choices":["Yes, any invoice unpaid one quarter qualifies regardless of deductions.","Yes, if the claim is moved back to Q2.","No, because it already claimed the VAT component as a Sec. 34(E) deduction.","It must claim an input VAT credit instead."],"correctIndex":2,"solutionSteps":["Step 1: Q3 is the quarter after lapse of the due date.","Step 2: The same VAT component cannot qualify for the output credit after being claimed as a Sec. 34(E) deduction."],"boardTrap":"Meeting the timing requirement does not cure double recognition of the VAT benefit.","citation":"NIRC Sec. 110(D), RA 11976"},{"id":"tax-040","subject":"TAX","topic":"Invoice-Based VAT (EOPT)","difficulty":"Difficult","question":"Q4 standard-rated services are ₱870,000 exclusive. The seller recovers ₱112,000 inclusive on a prior credited invoice and qualifies for ₱18,000 output VAT credit on a different overdue invoice. Valid Q4 input VAT is ₱37,000. Compute VAT payable.","choices":["₱49,400","₱61,400","₱79,400","₱97,400"],"correctIndex":1,"solutionSteps":["Step 1: Compute ₱104,400 base output and restore ₱12,000 on recovery.","Step 2: Deduct ₱18,000 output credit and ₱37,000 input. Net ₱61,400."],"boardTrap":"Omitting recovery gives ₱49,400. Skipping the new credit gives ₱79,400.","citation":"NIRC Secs. 108 and 110(D), RA 11976"},{"id":"tax-041","subject":"TAX","topic":"Invoice-Based VAT (EOPT)","difficulty":"Difficult","question":"A two-year monthly maintenance contract has a ₱280,000 exclusive August fee. An invoice shows an unconditional ₱14,000 discount. A later ₱18,000 allowance on that month is documented only in September. August collection is ₱100,000. Before credits, what output is attributable to the August invoice at issuance?","choices":["₱29,760","₱31,920","₱12,000","₱33,600"],"correctIndex":1,"solutionSteps":["Step 1: Start with the service rendered and subtract the contemporaneous discount, leaving ₱266,000.","Step 2: Apply 12% = ₱31,920. Recognize the separate allowance when documented."],"boardTrap":"Do not net future credits into invoice-date output or apply the collection basis.","citation":"NIRC Sec. 108(A) and (C), RA 11976"},{"id":"tax-042","subject":"TAX","topic":"Invoice-Based VAT (EOPT)","difficulty":"Difficult","question":"A firm reports ₱1.12 million VAT-exclusive rendered services and ₱56,000 qualified third-party pass-throughs. It has ₱42,400 creditable input supported by compliant VAT invoices plus ₱15,200 claimed solely from an unconverted collection receipt with no valid invoice. Compute net VAT based on those facts.","choices":["₱92,000","₱76,800","₱98,720","₱82,400"],"correctIndex":0,"solutionSteps":["Step 1: Compute output of ₱134,400, excluding the qualified pass-through.","Step 2: Deduct only ₱42,400 properly evidenced input VAT, leaving ₱92,000."],"boardTrap":"The unsupported receipt is not a substitute for valid invoice evidence in this scenario.","citation":"NIRC Secs. 108(A), 110(A) and 113, RA 11976"},{"id":"tax-043","subject":"TAX","topic":"Tax Administration (EOPT)","difficulty":"Easy","question":"A taxpayer has ₱3 million in annual gross business sales for EOPT classification. Which group applies at that boundary?","choices":["Micro","Medium","Large","Small"],"correctIndex":3,"solutionSteps":["Step 1: Apply the class boundary to gross sales.","Step 2: ₱3 million enters Small, which extends to less than ₱20 million."],"boardTrap":"Micro stops below, rather than at, ₱3 million.","citation":"NIRC Sec. 21(B), RA 11976"},{"id":"tax-044","subject":"TAX","topic":"Tax Administration (EOPT)","difficulty":"Easy","question":"For an eligible micro taxpayer’s ordinary nonfraud late payment, which reduced pair applies?","choices":["25% surcharge and half the interest rate","10% surcharge and no interest","10% civil surcharge and half the ordinary interest rate","10% surcharge and full ordinary interest"],"correctIndex":2,"solutionSteps":["Step 1: Apply both reduced rules to an eligible micro taxpayer.","Step 2: The ordinary interest rate is halved, while statutory interest still accrues."],"boardTrap":"The 50% reduction cuts the interest rate by half. It is not a 50% charge or an exemption.","citation":"RA 11976 Sec. 45(b)–(c), NIRC Secs. 248–249"},{"id":"tax-045","subject":"TAX","topic":"Tax Administration (EOPT)","difficulty":"Easy","question":"Which former registration charge did EOPT remove?","choices":["VAT registration itself","Documentary stamp tax on all agreements","The ₱500 annual BIR registration fee","Every local business permit fee"],"correctIndex":2,"solutionSteps":["Step 1: Identify the formerly annual national registration fee.","Step 2: The duty to register continues even though the annual fee was removed."],"boardTrap":"Removing a fee does not cancel registration or alter unrelated LGU fees.","citation":"NIRC Sec. 236, RA 11976"},{"id":"tax-046","subject":"TAX","topic":"Tax Administration (EOPT)","difficulty":"Easy","question":"What is the prescribed maximum length of the simplified Sec. 51 income tax return for micro and small taxpayers?","choices":["Four pages","Two pages","One page","Five pages"],"correctIndex":1,"solutionSteps":["Step 1: Identify the targeted taxpayer classes.","Step 2: The simplified form is capped at two pages."],"boardTrap":"The four-page ceiling under an earlier rule does not answer the targeted simplification.","citation":"RA 11976 Sec. 45(a), NIRC Sec. 51"},{"id":"tax-047","subject":"TAX","topic":"Tax Administration (EOPT)","difficulty":"Moderate","question":"A proprietor’s sales for classification are ₱19,999,999 this year and exactly ₱20,000,000 the next. What are the respective classes?","choices":["Small then Medium","Small then Small","Micro then Small","Medium then Large"],"correctIndex":0,"solutionSteps":["Step 1: ₱19,999,999 is below the Small upper boundary.","Step 2: ₱20 million is the first amount within Medium."],"boardTrap":"Read the exclusive upper end of Small rather than rounding sales to whole millions.","citation":"NIRC Sec. 21(B), RA 11976"},{"id":"tax-048","subject":"TAX","topic":"Tax Administration (EOPT)","difficulty":"Moderate","question":"An eligible small taxpayer pays ₱320,000 principal tax one quarter late. Use an ordinary annual interest rate of 12% and simple quarter-year accrual. No fraud. Compute surcharge plus interest.","choices":["₱41,600","₱84,800","₱32,000","₱36,800"],"correctIndex":3,"solutionSteps":["Step 1: Surcharge is ₱320,000 × 10% = ₱32,000.","Step 2: Interest is ₱320,000 × 6% × 1/4 = ₱4,800. Total ₱36,800."],"boardTrap":"A half-rate applies to interest only. The elapsed fraction still matters.","citation":"RA 11976 Sec. 45(b)–(c), NIRC Secs. 248–249"},{"id":"tax-049","subject":"TAX","topic":"Tax Administration (EOPT)","difficulty":"Moderate","question":"An eligible micro taxpayer owes ₱180,000 principal. The problem gives unreduced ordinary interest of ₱13,500 before EOPT and assumes no fraud. What total is due including tax?","choices":["₱211,500","₱231,750","₱198,000","₱204,750"],"correctIndex":3,"solutionSteps":["Step 1: Add a ₱18,000 surcharge and ₱6,750 reduced interest.","Step 2: Total with principal is ₱204,750."],"boardTrap":"Do not halve principal or leave the ordinary interest unreduced.","citation":"RA 11976 Sec. 45(b)–(c), NIRC Secs. 248–249"},{"id":"tax-050","subject":"TAX","topic":"Tax Administration (EOPT)","difficulty":"Moderate","question":"A retailer has ₱28 million gross sales but only ₱1.4 million profit. Which EOPT classification governs on these figures?","choices":["Micro","Small","Medium","Large"],"correctIndex":2,"solutionSteps":["Step 1: Classify by gross sales rather than profit.","Step 2: ₱28 million lies within ₱20 million to below ₱1 billion."],"boardTrap":"Choosing Micro from net profit applies the wrong financial measure.","citation":"NIRC Sec. 21(B), RA 11976"},{"id":"tax-051","subject":"TAX","topic":"Tax Administration (EOPT)","difficulty":"Moderate","question":"A taxpayer is eligible and uses an authorized electronic channel to file and timely pay an annual return. Does EOPT impose a surcharge solely because it was not filed at the old assigned collection district?","choices":["Yes, any filing outside the old district remains wrong venue.","No, the authorized channel is permitted.","Yes, unless the income was passive.","Yes, unless filed and paid manually."],"correctIndex":1,"solutionSteps":["Step 1: Check authorization of the channel and factual timeliness.","Step 2: EOPT permits prescribed electronic and manual options under amended venue rules."],"boardTrap":"Do not carry forward former wrong-venue treatment to a permitted filing.","citation":"NIRC Secs. 51 and 56, RA 11976"},{"id":"tax-052","subject":"TAX","topic":"Tax Administration (EOPT)","difficulty":"Moderate","question":"An eligible small taxpayer is assessed the reduced statutory fine for one ordinary covered information-return failure. What per-failure amount applies under EOPT?","choices":["₱500","₱1,000","₱2,000","10% of unpaid tax"],"correctIndex":0,"solutionSteps":["Step 1: Identify the information-return violation and the eligible taxpayer.","Step 2: Apply the reduced ₱500 fine for the covered failure."],"boardTrap":"Section 248 late tax surcharge is a different sanction from the Section 250 information-return fine.","citation":"RA 11976 Sec. 45(d), NIRC Sec. 250"},{"id":"tax-053","subject":"TAX","topic":"Tax Administration (EOPT)","difficulty":"Difficult","question":"Two businesses each pay ₱400,000 principal tax one half-year late without fraud. One has ₱19.9 million gross sales and the other exactly ₱20 million. Ordinary surcharge is 25% and annual interest 12%. How much greater are the second business’s penalties?","choices":["₱72,000","₱60,000","₱12,000","₱84,000"],"correctIndex":0,"solutionSteps":["Step 1: Small: ₱40,000 surcharge + ₱12,000 interest = ₱52,000.","Step 2: Medium: ₱100,000 + ₱24,000 = ₱124,000. Difference ₱72,000."],"boardTrap":"The class boundary changes both surcharge and interest. Comparing only surcharges misses ₱12,000.","citation":"RA 11976 Sec. 45, NIRC Secs. 21, 248 and 249"},{"id":"tax-054","subject":"TAX","topic":"Tax Administration (EOPT)","difficulty":"Difficult","question":"A service provider with ₱8 million statutory classification gross sales is already required and registered for VAT. Does being Small remove its invoice or VAT obligation?","choices":["Yes. Any Small taxpayer is VAT-exempt.","Only the rate drops to 10%.","It may switch entirely to collection-based VAT.","No. It remains subject to ordinary VAT and invoicing rules on taxable sales."],"correctIndex":3,"solutionSteps":["Step 1: Apply the ₱3 million to below ₱20 million administrative classification.","Step 2: Independently apply VAT registration and the invoice rule to the taxable activity."],"boardTrap":"EOPT size benefits do not turn all Small sales into VAT-exempt transactions.","citation":"NIRC Secs. 21(B), 108 and 236, RA 11976"},{"id":"tax-055","subject":"TAX","topic":"Tax Administration (EOPT)","difficulty":"Difficult","question":"A Small taxpayer owes ₱600,000. A bona fide covered late-payment event has ordinary computed interest of ₱36,000. What cash is required to pay the principal plus the surcharge and interest after EOPT?","choices":["₱696,000","₱768,000","₱678,000","₱618,000"],"correctIndex":2,"solutionSteps":["Step 1: Compute the surcharge at 10%, or ₱60,000.","Step 2: Use half the ordinary interest, or ₱18,000. Add both to principal for ₱678,000."],"boardTrap":"Halving only surcharge, applying 25%, or treating late interest as the sole penalty each changes the required payment.","citation":"RA 11976 Sec. 45, NIRC Secs. 248(A) and 249"},{"id":"tax-056","subject":"TAX","topic":"Tax Administration (EOPT)","difficulty":"Difficult","question":"An eligible Micro taxpayer willfully files a false return. Which surcharge rule should an examiner consider rather than automatically using the ordinary 10% reduced late-payment surcharge?","choices":["The ordinary 10% rate in all cases","The 50% fraud surcharge under Sec. 248(B), if its elements are met","Half of 50% because interest is reduced","No surcharge whenever gross sales are under ₱3 million"],"correctIndex":1,"solutionSteps":["Step 1: Distinguish willful false filing from ordinary nonfraud lateness.","Step 2: Apply the separate 50% fraud rule when the statutory facts are met."],"boardTrap":"The reduced ordinary surcharge and reduced interest provisions cannot be used to convert a fraud case into a routine late filing.","citation":"RA 11976 Sec. 45(b), BIR RR 6-2024"},{"id":"tax-057","subject":"TAX","topic":"Income & Transfer Taxes (TRAIN)","difficulty":"Easy","question":"What regular income tax applies to exactly ₱250,000 taxable compensation under the schedule in effect since 2023?","choices":["₱37,500","₱0","₱22,500","₱20,000"],"correctIndex":1,"solutionSteps":["Step 1: Read the first bracket inclusively to ₱250,000.","Step 2: No tax applies within that bracket."],"boardTrap":"15% applies to the excess in the next bracket, rather than to the first ₱250,000.","citation":"NIRC Sec. 24(A)(2)(a), RA 10963"},{"id":"tax-058","subject":"TAX","topic":"Income & Transfer Taxes (TRAIN)","difficulty":"Easy","question":"What is the combined exclusion ceiling for covered 13th-month pay and other benefits?","choices":["₱90,000","₱82,000","₱250,000","₱30,000"],"correctIndex":0,"solutionSteps":["Step 1: Identify which benefits fall into this statutory category.","Step 2: Apply the ₱90,000 combined exclusion."],"boardTrap":"Do not use an older benefits cap or the first regular income-tax bracket.","citation":"NIRC Sec. 32(B)(7)(e), RA 10963"},{"id":"tax-059","subject":"TAX","topic":"Income & Transfer Taxes (TRAIN)","difficulty":"Easy","question":"A purely self-employed individual qualifies for and elects the 8% option. It is in lieu of which taxes on the eligible activity?","choices":["The graduated tax and all local taxes","Income tax withholding only","Percentage tax only","The graduated income tax and the Sec. 116 percentage tax"],"correctIndex":3,"solutionSteps":["Step 1: Identify the eligible business income and the valid election.","Step 2: The option substitutes for the specified national income and percentage taxes."],"boardTrap":"The option does not create a blanket exemption from unrelated taxes.","citation":"NIRC Sec. 24(A)(2)(b), RA 10963"},{"id":"tax-060","subject":"TAX","topic":"Income & Transfer Taxes (TRAIN)","difficulty":"Easy","question":"Before considering a qualifying family home, what resident-decedent standard deduction should an executor use?","choices":["₱10 million","₱500,000","₱5 million","₱250,000"],"correctIndex":2,"solutionSteps":["Step 1: Identify a resident estate subject to Sec. 86(A).","Step 2: Use its ₱5 million standard deduction before applying the estate rate to net estate."],"boardTrap":"The separate family-home cap is ₱10 million.","citation":"NIRC Secs. 84 and 86(A)(1), RA 10963"},{"id":"tax-061","subject":"TAX","topic":"Income & Transfer Taxes (TRAIN)","difficulty":"Easy","question":"For covered gifts by one donor in one calendar year, how many ₱250,000 annual exclusions does the donor receive?","choices":["One per donee","One for domestic and one for foreign gifts","One for the calendar year","One every time a return is filed"],"correctIndex":2,"solutionSteps":["Step 1: Aggregate the donor’s qualifying net gifts by calendar year.","Step 2: Apply one annual exclusion before calculating the tax."],"boardTrap":"Multiple donees or returns do not multiply the exclusion.","citation":"NIRC Sec. 99(A), RA 10963"},{"id":"tax-062","subject":"TAX","topic":"Income & Transfer Taxes (TRAIN)","difficulty":"Moderate","question":"A resident’s taxable compensation is ₱865,000. The applicable bracket is ₱102,500 plus 25% of the excess over ₱800,000. What tax is due before withholding credits?","choices":["₱216,250","₱118,750","₱115,500","₱16,250"],"correctIndex":1,"solutionSteps":["Step 1: Compute the excess ₱65,000 and incremental tax ₱16,250.","Step 2: Add the bracket base ₱102,500 to get ₱118,750."],"boardTrap":"Do not apply the marginal rate to all compensation or ignore the bracket’s base.","citation":"NIRC Sec. 24(A)(2)(a), RA 10963"},{"id":"tax-063","subject":"TAX","topic":"Income & Transfer Taxes (TRAIN)","difficulty":"Moderate","question":"A qualified purely self-employed resident elects 8%. Gross sales are ₱980,000, qualifying other non-operating income is ₱46,000, and business expenses are ₱280,000. What tax is due before credits?","choices":["₱62,080","₱58,400","₱39,680","₱82,080"],"correctIndex":0,"solutionSteps":["Step 1: Start from ₱980,000 + ₱46,000, then deduct ₱250,000 for the allowed reduction.","Step 2: Apply 8% to ₱776,000 = ₱62,080."],"boardTrap":"This election uses an eligible gross base. Do not deduct itemized operating expenses.","citation":"NIRC Sec. 24(A)(2)(b), RA 10963"},{"id":"tax-064","subject":"TAX","topic":"Income & Transfer Taxes (TRAIN)","difficulty":"Moderate","question":"A resident gives ₱190,000 in March and ₱410,000 in July, both otherwise taxable before annual exclusion. What cumulative donor’s tax is due if none has been paid?","choices":["₱9,600","₱36,000","₱24,600","₱21,000"],"correctIndex":3,"solutionSteps":["Step 1: Aggregate net gifts to ₱600,000 and subtract ₱250,000.","Step 2: ₱350,000 × 6% = ₱21,000."],"boardTrap":"Do not isolate the July gift or lose the annual exclusion.","citation":"NIRC Sec. 99(A), RA 10963"},{"id":"tax-065","subject":"TAX","topic":"Income & Transfer Taxes (TRAIN)","difficulty":"Moderate","question":"An employee has ₱690,000 regular taxable pay before ₱105,000 of combined qualifying 13th-month pay and other benefits. There are no other exclusions. What taxable compensation results?","choices":["₱690,000","₱795,000","₱713,000","₱705,000"],"correctIndex":3,"solutionSteps":["Step 1: Only ₱90,000 of the benefits qualify for exclusion.","Step 2: Add the excess ₱15,000 to ₱690,000 = ₱705,000."],"boardTrap":"Do not exclude the whole benefits package or use the former ₱82,000 cap.","citation":"NIRC Sec. 32(B)(7)(e), RA 10963"},{"id":"tax-066","subject":"TAX","topic":"Income & Transfer Taxes (TRAIN)","difficulty":"Difficult","question":"An eligible mixed-income individual elects 8% on ₱560,000 qualified business gross sales. Taxable compensation is ₱620,000, taxed at ₱22,500 plus 20% over ₱400,000. What combined income tax is due before credits?","choices":["₱91,300","₱66,500","₱111,300","₱89,600"],"correctIndex":2,"solutionSteps":["Step 1: Compute compensation tax of ₱22,500 + ₱44,000 = ₱66,500.","Step 2: Apply 8% to the whole ₱560,000 business base = ₱44,800. Total ₱111,300."],"boardTrap":"The purely self-employed ₱250,000 subtraction does not apply again to the mixed-income business base.","citation":"NIRC Sec. 24(A)(2)(a) and (c), RA 10963"},{"id":"tax-067","subject":"TAX","topic":"Income & Transfer Taxes (TRAIN)","difficulty":"Difficult","question":"A resident decedent has ₱22.4 million gross estate, including a ₱12.6 million qualifying family home, and ₱1.2 million other allowable deductions. Assume no other adjustments. What estate tax is due?","choices":["₱216,000","₱372,000","₱672,000","₱972,000"],"correctIndex":1,"solutionSteps":["Step 1: Deduct ₱5 million standard, ₱10 million capped family home, and ₱1.2 million other deductions.","Step 2: Net estate ₱6.2 million × 6% = ₱372,000."],"boardTrap":"Claiming the full ₱12.6 million creates ₱216,000. The family-home cap and standard deduction are distinct.","citation":"NIRC Secs. 84 and 86(A)(1), (7), RA 10963"},{"id":"tax-068","subject":"TAX","topic":"Income & Transfer Taxes (TRAIN)","difficulty":"Difficult","question":"A donor gave ₱520,000 in April and paid the tax. In December of the same year another ₱380,000 qualifying gift was made. No other gifts. What additional tax is payable on the later return?","choices":["₱22,800","₱39,000","₱7,800","₱54,000"],"correctIndex":0,"solutionSteps":["Step 1: Annual tax recalculated on ₱900,000 − ₱250,000 is ₱39,000.","Step 2: Subtract April tax of (₱520,000 − ₱250,000) × 6% = ₱16,200. Pay ₱22,800."],"boardTrap":"Subtract prior tax paid. Do not use a second annual exclusion or pay cumulative tax twice.","citation":"NIRC Secs. 99(A) and 103(B), RA 10963"},{"id":"tax-069","subject":"TAX","topic":"Income & Transfer Taxes (TRAIN)","difficulty":"Difficult","question":"An employee’s otherwise taxable pay is ₱780,000, plus ₱140,000 qualifying 13th-month pay and other benefits. The bracket for the resulting base is ₱102,500 plus 25% over ₱800,000. What regular tax is due?","choices":["₱110,000","₱132,500","₱98,500","₱112,000"],"correctIndex":0,"solutionSteps":["Step 1: Add non-excluded benefits of ₱50,000, resulting in a ₱830,000 base.","Step 2: Apply ₱102,500 + 25% × ₱30,000 = ₱110,000."],"boardTrap":"Taxing all the benefits yields ₱132,500, while using the old benefits cap moves the base too high.","citation":"NIRC Secs. 24(A)(2)(a) and 32(B)(7)(e), RA 10963"},{"id":"tax-070","subject":"TAX","topic":"Income & Transfer Taxes (TRAIN)","difficulty":"Difficult","question":"Ana and Bea each properly elect 8% on ₱900,000 eligible business gross sales and ₱20,000 eligible other non-operating income. Ana is purely self-employed. Bea also has taxable compensation. Compare tax attributable to business income only.","choices":["They pay the same.","Ana pays ₱20,000 more.","Bea pays ₱1,600 less.","Bea pays ₱20,000 more."],"correctIndex":3,"solutionSteps":["Step 1: Ana’s taxable business base is ₱670,000 after the applicable reduction. Bea’s is ₱920,000.","Step 2: The rate is 8% for both, so the difference is 8% × ₱250,000 = ₱20,000."],"boardTrap":"Mixed-income compensation follows its separate schedule. Do not include it in this business-only comparison.","citation":"NIRC Sec. 24(A)(2)(b)–(c), RA 10963"}]'),Mf=JSON.parse('[{"id":"rfbt-001","subject":"RFBT","topic":"Obligations","difficulty":"Easy","question":"Three contractors owe one divisible debt. What is presumed in the absence of solidarity by law, stipulation or nature?","choices":["Joint obligation","Solidary obligation","Accessory guaranty only","Alternative obligation"],"correctIndex":0,"solutionSteps":["Step 1: Check the recognized sources of solidarity.","Step 2: Absent any, each debtor is liable for its share."],"boardTrap":"Plural debtors do not necessarily owe the whole amount individually.","citation":"Civil Code arts. 1207–1208"},{"id":"rfbt-002","subject":"RFBT","topic":"Obligations","difficulty":"Easy","question":"A creditor has three solidary debtors. Against whom may the unpaid claim generally be enforced?","choices":["Only all three jointly in one complaint","Only the debtor whose share is largest","Only the first signatory","Any one, some, or all, until fully collected"],"correctIndex":3,"solutionSteps":["Step 1: Solidarity gives the creditor a choice of whom to pursue.","Step 2: Do not collect more than the entire debt."],"boardTrap":"The debtors’ internal allocation does not restrict the creditor’s selection.","citation":"Civil Code art. 1216"},{"id":"rfbt-003","subject":"RFBT","topic":"Obligations","difficulty":"Easy","question":"What generally places a debtor in delay when no recognized exception applies?","choices":["The creditor’s private thought that the debtor is late","A demand by an unrelated stranger without authority","Judicial or extrajudicial demand","The debtor’s signature on every contract"],"correctIndex":2,"solutionSteps":["Step 1: Distinguish the due date from delay in the legal sense.","Step 2: Demand may be judicial or extrajudicial."],"boardTrap":"Not all due dates dispense with demand.","citation":"Civil Code art. 1169"},{"id":"rfbt-004","subject":"RFBT","topic":"Obligations","difficulty":"Moderate","question":"A, B and C jointly owe ₱420,000 in equal shares. C is insolvent. What may the creditor ordinarily recover from A under the joint obligation?","choices":["₱210,000","₱140,000","₱280,000","₱420,000"],"correctIndex":1,"solutionSteps":["Step 1: Divide the divisible obligation equally.","Step 2: C’s insolvency does not enlarge A’s joint share."],"boardTrap":"Do not import the solidary debtor contribution rule.","citation":"Civil Code arts. 1207–1208"},{"id":"rfbt-005","subject":"RFBT","topic":"Obligations","difficulty":"Moderate","question":"A and B are solidary, with equal internal shares. A pays the ₱180,000 debt in full when due. Before interest, what can A ordinarily recover from B?","choices":["₱180,000","₱90,000","₱0 because solidarity makes A solely liable","₱45,000"],"correctIndex":1,"solutionSteps":["Step 1: Payment extinguishes the external claim.","Step 2: A may recover B’s internal half of ₱180,000."],"boardTrap":"The creditor’s right to demand the whole amount differs from internal reimbursement.","citation":"Civil Code arts. 1216–1217"},{"id":"rfbt-006","subject":"RFBT","topic":"Obligations","difficulty":"Moderate","question":"A buyer promises a bonus if a factory passes a valid inspection, then deliberately denies the inspector access to avoid payment. What is the effect on the condition?","choices":["Deemed fulfilled if the obligor voluntarily prevented it.","Deemed impossible from formation automatically.","Condition fails, so the buyer always wins.","Automatically deferred one year."],"correctIndex":0,"solutionSteps":["Step 1: Identify voluntary prevention by the party bound.","Step 2: Apply constructive fulfillment under the article."],"boardTrap":"The obligor cannot rely on literal failure caused by its own prevention.","citation":"Civil Code art. 1186"},{"id":"rfbt-007","subject":"RFBT","topic":"Obligations","difficulty":"Moderate","question":"Two businesses are each other’s principal money creditors. Both debts are due, liquidated and demandable, with no third-party impediment. A owes B ₱180,000 and B owes A ₱145,000. What remains after legal compensation?","choices":["Both debts remain wholly outstanding.","B owes A ₱35,000.","A owes B ₱145,000.","A owes B ₱35,000."],"correctIndex":3,"solutionSteps":["Step 1: Confirm the requisites for reciprocal compensation.","Step 2: Extinguish both up to ₱145,000, leaving A’s ₱35,000 excess debt."],"boardTrap":"Setoff is concurrent only to the overlapping amount.","citation":"Civil Code arts. 1278–1279"},{"id":"rfbt-008","subject":"RFBT","topic":"Obligations","difficulty":"Difficult","question":"A, B and C are equally liable internally on a ₱300,000 solidary debt. A pays all when due. C is insolvent and B is solvent. What can A recover in principal from B?","choices":["₱100,000","₱200,000","₱150,000","₱50,000"],"correctIndex":2,"solutionSteps":["Step 1: B’s own share is ₱100,000.","Step 2: Allocate C’s uncollectible ₱100,000 proportionately between A and B, adding ₱50,000 to B’s burden."],"boardTrap":"Skipping insolvency sharing understates recovery, while charging B for all of C’s share overstates it.","citation":"Civil Code art. 1217"},{"id":"rfbt-009","subject":"RFBT","topic":"Obligations","difficulty":"Difficult","question":"A distinct machine promised by three solidary debtors is destroyed through A’s negligence before delivery. What can the innocent creditor generally claim?","choices":["Only the price from A, with all other debtors discharged as to the creditor.","No recovery because a determinate thing was lost.","The price and damages from the solidary debtors, subject to their recourse against A.","Only equal undivided amounts from each debtor as joint debtors."],"correctIndex":2,"solutionSteps":["Step 1: Loss by fault does not extinguish the obligation.","Step 2: Solidary debtors answer externally and may seek recourse from the debtor at fault."],"boardTrap":"Fortuitous destruction without fault or delay is a different case.","citation":"Civil Code arts. 1221 and 1262"},{"id":"rfbt-010","subject":"RFBT","topic":"Obligations","difficulty":"Difficult","question":"A trader promised 200 standard cement sacks, with no segregation or source limitation. The trader’s only warehouse burns without fault. Is delivery automatically extinguished?","choices":["Yes. The warehouse fire ends every duty to give.","No. Loss of the trader’s stock does not extinguish a generic obligation.","Yes unless the buyer proves intentional destruction.","Yes if the trader had not sent a written invoice."],"correctIndex":1,"solutionSteps":["Step 1: Classify the object as generic, based on fungible sacks rather than specific goods.","Step 2: Loss of the debtor’s own stock does not eliminate the generic duty."],"boardTrap":"The determinate-thing rule does not normally apply to generic goods.","citation":"Civil Code arts. 1165 and 1263"},{"id":"rfbt-011","subject":"RFBT","topic":"Contracts","difficulty":"Easy","question":"What are the essential requisites of a contract?","choices":["Consent, certain object, and cause","Notarization, registration, and bond","Receipt, delivery, and full payment in every case","Consent, legal venue, and witnesses"],"correctIndex":0,"solutionSteps":["Step 1: Identify the meeting of minds, certain object and legal cause.","Step 2: Special forms may be required for particular contracts."],"boardTrap":"Common documentary formalities are not universal essential requisites.","citation":"Civil Code art. 1318"},{"id":"rfbt-012","subject":"RFBT","topic":"Contracts","difficulty":"Easy","question":"What is the general status of a contract with consent vitiated by intimidation?","choices":["Void from inception in every case","Rescissible only for lesion","Automatically unenforceable for lack of written evidence","Voidable"],"correctIndex":3,"solutionSteps":["Step 1: Intimidation is a defect in consent.","Step 2: A voidable contract binds unless annulled and may be ratified."],"boardTrap":"Do not confuse an impaired consent with an illegal object or cause.","citation":"Civil Code arts. 1390 and 1409"},{"id":"rfbt-013","subject":"RFBT","topic":"Contracts","difficulty":"Easy","question":"Can a contract whose cause is unlawful be validated by ratification?","choices":["Yes, after the first payment.","Yes, by the party who drafted it alone.","Yes, by using a public instrument.","No, a void contract cannot be ratified."],"correctIndex":3,"solutionSteps":["Step 1: An unlawful cause falls under the void category.","Step 2: Ratification cannot cure that defect."],"boardTrap":"Ratification applies to some voidable or unenforceable situations, not unlawful cause.","citation":"Civil Code art. 1409"},{"id":"rfbt-014","subject":"RFBT","topic":"Contracts","difficulty":"Moderate","question":"A seller offers 10 machines at ₱30,000 each. The buyer replies that it accepts only at ₱27,000. What is that reply?","choices":["Absolute acceptance completing the ₱30,000 sale","Void sale for unlawful cause","Counteroffer","Legal tender of the ₱27,000 price"],"correctIndex":2,"solutionSteps":["Step 1: Compare the acceptance with the offered terms.","Step 2: A qualified acceptance is a counteroffer."],"boardTrap":"Agreement on quantity does not cure disagreement on price.","citation":"Civil Code arts. 1319 and 1321"},{"id":"rfbt-015","subject":"RFBT","topic":"Contracts","difficulty":"Moderate","question":"A clerk without authority purports to sign a supply deal on behalf of a company. The other party never revoked it and no authorization or ratification exists. How is it generally classified as against the company?","choices":["Automatically enforceable against the principal","Unenforceable unless properly ratified","Rescissible for economic prejudice only","Voidable due to the principal’s intimidation"],"correctIndex":1,"solutionSteps":["Step 1: Identify the lack of authority to contract in another’s name.","Step 2: Check ratification before enforcing against the purported principal."],"boardTrap":"Unauthorized representation is not the same as voidable consent.","citation":"Civil Code arts. 1317 and 1403(1)"},{"id":"rfbt-016","subject":"RFBT","topic":"Contracts","difficulty":"Moderate","question":"A creditor seeks rescission of a debtor’s transfer in fraud of creditors. The creditor has an adequate separate legal remedy to collect in full. Is rescission generally available as the immediate remedy?","choices":["No. Rescission for this prejudice is subsidiary.","Yes. Any fraudulent transfer must be rescinded first.","Yes. The contract is automatically void on demand.","No. Creditor fraud can never support rescission."],"correctIndex":0,"solutionSteps":["Step 1: Determine whether the claimant has another adequate legal means.","Step 2: Rescission under the cited rule is subsidiary."],"boardTrap":"Fraud of creditors is not identical to fraud vitiating contractual consent.","citation":"Civil Code arts. 1381(3) and 1383"},{"id":"rfbt-017","subject":"RFBT","topic":"Contracts","difficulty":"Moderate","question":"Once intimidation ends, a capable party validly confirms the agreement with full knowledge. What happens to the right to annul for that defect?","choices":["It is extinguished by ratification.","It lasts indefinitely despite ratification.","It converts to a right to rescind for lesion.","It is revived whenever another payment falls due."],"correctIndex":0,"solutionSteps":["Step 1: Check knowledge and cessation of the cause.","Step 2: Valid ratification extinguishes the action to annul and cleanses the defect."],"boardTrap":"Expiry periods do not preserve an action already extinguished by ratification.","citation":"Civil Code arts. 1391, 1392 and 1396"},{"id":"rfbt-018","subject":"RFBT","topic":"Contracts","difficulty":"Difficult","question":"S privately threatened B into a lawful sale. After the threat ceased, B knowingly performed in a manner clearly affirming it. A separate side agreement had an unlawful object. What may ratification accomplish?","choices":["Validate both because the parties continued performance.","Validate only the illegal agreement.","Validate neither because every defect makes a contract void.","Cure the voidable sale, but it cannot validate the unlawful side agreement."],"correctIndex":3,"solutionSteps":["Step 1: Classify intimidation as voidable and test tacit ratification after it ceased.","Step 2: Classify unlawful object
